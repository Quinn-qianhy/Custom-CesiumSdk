<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>马赛克效果</title>
<script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
  <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
    "use script";
    const viewer = new Cesium.Viewer("cesiumContainer", {
      shouldAnimate: true,
    });

    viewer.scene.globe.baseColor = Cesium.Color.DARKOLIVEGREEN
    if (viewer.scene.imageryLayers.length > 0) {
      viewer.scene.imageryLayers.get(0).alpha = 0.35
    }
    //初始定位位置
    viewer.camera.flyTo({
      destination: {
        x: -1469200.109729519,
        y: 5184992.517968472,
        z: 3401307.075514329
      },
      orientation: {
        direction: {
          x: -0.1506058934247801,
          y: -0.8486043414325113,
          z: 0.5071375913572349
        },
        up: {
          x: -0.3126414843742682,
          y: 0.5275447698515602,
          z: 0.7899062083883874
        }
      },
      duration: 3
    })
    const fragmentShaderSource = `
      uniform sampler2D colorTexture; 
      varying vec2 v_textureCoordinates; 
      const int KERNEL_WIDTH = 16; 
      void main(void) 
      { 
          vec2 step = czm_pixelRatio / czm_viewport.zw; 
          vec2 integralPos = v_textureCoordinates - mod(v_textureCoordinates, 8.0 * step); 
          vec3 averageValue = vec3(0.0); 
          for (int i = 0; i < KERNEL_WIDTH; i++) 
          { 
              for (int j = 0; j < KERNEL_WIDTH; j++) 
              { 
                  averageValue += texture2D(colorTexture, integralPos + step * vec2(i, j)).rgb; 
              } 
          } 
          averageValue /= float(KERNEL_WIDTH * KERNEL_WIDTH); 
          gl_FragColor = vec4(averageValue, 1.0); 
      }
      `;
    var tileset = viewer.scene.primitives.add(await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343)));

    const viewModel = {
      MosaicEffectShow: false,
    };
    // ExampleGui 参数面板
    ExampleGui.addToggleButton('MosaicEffectShow', false, function(checked) {
      viewModel.MosaicEffectShow = checked;
      updatePostProcess();
    });
    ExampleGui.finishedLoading();
    const stages = viewer.scene.postProcessStages;
    const MosaicEffectShow = stages.add(
      new Cesium.PostProcessStage({
        fragmentShader: fragmentShaderSource,
      })
    );

    function updatePostProcess() {
      MosaicEffectShow.enabled = Boolean(viewModel.MosaicEffectShow);
    }
    updatePostProcess()


  
})();
</script>
</body>

</html>
