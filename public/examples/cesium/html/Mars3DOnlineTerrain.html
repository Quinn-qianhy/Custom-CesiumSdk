<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>Mars3D在线地形</title>
    <script src="../../../cesium/Cesium.js"></script>
    <script src="../../../defaultAccessToken.js"></script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        ),
        terrain: new Cesium.Terrain(
          Cesium.CesiumTerrainProvider.fromUrl(
            "https://data.mars3d.cn/terrain"
          ),
        )
      });

      //初始定位位置
      viewer.camera.setView({
        destination: {
          x: -1244121.9426581487,
          y: 5085439.458440664,
          z: 3654926.4730463736,
        },
        orientation: {
          heading: 4.788047581496534,
          pitch: -0.4322797689024851,
          roll: 6.27971882399201,
        },
        duration: 1,
      });
    </script>
  </body>
</html>
