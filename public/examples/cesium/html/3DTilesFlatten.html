<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>倾斜摄影开挖</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
</style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    

    <script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
      "use script";

      const viewer = new Cesium.Viewer("cesiumContainer");
      viewer.scene.setTerrain(new Cesium.Terrain(Cesium.CesiumTerrainProvider.fromIonAssetId(1)));

      const tileset = await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343));

       Promise.resolve(tileset)
        .then(function (tileset) {
          viewer.scene.primitives.add(tileset);
          viewer.zoomTo(
            tileset,
            new Cesium.HeadingPitchRange(
              0.0,
              -0.5,
              tileset.boundingSphere.radius * 2.0
            )
          );
        })

      viewer.scene.globe.depthTestAgainstTerrain = true;

      var drawPolygon = new Cesium.DrawHandler(
        viewer,
        Cesium.DrawMode.POLYGON
      );

      function deActivateAll() {
        drawPolygon.deactivate();
      }

      function clearAll() {
        drawPolygon.clear();
      }

      ExampleGui.addToolbarButton(
        "绘制开挖范围，左键开始，右键结束绘制",
        function () {
          deActivateAll();
          drawPolygon.activate();
          drawPolygon &&
            drawPolygon.addDrawCompleteEventListener((result) => {
      drawPolygon.clear();
      result.shift();
      var points = result;
      console.log(result);
      tileset.flatten = true;//是否进行压平。值为true时执行压平
      tileset.flattenHeight = 0;//将高度压到0
      tileset.flattenPositions = result;
      //场景渲染（渲染最新的压平效果）
      viewer.scene.requestRender();
            })
        }
      ); 


      var viewModel = {
        height: 0,
      };
      Cesium.knockout.track(viewModel);
    // ExampleGui 参数面板
    ExampleGui.addSlider('Flatten Height', 0, 1, 1000, 0.1, function(value) {
      viewModel.height = value;
    });
    ExampleGui.finishedLoading();
Cesium.knockout
        .getObservable(viewModel, "height")
        .subscribe(function (height) {
          tileset.flattenHeight = height;//将高度压到0
        }); 
    
})();
</script>
  </body>
</html>
