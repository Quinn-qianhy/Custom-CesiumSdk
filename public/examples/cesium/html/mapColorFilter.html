<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>地图反色滤镜</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer")
    
    //初始定位位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000000.0), //四川省政府
    })
    const baseLayer = viewer.imageryLayers.get(0);
    function openRGB() {
        baseLayer.invertColor = true;
        baseLayer.filterRGB = [70.0, 120.0, 110.0];
        baseLayer.brightness = 3.0
      }
    function closeRGB() {
        baseLayer.invertColor = false;
        baseLayer.filterRGB = [255.0, 255.0, 255.0]
        baseLayer.brightness = 1.0
      }
    ExampleGui.addToolbarButton("打开滤镜", function () {
        openRGB()
      })
    ExampleGui.addToolbarButton("关闭滤镜", function () {
        closeRGB()
      })
  </script>
</body>

</html>
