<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>WMTS图层加载</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <script src="../../../cesium/Cesium.js"></script>
    <script src="../../../defaultAccessToken.js"></script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";

      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
            Cesium.ArcGisBaseMapType.SATELLITE,
            {
              enablePickFeatures: false,
            },
          ),
        ),
      });

      var wmtsImageryLayer = null;

      var wmtsParams = {
        url: "http://172.20.16.213:8889/geoserver/GlWebTest/gwc/service/wmts",
        layer: "GlWebTest:四川行政区划",
        style: "",
        format: "image/png",
        tileMatrixSetID: "EPSG:4326",
        maximumLevel: 18,
        west: 97.34742382600007,
        south: 26.049271889000067,
        east: 108.54240955500006,
        north: 34.31470399700004,
      };

      function applyBaseLayerStyle(layer) {
        layer.saturation = 0;
        layer.hue = 0.56;
        layer.contrast = 1.74;
        layer.brightness = 1.1;
      }

      var baseLayer = viewer.imageryLayers.get(0);
      if (baseLayer) {
        applyBaseLayerStyle(baseLayer);
      } else {
        viewer.imageryLayers.layerAdded.addEventListener(function (layer, index) {
          if (index === 0) {
            applyBaseLayerStyle(layer);
          }
        });
      }

      function buildTileMatrixLabels(tileMatrixSetID, maximumLevel) {
        var labels = [];
        var maxLevel = Math.max(0, Math.floor(Number(maximumLevel) || 0));
        for (var i = 0; i <= maxLevel; i++) {
          labels.push(tileMatrixSetID + ":" + i);
        }
        return labels;
      }

      function removeWmtsLayer() {
        if (wmtsImageryLayer) {
          viewer.imageryLayers.remove(wmtsImageryLayer, true);
          wmtsImageryLayer = null;
        }
      }

      function loadWmtsLayer() {
        var url = String(wmtsParams.url || "").trim();
        var layer = String(wmtsParams.layer || "").trim();
        var tileMatrixSetID = String(wmtsParams.tileMatrixSetID || "").trim();
        if (!url || !layer || !tileMatrixSetID) {
          window.alert("请填写 WMTS 服务地址、图层名称（layer）和矩阵集（tileMatrixSetID）");
          return;
        }

        removeWmtsLayer();

        var providerOptions = {
          url: url,
          layer: layer,
          style: String(wmtsParams.style || "").trim(),
          format: String(wmtsParams.format || "image/png").trim() || "image/png",
          tileMatrixSetID: tileMatrixSetID,
          tileMatrixLabels: buildTileMatrixLabels(
            tileMatrixSetID,
            wmtsParams.maximumLevel,
          ),
        };

        if (tileMatrixSetID.indexOf("4326") >= 0) {
          providerOptions.tilingScheme = new Cesium.GeographicTilingScheme();
        } else if (tileMatrixSetID.indexOf("3857") >= 0 || tileMatrixSetID.indexOf("900913") >= 0) {
          providerOptions.tilingScheme = new Cesium.WebMercatorTilingScheme();
        }

        var west = Number(wmtsParams.west);
        var south = Number(wmtsParams.south);
        var east = Number(wmtsParams.east);
        var north = Number(wmtsParams.north);
        if (
          !isNaN(west) &&
          !isNaN(south) &&
          !isNaN(east) &&
          !isNaN(north)
        ) {
          providerOptions.rectangle = Cesium.Rectangle.fromDegrees(
            west,
            south,
            east,
            north,
          );
        }

        try {
          var provider = new Cesium.WebMapTileServiceImageryProvider(providerOptions);
          wmtsImageryLayer = viewer.imageryLayers.addImageryProvider(provider);

          if (providerOptions.rectangle) {
            viewer.camera.flyTo({
              destination: providerOptions.rectangle,
              duration: 1.5,
            });
          }
        } catch (error) {
          window.alert("WMTS 加载失败：" + (error.message || error));
        }
      }

      ExampleGui.addTextInput("服务地址 url", wmtsParams, "url");
      ExampleGui.addTextInput("图层 layer", wmtsParams, "layer");
      ExampleGui.addTextInput("样式 style", wmtsParams, "style");
      ExampleGui.addTextInput("格式 format", wmtsParams, "format");
      ExampleGui.addTextInput("矩阵集 tileMatrixSetID", wmtsParams, "tileMatrixSetID");
      ExampleGui.addNumberInput(
        "最大级别 maximumLevel",
        wmtsParams,
        "maximumLevel",
        0,
        30,
        1,
      );
      ExampleGui.addNumberInput(
        "西边界 west",
        wmtsParams,
        "west",
        -180,
        180,
        0.000001,
      );
      ExampleGui.addNumberInput(
        "南边界 south",
        wmtsParams,
        "south",
        -90,
        90,
        0.000001,
      );
      ExampleGui.addNumberInput(
        "东边界 east",
        wmtsParams,
        "east",
        -180,
        180,
        0.000001,
      );
      ExampleGui.addNumberInput(
        "北边界 north",
        wmtsParams,
        "north",
        -90,
        90,
        0.000001,
      );
      ExampleGui.addToolbarButton("加载 WMTS", loadWmtsLayer);
      ExampleGui.addToolbarButton("移除 WMTS", removeWmtsLayer);
      ExampleGui.finishedLoading();

      viewer.camera.setView({
        destination: {
          x: -1695124.7670598922,
          y: 8380581.440100933,
          z: 2496803.1463128375,
        },
        orientation: {
          direction: {
            x: 0.12744846786918324,
            y: -0.9620171493693785,
            z: 0.24141228708790413,
          },
          up: {
            x: -0.1580487465736309,
            y: 0.2205891875651592,
            z: 0.9624764953160401,
          },
        },
      });
    </script>
  </body>
</html>
