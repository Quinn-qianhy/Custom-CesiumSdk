<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>视频投放</title>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative
    }

    #toolbar {
      margin: 5px;
      padding: 2px 5px;
      position: absolute
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
    <video id="trailer" muted="" autoplay="" loop="" crossorigin="" controls="">
      <source src="static/examples/cesium/assets/sampleData/video/big-buck-bunny_trailer.mp4" type="video/mp4">
      Your browser does not support the <code>video</code> element.
    </video>
  </div>
  <script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromUrl("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer")
        ),
      showRenderLoopErrors: false,
      shouldAnimate: true,
    });
    viewer.scene.globe.depthTestAgainstTerrain = false;
    var stages = viewer.scene.postProcessStages;

    viewer.scene.brightness = viewer.scene.brightness || stages.add(Cesium.PostProcessStageLibrary
      .createBrightnessStage());
    viewer.scene.brightness.enabled = true;
    viewer.scene.brightness.uniforms.brightness = 1.5;

    var tileset = viewer.scene.primitives.add(
      await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343), {maximumScreenSpaceError: 4})
    );

    Promise.resolve(tileset)
      .then(function (tileset) {
        viewer.zoomTo(
          tileset,
          new Cesium.HeadingPitchRange(
            0.0,
            -0.5,
            tileset.boundingSphere.radius * 2.0
          )
        );
      })

    const videoElement = document.getElementById("trailer");
    videoElement.style.display = "none";
    const synchronizer = new Cesium.VideoSynchronizer({
      clock: viewer.clock,
      element: videoElement,
    });
    
    const wall = viewer.entities.add({
      wall: {
        positions: Cesium.Cartesian3.fromDegreesArray([104.04184594275559, 30.69094242678861, 104.04221999540486, 30.690812452095275]),
        minimumHeights: [0, 0],
        maximumHeights: [54, 54],
        outline: true,
        outlineColor: Cesium.Color.LIGHTGRAY,
        outlineWidth: 4,
        material: videoElement
      }

    })
    var poloygon = viewer.entities.add({
      polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray([
          104.042,
          30.6904,
          104.043,
          30.6904,
          104.043,
          30.69,
          104.042,
          30.69,
        ]),
        material: videoElement
      }
    })
    const sphere = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(104.04223176742825, 30.690862650553516, 64),
      ellipsoid: {
        radii: new Cesium.Cartesian3(10, 10, 10),
        material: videoElement,
      },
    });
    viewer.camera.flyTo({
      destination: {
        x: -1332013.4850557996,
        y: 5326025.802969565,
        z: 3236256.036513076
      },
      orientation: {
        heading: 0.19110712207372949,
        pitch: -0.6203440146165322,
        roll: 0.0006884853380855205
      }
    })

  
})();
</script>
</body>

</html>
