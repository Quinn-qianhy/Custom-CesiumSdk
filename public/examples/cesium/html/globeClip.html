<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>地形开挖</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
</style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
      "use script";

      var viewer = new Cesium.Viewer("cesiumContainer");
      viewer.scene.globe.depthTestAgainstTerrain = true;

      var drawPolygon = new Cesium.DrawHandler(viewer, Cesium.DrawMode.POLYGON);

      function deActivateAll() {
        drawPolygon.deactivate();
      }

      function clearAll() {
        drawPolygon.clear();
      }

      ExampleGui.addToolbarButton("绘制开挖范围，逆时针凸多边形", function() {
        deActivateAll();
        drawPolygon.activate();
        drawPolygon &&
          drawPolygon.addDrawCompleteEventListener(result => {
            drawPolygon.clear();
            result.shift();
            var points = result;
            var pointsLength = points.length;
            / Create center points for each clipping plane
            var clippingPlanes = [];
            for (var i = 0; i < pointsLength; ++i) {
              var nextIndex = (i + 1) % pointsLength;
              var midpoint = Cesium.Cartesian3.add(
                points[i],
                points[nextIndex],
                new Cesium.Cartesian3()
              );
              midpoint = Cesium.Cartesian3.multiplyByScalar(
                midpoint,
                0.5,
                midpoint
              );

              var up = Cesium.Cartesian3.normalize(
                midpoint,
                new Cesium.Cartesian3()
              );
              var right = Cesium.Cartesian3.subtract(
                points[nextIndex],
                midpoint,
                new Cesium.Cartesian3()
              );
              right = Cesium.Cartesian3.normalize(right, right);

              var normal = Cesium.Cartesian3.cross(
                right,
                up,
                new Cesium.Cartesian3()
              );
              normal = Cesium.Cartesian3.normalize(normal, normal);

              / Compute distance by pretending the plane is at the origin
              var originCenteredPlane = new Cesium.Plane(normal, 0.0);
              var distance = Cesium.Plane.getPointDistance(
                originCenteredPlane,
                midpoint
              );

              clippingPlanes.push(new Cesium.ClippingPlane(normal, distance));
            }
            viewer.scene.globe.clippingPlanes = new Cesium.ClippingPlaneCollection(
              {
                planes: clippingPlanes,
                edgeWidth: 1.0,
                edgeColor: Cesium.Color.WHITE,
                enabled: true
              }
            );
            / viewer.entities.add({
            /   name: "Green extruded polygon",
            /   polygon: {
            /     hierarchy: points,
            /     height: -50.0,
            /     material: Cesium.Color.GREEN
            /   }
            / });

            points.push(points[0]);
            var excavationregion_bottom = viewer.scene.primitives.add(
              new Cesium.Primitive({
                geometryInstances: new Cesium.GeometryInstance({
                  geometry: new Cesium.PolygonGeometry({
                    polygonHierarchy: new Cesium.PolygonHierarchy(points),
                    height: -50
                  })
                }),
                appearance: new Cesium.MaterialAppearance({
                  aboveGround: false
                })
              })
            );

            excavationregion_bottom.appearance.material = new Cesium.Material({
              fabric: {
                materials: {
                  diffuseMaterial: {
                    type: "DiffuseMap",
                    uniforms: {
                      image: "../../../examples/cesium/assets/terrainClip/excavationregion_top.jpg"
                    }
                  },
                  bumpMaterial: {
                    type: "BumpMap",
                    uniforms: {
                      image:
                        "../../../examples/cesium/assets/terrainClip/excavationregion_top_Normal.jpg",
                      strength: 0.8
                    }
                  }
                },
                components: {
                  diffuse: "diffuseMaterial.diffuse",
                  specular: 0.01,
                  normal: "bumpMaterial.normal"
                }
              }
            });

            var max = [],
              min = [];
            for (var i = 0; i < points.length; i++) {
              max.push(0);
              min.push(-50);
            }

            var excavationregion = viewer.scene.primitives.add(
              new Cesium.Primitive({
                geometryInstances: new Cesium.GeometryInstance({
                  geometry: new Cesium.WallGeometry({
                    positions: points.reverse(),
                    maximumHeights: max,
                    minimumHeights: min
                  })
                }),
                appearance: new Cesium.MaterialAppearance({
                  aboveGround: false
                })
              })
            );

            excavationregion.appearance.material = new Cesium.Material({
              fabric: {
                materials: {
                  diffuseMaterial: {
                    type: "DiffuseMap",
                    uniforms: {
                      image: "../../../examples/cesium/assets/terrainClip/excavationregion_side.jpg"
                    }
                  },
                  bumpMaterial: {
                    type: "BumpMap",
                    uniforms: {
                      image:
                        "../../../examples/cesium/assets/terrainClip/excavationregion_side_Normal.jpg",
                      strength: 0.8
                    }
                  }
                },
                components: {
                  diffuse: "diffuseMaterial.diffuse",
                  specular: 0.01,
                  normal: "bumpMaterial.normal"
                }
              }
            });
            viewer.scene.globe.backFaceCulling = true;
            viewer.scene.globe.showSkirts = false;
          });
      });
    </script>
  </body>
</html>
