<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>水域面</title>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
  </div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: new Cesium.Terrain(
          new Cesium.ArcGISTiledElevationTerrainProvider({
        url: 'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
      })
        ),
      baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer')
        ),
    });
    viewer.scene.globe.depthTestAgainstTerrain = true; /开启深度检测

    const promise = Cesium.GeoJsonDataSource.load('http://172.20.16.213:8888/geojson/config/water.json')
    promise.then(function (dataSource) {
     
      const entities = dataSource.entities.values
      for (var o = 0; o < entities.length; o++) {
        var entity = entities[o];
        let polygonHierarchy = entity.polygon.hierarchy._value
        let polygon = new Cesium.GeometryInstance({
          geometry: new Cesium.PolygonGeometry({
            polygonHierarchy:polygonHierarchy,
            extrudedHeight: 500
          })
        })

        let primitive = new Cesium.Primitive({
          geometryInstances: polygon,
          appearance: new Cesium.MaterialAppearance({
            material: new Cesium.Material({
              fabric: {
                type: 'Water',
                uniforms: {
                  normalMap: "../../../examples/cesium/assets/material/waterNormals.jpg", / 水正常扰动的法线图
                  frequency: 1000.0, / 控制波数的数字。
                  animationSpeed: 0.05, / 控制水的动画速度的数字。
                  amplitude: 10, / 控制水波振幅的数字。
                  specularIntensity: 0.5, / 控制镜面反射强度的数字。
                  baseWaterColor: Cesium.Color.fromCssColorString("#1E90FF"), / rgba颜色对象基础颜色的水。#00ffff,#00baff,#006ab4
                  blendColor: Cesium.Color.fromCssColorString("#006ab4"), / 从水中混合到非水域时使用的rgba颜色对象。
                }
              }
            }),
          })
        })
        viewer.scene.primitives.add(primitive)  
      }
    })
    viewer.camera.flyTo({
      destination: {
        x: -1341535.5271620702,
        y: 5364762.59249183,
        z: 3172144.6017595828
      },
      orientation: {
        heading: 0.30258331640472313,
        pitch: -0.39388935117784696,
        roll: 0.0009384190201568998
      }
    })
  </script>
</body>

</html>
