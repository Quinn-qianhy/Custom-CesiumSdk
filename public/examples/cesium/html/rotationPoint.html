<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>绕点旋转</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        )
    })

    viewer.scene.globe.depthTestAgainstTerrain = false
   
    var primitive = new Cesium.PointPrimitiveCollection()
    var points = viewer.scene.primitives.add(primitive)

    // 添加单个点
    function addPoint() {
      points.add({
        position: new Cesium.Cartesian3.fromDegrees(104.08, 30.65, 0),
        color: Cesium.Color.YELLOW,
        pixelSize: 10
      })
      viewer.camera.setView({
        // destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000.0),
        destination: {
          x: -1339648.3917152071,
          y: 5336854.133361579,
          z: 3225066.7272186535
        },
        orientation: {
          direction: {
            x: 0.32291598617590284,
            y: -0.7574487396915219,
            z: 0.5674475064812333
          },
          up: {
            x: -0.08366460016485465,
            y: 0.5743744989038251,
            z: 0.8143059435422506
          }
        },
      })
    }
    addPoint()
    viewer.camera.setView({
        // destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000.0),
        destination: {
          x: -1339648.3917152071,
          y: 5336854.133361579,
          z: 3225066.7272186535
        },
        orientation: {
          direction: {
            x: 0.32291598617590284,
            y: -0.7574487396915219,
            z: 0.5674475064812333
          },
          up: {
            x: -0.08366460016485465,
            y: 0.5743744989038251,
            z: 0.8143059435422506
          }
        },
      })

    const aa = new Cesium.BaseThing(viewer)
    const bb =aa.RotationPoint({pitch: -35, height: 4000})
      function start(){
        bb.addEvent()
      }
      function close(){
        bb.removeEvent()
      }
   
    ExampleGui.addToolbarButton("开始", function () {
        start();
    })
    ExampleGui.addToolbarButton("结束", function () {
        close()
    });

  </script>
</body>

</html>
