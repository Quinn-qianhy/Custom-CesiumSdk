<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>波纹圆示例</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <script src="../../../cesium/Cesium.js"></script>
    <script src="../../../defaultAccessToken.js"></script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      'use script'
      var viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE
          })
        )
      })
      viewer.scene.globe.depthTestAgainstTerrain = true

      const waveMaterial = new Cesium.CircleWaveMaterialProperty({
        color: new Cesium.Color(1, 0.9725, 0.0745, 0.5),
        globalAlpha: 0.5
      })

      const entity = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(104.063245, 30.6628335),
        ellipse: {
          semiMajorAxis: 1000.0,
          semiMinorAxis: 1000.0,
          material: waveMaterial,
          height: 10,
          heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND
        }
      })

      ExampleGui.addSlider('透明度', 0.5, 0.1, 1, 0.1, function (value) {
        waveMaterial.globalAlpha = value
      })
      ExampleGui.finishedLoading()

      viewer.zoomTo(entity)
    </script>
  </body>
</html>
