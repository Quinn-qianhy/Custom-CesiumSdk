<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>聚合点</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromUrl("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer")
        )
    })

    viewer.scene.globe.depthTestAgainstTerrain = false
    //初始定位位置
    viewer.camera.flyTo({
      destination: {
        x: -1296496.9471364329,
        y: 6165027.301823712,
        z: 3345437.28141371
      },
      duration: 1,
      orientation: {
        direction: {
          x: 0.1825835183645296,
          y: -0.9810577275348482,
          z: -0.06472243865761867
        },
        up: {
          x: -0.036924572863384006,
          y: -0.07262477093507091,
          z: 0.9966755834099105
        }
      }
    })

    //entity方式自定义billboard
    function addPoint(lat, lon) {
      cluster.entities.add({
        position: Cesium.Cartesian3.fromDegrees(lat, lon),
        billboard: {
          image: '/examples/cesium/assets/clusterPicture/billBoardIcon.png',
          show: true,
          scale: 0.6
          // pixelOffset: new Cesium.Cartesian2(0, -20),
        }
      })
    }

    //根据差值随机生成值
    function randomRange(myMin, myMax) {
      return Math.random() * (myMax - myMin + 1) + myMin;
    }

    //entity方式添加大量billboard点 
    function addPoints(num) {
      for (let i = 0; i < num; i++) {
        const lat = randomRange(98.33, 105.05) //根据经度差生成随机值
        const lon = randomRange(28.51, 32.33) //根据纬度差生成随机值
        addPoint(lat, lon)
      }
    }

    var cluster = new Cesium.CustomDataSource('cluster')
    var dataSourcePromise = viewer.dataSources.add(cluster)
    addPoints(1000)
    dataSourcePromise.then(function (dataSource) {
      var pixelRange = 60;
      var minimumClusterSize = 10;
      dataSource.clustering.enabled = true;
      dataSource.clustering.pixelRange = pixelRange;
      dataSource.clustering.minimumClusterSize = minimumClusterSize;
      dataSource.clustering.clusterEvent.addEventListener(function (clusteredEntities, cluster) {
        cluster.label.show = false
        cluster.label.text = clusteredEntities.length.toString()

        cluster.billboard.show = true
        cluster.billboard.id = cluster.label.id

        cluster.billboard.verticalOrigin = Cesium.VerticalOrigin.CENTER
        if (clusteredEntities.length >= 100) {
          cluster.billboard.image = '/examples/cesium/assets/clusterPicture/100+.png'
        } else if (clusteredEntities.length >= 50) {
          cluster.billboard.image = '/examples/cesium/assets/clusterPicture/50+.png'
        } else if (clusteredEntities.length >= 40) {
          cluster.billboard.image = '/examples/cesium/assets/clusterPicture/40+.png'
        } else if (clusteredEntities.length >= 30) {
          cluster.billboard.image = '/examples/cesium/assets/clusterPicture/30+.png'
        } else if (clusteredEntities.length >= 20) {
          cluster.billboard.image = '/examples/cesium/assets/clusterPicture/20+.png'
        } else if (clusteredEntities.length >= 10) {
          cluster.billboard.image = '/examples/cesium/assets/clusterPicture/10+.png'
        } else {
          var singleDigitPins = new Array(8);
          cluster.billboard.image =
            singleDigitPins[clusteredEntities.length - 2];
        }
      });

     
      //聚合开关
      function clusterEnable() {
        dataSource.clustering.enabled = !dataSource.clustering.enabled
      }
      ExampleGui.addToolbarButton("聚合", function () {
        clusterEnable()
      })
    })

  </script>
</body>

</html>
