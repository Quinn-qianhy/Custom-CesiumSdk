<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>景深效果</title>
<script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
  <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer")
    viewer.scene.globe.baseColor = Cesium.Color.DARKOLIVEGREEN
    if (viewer.scene.imageryLayers.length > 0) {
      viewer.scene.imageryLayers.get(0).alpha = 0.35
    }
    /初始定位位置
    viewer.camera.flyTo({
      destination: {
        x: -1469200.109729519,
        y: 5184992.517968472,
        z: 3401307.075514329
      },
      orientation: {
        direction: {
          x: -0.1506058934247801,
          y: -0.8486043414325113,
          z: 0.5071375913572349
        },
        up: {
          x: -0.3126414843742682,
          y: 0.5275447698515602,
          z: 0.7899062083883874
        }
      },
      duration: 3
    })

    var tileset = viewer.scene.primitives.add(await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343)));

    const viewModel = {
      show: true,
      focalDistance: 87,
      delta: 1,
      sigma: 3.78,
      stepSize: 2.46,
    };

    / ExampleGui 参数面板
    ExampleGui.addToggleButton('是否开启', true, function(checked) {
      viewModel.show = checked;
      updatePostProcess();
    });
    ExampleGui.addSlider('焦距', 87, 0.0, 500.0, 1, function(value) {
      viewModel.focalDistance = value;
      updatePostProcess();
    });
    ExampleGui.addSlider('增量', 1, 0.1, 2, 0.01, function(value) {
      viewModel.delta = value;
      updatePostProcess();
    });
    ExampleGui.addSlider('Sigma', 3.78, 0.5, 5, 0.01, function(value) {
      viewModel.sigma = value;
      updatePostProcess();
    });
    ExampleGui.addSlider('步长', 2.46, 0, 7, 0.01, function(value) {
      viewModel.stepSize = value;
      updatePostProcess();
    });
    ExampleGui.finishedLoading();


    if (
      !Cesium.PostProcessStageLibrary.isDepthOfFieldSupported(viewer.scene)
    ) {
      window.alert(
        "此浏览器不支持深度字段后置处理."
      );
    }

    const depthOfField = viewer.scene.postProcessStages.add(
      Cesium.PostProcessStageLibrary.createDepthOfFieldStage()
    );

    function updatePostProcess() {
      depthOfField.enabled = Boolean(viewModel.show);
      depthOfField.uniforms.focalDistance = Number(viewModel.focalDistance);
      depthOfField.uniforms.delta = Number(viewModel.delta);
      depthOfField.uniforms.sigma = Number(viewModel.sigma);
      depthOfField.uniforms.stepSize = Number(viewModel.stepSize);
    }
    updatePostProcess();
    const target = Cesium.Cartesian3.fromDegrees(
      initialLon + lonIncrement,
      lat,
      height + 7.5
    );
    const offset = new Cesium.Cartesian3(
      -37.048378684557974,
      -24.852967044804245,
      4.352023653686047
    );
    viewer.scene.camera.lookAt(target, offset);

  
})();
</script>
</body>

</html>
