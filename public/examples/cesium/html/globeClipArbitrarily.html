<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>地形开挖(任意多边形)</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
</style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
      "use script";

      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        )
      });
      viewer.scene.globe.depthTestAgainstTerrain = true;

      // 开挖面贴图，本地资源在 examples/cesium/assets/terrainClip/
      // 需要更换时可直接替换为 mars3d 等开源站点的 excavate_side / excavate_bottom 贴图
      var TEX_TOP = "../../../examples/cesium/assets/terrainClip/excavationregion_top.jpg";
      var TEX_TOP_NORMAL = "../../../examples/cesium/assets/terrainClip/excavationregion_top_Normal.jpg";
      var TEX_SIDE = "../../../examples/cesium/assets/terrainClip/excavationregion_side.jpg";
      var TEX_SIDE_NORMAL = "../../../examples/cesium/assets/terrainClip/excavationregion_side_Normal.jpg";

      var params = {
        depth: 50
      };

      // 绘制工具用自编译 Cesium 自带的 DrawHandle
      var drawHandle = new Cesium.DrawHandle(viewer, {
        borderWidth: 2,
        borderColor: Cesium.Color.YELLOW
      });

      var excavationPrimitives = [];
      var currentPositions = null;

      function clearExcavation() {
        viewer.scene.globe.clippingPolygons = undefined;
        excavationPrimitives.forEach(function (primitive) {
          viewer.scene.primitives.remove(primitive);
        });
        excavationPrimitives = [];
      }

      function dedupe(positions) {
        if (
          positions.length > 1 &&
          Cesium.Cartesian3.equals(positions[0], positions[positions.length - 1])
        ) {
          positions.pop();
        }
        return positions;
      }

      // 圆形按经纬度离散成多边形顶点
      function circleToPositions(center, radius, count) {
        var carto = Cesium.Cartographic.fromCartesian(center);
        var latStep = radius / Cesium.Ellipsoid.WGS84.maximumRadius;
        var lonStep = radius / (Cesium.Ellipsoid.WGS84.maximumRadius * Math.cos(carto.latitude));
        var positions = [];
        for (var i = 0; i < count; i++) {
          var angle = (i / count) * Math.PI * 2;
          positions.push(
            Cesium.Cartesian3.fromRadians(
              carto.longitude + lonStep * Math.cos(angle),
              carto.latitude + latStep * Math.sin(angle)
            )
          );
        }
        return positions;
      }

      function propertyValue(prop, fallback) {
        if (!Cesium.defined(prop)) {
          return fallback;
        }
        return Cesium.defined(prop.getValue) ? prop.getValue(Cesium.JulianDate.now()) : prop;
      }

      // 兼容多边形 / 矩形 / 圆形三种绘制结果
      function extractPositions(entity) {
        if (!entity) {
          return undefined;
        }

        if (entity.polygon) {
          var hierarchy = propertyValue(entity.polygon.hierarchy);
          if (hierarchy && hierarchy.positions) {
            return dedupe(hierarchy.positions.slice());
          }
        }

        if (entity.rectangle) {
          var rect = propertyValue(entity.rectangle.coordinates);
          if (rect) {
            return [
              Cesium.Cartesian3.fromRadians(rect.west, rect.south),
              Cesium.Cartesian3.fromRadians(rect.east, rect.south),
              Cesium.Cartesian3.fromRadians(rect.east, rect.north),
              Cesium.Cartesian3.fromRadians(rect.west, rect.north)
            ];
          }
        }

        if (entity.ellipse && entity.position) {
          var center = propertyValue(entity.position);
          var radius = propertyValue(entity.ellipse.semiMajorAxis);
          if (center && radius > 0) {
            return circleToPositions(center, radius, 72);
          }
        }

        return undefined;
      }

      function createSurfaceMaterial(image, normal, strength) {
        return new Cesium.Material({
          fabric: {
            materials: {
              diffuseMaterial: { type: "DiffuseMap", uniforms: { image: image } },
              bumpMaterial: { type: "BumpMap", uniforms: { image: normal, strength: strength } }
            },
            components: {
              diffuse: "diffuseMaterial.diffuse",
              specular: 0.01,
              normal: "bumpMaterial.normal"
            }
          }
        });
      }

      // 任意多边形开挖：ClippingPolygonCollection 不要求凸多边形
      function buildExcavation(points) {
        var depth = params.depth;

        viewer.scene.globe.clippingPolygons = new Cesium.ClippingPolygonCollection({
          polygons: [new Cesium.ClippingPolygon({ positions: points })]
        });

        var closed = points.concat([points[0]]);

        var bottom = viewer.scene.primitives.add(
          new Cesium.Primitive({
            geometryInstances: new Cesium.GeometryInstance({
              geometry: new Cesium.PolygonGeometry({
                polygonHierarchy: new Cesium.PolygonHierarchy(closed),
                height: -depth
              })
            }),
            appearance: new Cesium.MaterialAppearance({ aboveGround: false })
          })
        );
        bottom.appearance.material = createSurfaceMaterial(TEX_TOP, TEX_TOP_NORMAL, 0.8);

        var max = [];
        var min = [];
        for (var j = 0; j < closed.length; j++) {
          max.push(0);
          min.push(-depth);
        }

        var side = viewer.scene.primitives.add(
          new Cesium.Primitive({
            geometryInstances: new Cesium.GeometryInstance({
              geometry: new Cesium.WallGeometry({
                positions: closed.slice().reverse(),
                maximumHeights: max,
                minimumHeights: min
              })
            }),
            appearance: new Cesium.MaterialAppearance({ aboveGround: false })
          })
        );
        side.appearance.material = createSurfaceMaterial(TEX_SIDE, TEX_SIDE_NORMAL, 0.8);

        excavationPrimitives.push(bottom, side);
        viewer.scene.globe.backFaceCulling = true;
        viewer.scene.globe.showSkirts = false;
      }

      function rebuild() {
        if (!currentPositions || currentPositions.length < 3) {
          return;
        }
        clearExcavation();
        buildExcavation(currentPositions);
      }

      function startShape(mode) {
        clearExcavation();
        currentPositions = null;
        drawHandle.clear();
        drawHandle.startDraw(mode, {});
      }

      drawHandle.on(Cesium.DrawHandle.DrawEvents.DRAW_COMPLETE, function (data) {
        var positions = extractPositions(data.entity);
        if (!positions || positions.length < 3) {
          return;
        }
        currentPositions = positions;
        rebuild();
      });

      ExampleGui.addButton("绘制多边形（左键加点，右键结束）", function () {
        startShape(Cesium.DrawHandle.DrawMode.POLYGON);
      });

      ExampleGui.addButton("绘制圆形（左键定圆心，移动定半径，右键结束）", function () {
        startShape(Cesium.DrawHandle.DrawMode.CIRCLE);
      });

      ExampleGui.addButton("绘制矩形（左键两次对角点）", function () {
        startShape(Cesium.DrawHandle.DrawMode.RECTANGLE);
      });

      ExampleGui.addButton("清除开挖", function () {
        clearExcavation();
        currentPositions = null;
        drawHandle.clear();
      });

      ExampleGui.addSlider("开挖深度(米)", 50, 10, 500, 10, function (value) {
        params.depth = Number(value);
        rebuild();
      });

      ExampleGui.finishedLoading();
    </script>
  </body>
</html>
