<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>geojson数据光晕线</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <script src="../../../cesium/Cesium.js"></script>
    <script src="../../../defaultAccessToken.js"></script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";

      var ARCGIS_BASEMAP_OPTIONS = {
        enablePickFeatures: false,
      };

      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
            Cesium.ArcGisBaseMapType.SATELLITE,
            ARCGIS_BASEMAP_OPTIONS,
          ),
        ),
      });

      viewer.scene.setTerrain(
        new Cesium.Terrain(Cesium.CesiumTerrainProvider.fromUrl("https://data.mars3d.cn/terrain")),
      );
      viewer.scene.globe.depthTestAgainstTerrain = true;

      var geoJsonUrl = "../../../data/geojson/" + encodeURIComponent("四川国道线_裁剪.geojson");
      var roadDataSource = null;
      var style = {
        width: 6,
        glowPower: 0.08,
        color: Cesium.Color.ORANGERED.withAlpha(0.92),
      };
      var glowMaterial = new Cesium.PolylineGlowMaterialProperty({
        glowPower: new Cesium.CallbackProperty(function () {
          return style.glowPower;
        }, false),
        color: new Cesium.CallbackProperty(function () {
          return style.color;
        }, false),
      });

      function applyGlowStyle() {
        if (!roadDataSource) {
          return;
        }

        var entities = roadDataSource.entities.values;
        for (var i = 0; i < entities.length; i++) {
          var entity = entities[i];
          if (!entity.polyline) {
            continue;
          }

          entity.polyline.width = style.width;
          entity.polyline.clampToGround = true;
          entity.polyline.material = glowMaterial;
        }
      }

      Cesium.GeoJsonDataSource.load(geoJsonUrl, {
        clampToGround: true,
      })
        .then(function (dataSource) {
          roadDataSource = dataSource;
          viewer.dataSources.add(dataSource);
          applyGlowStyle();
          return viewer.flyTo(dataSource, {
            duration: 1.5,
          });
        })
        .catch(function (error) {
          console.error("四川国道线裁剪 GeoJSON 加载失败:", error);
        });

      ExampleGui.addSlider("线宽", style.width, 2, 16, 1, function (value) {
        style.width = Number(value);
        applyGlowStyle();
      });

      ExampleGui.addSlider("光晕强度", style.glowPower, 0.02, 0.25, 0.01, function (value) {
        style.glowPower = Number(value);
        viewer.scene.requestRender();
      });

      ExampleGui.finishedLoading();
    </script>
  </body>
</html>
