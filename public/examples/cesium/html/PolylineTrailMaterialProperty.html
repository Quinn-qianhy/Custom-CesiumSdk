<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>流动飞线</title>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #toolbar {
        left: 5px;
        top: 5px;
        background: rgba(42, 42, 42, 0.8);
        padding: 4px;
        border-radius: 4px;
      }

      #toolbar input {
        vertical-align: middle;
        padding-top: 2px;
        padding-bottom: 2px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        )
      });

      viewer.scene.globe.depthTestAgainstTerrain = false;

      var tileset = viewer.scene.primitives.add(
        await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343), {maximumScreenSpaceError: 4})
      );

      Promise.resolve(tileset)
        .then(function(tileset) {
          viewer.zoomTo(
            tileset,
            new Cesium.HeadingPitchRange(
              0.0,
              -0.5,
              tileset.boundingSphere.radius * 2.0
            )
          );
        })

      for (var i = 0; i < 500; i++) {
        var x = 103.99 + 0.2 * Math.random();
        var y = 30.6 + 0.1 * Math.random();
        viewer.entities.add({
          polyline: {
            positions: new Cesium.Cartesian3.fromDegreesArrayHeights([
              x,
              y,
              0,
              x,
              y,
              5000 + Math.random() * 1000
            ]),
            width: 3,
            material: new Cesium.PolylineTrailMaterialProperty({
              speed: 8 * Math.random(),
              color: Cesium.Color.CYAN,
              percent: 0.3,
              gradient: 0.01
            })
          }
        });
      }
      var promise = Cesium.GeoJsonDataSource.load(
        '../../../data/geojson/' + encodeURIComponent('四川国道线_裁剪.geojson')
      );
      promise
        .then(function(dataSource) {
          viewer.dataSources.add(dataSource);

          //Get the array of entities
          var entities = dataSource.entities.values;

          var colorHash = {};
          for (var i = 0; i < entities.length; i++) {
            //For each entity, create a random color based on the state name.
            //Some states have multiple entities, so we store the color in a
            //hash so that we use the same color for the entire state.
            var entity = entities[i];
            var name = entity.name;

            //Set the polygon material to our random color.
            entity.polyline.material = new Cesium.PolylineTrailMaterialProperty(
              {
                speed: 16 * Math.random(),
                color: Cesium.Color.CYAN,
                percent: 0.3,
                gradient: 0.01
              }
            );
          }
        })
        .catch(function(error) {
          //Display any errrors encountered while loading.
          window.alert(error);
        });
    
})();
</script>
  </body>
</html>
