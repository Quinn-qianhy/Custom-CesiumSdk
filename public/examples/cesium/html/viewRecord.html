<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>视角记录</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";

    var cameraReview = {
      views: [],
      pointer: -1,
      updateViews: true
    }
    var startView = {
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000000.0), //四川省政府、
    }
    var viewer = new Cesium.Viewer("cesiumContainer", {
      scene3Donly: true,
      baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        )
    })
    viewer.scene.globe.depthTestAgainstTerrain = false

    var cameraReview = viewer.camera.handleCameraReview(true)

    function switchCameraView(cameraReview, type) {
      if ((cameraReview.pointer === 0 && type === 'previous') || (cameraReview.pointer === cameraReview.views.length -
          1 && type === 'next')) {
        alert('已经到头啦!')
        return
      }
      if (type === 'previous') {
        cameraReview.pointer--
      } else if (type === 'next') {
        cameraReview.pointer++
      }
      cameraReview.views[cameraReview.pointer].complete = function () {
        cameraReview.updateViews = false
      }
      cameraReview.views[cameraReview.pointer].cancel = function () {
        cameraReview.updateViews = false
      }
      cameraReview.updateViews = false
      viewer.camera.flyTo(cameraReview.views[cameraReview.pointer])
      console.log(cameraReview);
    }


    ExampleGui.addToolbarButton("上一个视图", function () {
      switchCameraView(cameraReview, 'previous')
    })
    ExampleGui.addToolbarButton("下一个视图", function () {
      switchCameraView(cameraReview, 'next')
    })

  </script>
</body>

</html>
