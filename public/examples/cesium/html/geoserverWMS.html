<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>WMS图层加载</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <script src="../../../cesium/Cesium.js"></script>
    <script src="../../../defaultAccessToken.js"></script>
    <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";

      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        ),
      });

      var wmsImageryLayer = null;

      var wmsParams = {
        url: "http://172.20.16.213:8889/geoserver/GlWebTest/wms",
        layers: "GlWebTest:四川行政区划",
        format: "image/png",
        transparent: true,
        west: 97.34742382600007,
        south: 26.049271889000067,
        east: 108.54240955500006,
        north: 34.31470399700004,
      };

      function applyBaseLayerStyle(layer) {
        layer.saturation = 0;
        layer.hue = 0.56;
        layer.contrast = 1.74;
        layer.brightness = 1.1;
      }

      var baseLayer = viewer.imageryLayers.get(0);
      if (baseLayer) {
        applyBaseLayerStyle(baseLayer);
      } else {
        viewer.imageryLayers.layerAdded.addEventListener(function (layer, index) {
          if (index === 0) {
            applyBaseLayerStyle(layer);
          }
        });
      }

      function removeWmsLayer() {
        if (wmsImageryLayer) {
          viewer.imageryLayers.remove(wmsImageryLayer, true);
          wmsImageryLayer = null;
        }
      }

      function loadWmsLayer() {
        var url = String(wmsParams.url || "").trim();
        var layers = String(wmsParams.layers || "").trim();
        if (!url || !layers) {
          window.alert("请填写 WMS 服务地址和图层名称（layers）");
          return;
        }

        removeWmsLayer();

        var providerOptions = {
          url: url,
          layers: layers,
          parameters: {
            service: "WMS",
            format: String(wmsParams.format || "image/png").trim() || "image/png",
            transparent: !!wmsParams.transparent,
          },
        };

        var west = Number(wmsParams.west);
        var south = Number(wmsParams.south);
        var east = Number(wmsParams.east);
        var north = Number(wmsParams.north);
        if (
          !isNaN(west) &&
          !isNaN(south) &&
          !isNaN(east) &&
          !isNaN(north)
        ) {
          providerOptions.rectangle = Cesium.Rectangle.fromDegrees(
            west,
            south,
            east,
            north,
          );
        }

        try {
          var provider = new Cesium.WebMapServiceImageryProvider(providerOptions);
          wmsImageryLayer = viewer.imageryLayers.addImageryProvider(provider);

          if (providerOptions.rectangle) {
            viewer.camera.flyTo({
              destination: providerOptions.rectangle,
              duration: 1.5,
            });
          }
        } catch (error) {
          window.alert("WMS 加载失败：" + (error.message || error));
        }
      }

      ExampleGui.addTextInput("服务地址 url", wmsParams, "url");
      ExampleGui.addTextInput("图层 layers", wmsParams, "layers");
      ExampleGui.addTextInput("格式 format", wmsParams, "format");
      ExampleGui.addToggleButton(
        "透明 transparent",
        wmsParams.transparent,
        function (checked) {
          wmsParams.transparent = checked;
        },
      );
      ExampleGui.addNumberInput(
        "西边界 west",
        wmsParams,
        "west",
        -180,
        180,
        0.000001,
      );
      ExampleGui.addNumberInput(
        "南边界 south",
        wmsParams,
        "south",
        -90,
        90,
        0.000001,
      );
      ExampleGui.addNumberInput(
        "东边界 east",
        wmsParams,
        "east",
        -180,
        180,
        0.000001,
      );
      ExampleGui.addNumberInput(
        "北边界 north",
        wmsParams,
        "north",
        -90,
        90,
        0.000001,
      );
      ExampleGui.addToolbarButton("加载 WMS", loadWmsLayer);
      ExampleGui.addToolbarButton("移除 WMS", removeWmsLayer);
      ExampleGui.finishedLoading();

      viewer.camera.setView({
        destination: {
          x: -1695124.7670598922,
          y: 8380581.440100933,
          z: 2496803.1463128375,
        },
        orientation: {
          direction: {
            x: 0.12744846786918324,
            y: -0.9620171493693785,
            z: 0.24141228708790413,
          },
          up: {
            x: -0.1580487465736309,
            y: 0.2205891875651592,
            z: 0.9624764953160401,
          },
        },
      });
    </script>
  </body>
</html>
