<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>路径飞行</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
<script src="../../../cesium/Cesium.js"></script>
<script src="../../../defaultAccessToken.js"> </script>
  <link href="../../../cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayerPicker: false,
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        new Cesium.AmapImageryProvider({
          layerType: Cesium.AmapLayerType.SATELLITE,
        })
      )
    });

    var cameraTrackControls = new Cesium.RouteFlyManager(viewer.scene);

    ExampleGui.addToolbarButton('添加关键点', function() {
        cameraTrackControls.addCameraTrack(viewer.camera);
    });

    ExampleGui.addToolbarButton('开始飞行', function() {
        cameraTrackControls.play();
    });

    ExampleGui.addToolbarButton('暂停飞行', function() {
        cameraTrackControls.pause();
    });

    ExampleGui.addToolbarButton('结束飞行', function() {
        cameraTrackControls.stop();
    });

    ExampleGui.addToolbarButton('获取数据', function() {
        console.log(cameraTrackControls.getRoutes());
    });

  </script>
</body>

</html>
