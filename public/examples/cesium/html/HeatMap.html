<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>热力图</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
</style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromUrl("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer")
        )
      });

      viewer.scene.globe.depthTestAgainstTerrain = false;

      var tileset = viewer.scene.primitives.add(
        await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343), {maximumScreenSpaceError: 4})
      );

      Promise.resolve(tileset)
        .then(function(tileset) {
          viewer.zoomTo(
            tileset,
            new Cesium.HeadingPitchRange(
              0.0,
              -0.5,
              tileset.boundingSphere.radius * 2.0
            )
          );
        })
      let bounds = {
        west: 99999,
        east: -99999,
        south: -99999,
        north: 99999
      };
      var opt = {
        // heatmap.js options go here
        backgroundColor: "rgba (0,0,0,0)",
        radius: 30,
        maxOpacity: 0.5,
        minOpacity: 0,
        blur: 0.75,
        gradient: {
          // enter n keys between 0 and 1 here
          // for gradient color customization
          ".3": "blue",
          ".5": "green",
          ".8": "yellow",
          ".95": "red"
        }
      };
      var data = {};
      data.points = [];
      data.min = 0;
      data.max = 100;

      for (var i = 0; i < 5000; i++) {
        var x = 103.99 + 0.2 * Math.random();
        var y = 30.6 + 0.1 * Math.random();
        data.points.push({ x: x, y: y, value: Math.random() * 100 });
        if (bounds.west > x) bounds.west = x;
        if (bounds.east < x) bounds.east = x;
        if (bounds.south < y) bounds.south = y;
        if (bounds.north > y) bounds.north = y;
      }
      var heatmapGraphic = new Cesium.HeatmapGraphic({
        bounds: bounds,
        heatmapOptions: opt,
        data: data,
        viewer: viewer,
        // intensityScale: 100 // 大于0 启用3d,默认0
      });
      
      ExampleGui.addToolbarButton("贴模型", function() {
        heatmapGraphic._heatmapGraphic.rectangle.classificationType = Cesium.ClassificationType.BOTH;
      });
      ExampleGui.addToolbarButton("不贴模型", function() {
        heatmapGraphic._heatmapGraphic.rectangle.classificationType = Cesium.ClassificationType.TERRAIN;
      }); 
    
})();
</script>
  </body>
</html>
