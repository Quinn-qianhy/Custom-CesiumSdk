<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>日照阴影</title>
<script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
  <link href="/examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
// 1.107 起 Cesium3DTileset 只能用 fromUrl 异步创建，主流程包进 async 以便 await
(async function () {
    "use script";
    const viewer = new Cesium.Viewer("cesiumContainer", {
      shouldAnimate: true,
      baseLayerPicker: false,
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        new Cesium.AmapImageryProvider({
          layerType: Cesium.AmapLayerType.SATELLITE,
        }),
      ),
    });
    viewer.scene.sun.glowFactor = 20

    viewer.scene.globe.baseColor = Cesium.Color.DARKOLIVEGREEN
    if (viewer.scene.imageryLayers.length > 0) {
      viewer.scene.imageryLayers.get(0).alpha = 0.35
    }
    var tileset = viewer.scene.primitives.add(
      await Cesium.Cesium3DTileset.fromUrl(await Cesium.IonResource.fromAssetId(75343), {maximumScreenSpaceError: 4})
    );

    viewer.camera.flyTo({
      destination: {
        x: -1338716.6473931035,
        y: 5329508.728315589,
        z: 3231157.5851133587
      },
      orientation: {
        heading: 6.260334858779589,
        pitch: -0.8275971699767104,
        roll: 0.00013416028952839554
      },
      duration: 2
    })

    const viewModel = {
      SunlightShadow: false,
    };
    // ExampleGui 参数面板
    ExampleGui.addToggleButton('SunlightShadow', false, function(checked) {
      viewModel.SunlightShadow = checked;
      updatePostProcess();
    });
    ExampleGui.finishedLoading();
    function updatePostProcess() {
        viewer.scene.globe.enableLighting = Boolean(viewModel.SunlightShadow);;
        viewer.shadows = Boolean(viewModel.SunlightShadow);;
        viewer.clock.multiplier = 500;
    }
    updatePostProcess()

  
})();
</script>
</body>

</html>
