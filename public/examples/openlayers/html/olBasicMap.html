<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>高德影像浏览</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '/examples/openlayers/ol/gaodeImageryLayer.js'

      const viewOptions = {
        zoom: DEFAULT_ZOOM,
        rotation: 0
      }

      const map = new Map({
        target: 'map',
        layers: [createGaodeImageryLayer()],
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: viewOptions.zoom,
          rotation: viewOptions.rotation
        })
      })

      const view = map.getView()

      ExampleGui.addSlider('缩放级别', viewOptions.zoom, 2, 18, 1, function (value) {
        viewOptions.zoom = value
        view.setZoom(value)
      })

      ExampleGui.addSlider('旋转角度', viewOptions.rotation, 0, Math.PI * 2, 0.1, function (value) {
        viewOptions.rotation = value
        view.setRotation(value)
      })

      ExampleGui.addToolbarButton('飞往北京', function () {
        view.animate({
          center: fromLonLat([116.3912757, 39.906217]),
          zoom: 12,
          duration: 800
        })
      })

      ExampleGui.addToolbarButton('飞往上海', function () {
        view.animate({
          center: fromLonLat([121.4737, 31.2304]),
          zoom: 11,
          duration: 800
        })
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
