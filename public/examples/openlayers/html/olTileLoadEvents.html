<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Tile Load Events</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #map {
        width: 100%;
        height: 100%;
        background: #1c1917;
      }

      #progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        box-shadow: 0 0 1px 2px rgb(255, 204, 0);
        width: 0;
        transition: width 250ms;
        visibility: hidden;
        z-index: 2;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div class="wrapper">
      <div id="map"></div>
      <div id="progress"></div>
    </div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import TileLayer from 'ol/layer/Tile.js'
      import ImageTile from 'ol/source/ImageTile.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        GAODE_IMAGERY_URL,
        GAODE_ATTRIBUTION,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      function Progress(el) {
        this.el = el
        this.loading = 0
        this.loaded = 0
      }

      Progress.prototype.addLoading = function () {
        ++this.loading
        this.update()
      }

      Progress.prototype.addLoaded = function () {
        ++this.loaded
        this.update()
      }

      Progress.prototype.update = function () {
        const width = ((this.loaded / this.loading) * 100).toFixed(1) + '%'
        this.el.style.width = width
      }

      Progress.prototype.show = function () {
        this.el.style.visibility = 'visible'
      }

      Progress.prototype.hide = function () {
        const style = this.el.style
        const el = this.el
        setTimeout(function () {
          style.visibility = 'hidden'
          style.width = '0px'
          el.progressReset && el.progressReset()
        }, 250)
      }

      Progress.prototype.reset = function () {
        this.loading = 0
        this.loaded = 0
      }

      const progress = new Progress(document.getElementById('progress'))
      progress.el.progressReset = function () {
        progress.reset()
      }

      const source = new ImageTile({
        attributions: GAODE_ATTRIBUTION,
        url: GAODE_IMAGERY_URL,
        crossOrigin: 'anonymous'
      })

      source.on('tileloadstart', function () {
        progress.addLoading()
      })
      source.on(['tileloadend', 'tileloaderror'], function () {
        progress.addLoaded()
      })

      const map = new Map({
        layers: [new TileLayer({ source: source })],
        target: 'map',
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      map.on('loadstart', function () {
        progress.show()
      })
      map.on('loadend', function () {
        progress.hide()
      })

      ExampleGui.addToolbarButton('触发重新加载', function () {
        map.getView().animate({
          zoom: DEFAULT_ZOOM + 2,
          duration: 400
        })
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
