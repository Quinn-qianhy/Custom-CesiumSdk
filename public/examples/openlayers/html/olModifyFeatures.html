<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>要素编辑</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #status {
        position: absolute;
        bottom: 8px;
        left: 8px;
        z-index: 10;
        padding: 4px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 13px/1.6 sans-serif;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>
    <div id="status">拖动顶点编辑要素，或从菜单新增</div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import Draw from 'ol/interaction/Draw.js'
      import Modify from 'ol/interaction/Modify.js'
      import Snap from 'ol/interaction/Snap.js'
      import Feature from 'ol/Feature.js'
      import Point from 'ol/geom/Point.js'
      import LineString from 'ol/geom/LineString.js'
      import Polygon from 'ol/geom/Polygon.js'
      import VectorLayer from 'ol/layer/Vector.js'
      import VectorSource from 'ol/source/Vector.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      const center = fromLonLat(DEFAULT_LON_LAT)

      const source = new VectorSource({
        features: [
          new Feature(new Point(center)),
          new Feature(
            new LineString([
              [center[0] - 12000, center[1] + 9000],
              [center[0], center[1] + 14000],
              [center[0] + 12000, center[1] + 6000]
            ])
          ),
          new Feature(
            new Polygon([
              [
                [center[0] - 10000, center[1] - 14000],
                [center[0] + 10000, center[1] - 14000],
                [center[0], center[1] - 4000],
                [center[0] - 10000, center[1] - 14000]
              ]
            ])
          )
        ]
      })

      const statusEl = document.getElementById('status')

      const vector = new VectorLayer({
        source: source,
        style: {
          'fill-color': 'rgba(46, 204, 113, 0.25)',
          'stroke-color': '#27ae60',
          'stroke-width': 3,
          'circle-radius': 7,
          'circle-fill-color': '#e74c3c',
          'circle-stroke-color': '#fff',
          'circle-stroke-width': 2
        }
      })

      const map = new Map({
        layers: [createGaodeImageryLayer(), vector],
        target: 'map',
        view: new View({
          center: center,
          zoom: DEFAULT_ZOOM + 1
        })
      })

      / 编辑：拖动顶点/线段修改几何
      map.addInteraction(new Modify({ source: source }))
      / 捕捉：绘制与编辑时自动吸附已有要素
      map.addInteraction(new Snap({ source: source }))

      let draw = null

      function removeDrawInteraction() {
        if (draw) {
          map.removeInteraction(draw)
          draw = null
        }
      }

      function addDrawInteraction(type) {
        removeDrawInteraction()
        if (type === 'None') {
          statusEl.textContent = '拖动顶点编辑要素'
          return
        }
        draw = new Draw({ source: source, type: type })
        draw.on('drawend', function () {
          statusEl.textContent = '绘制完成，可继续拖动顶点编辑'
        })
        map.addInteraction(draw)
        statusEl.textContent = '正在新增：' + type
      }

      ExampleGui.addMenu([
        { text: '点', onselect: function () { addDrawInteraction('Point') } },
        { text: '线', onselect: function () { addDrawInteraction('LineString') } },
        { text: '面', onselect: function () { addDrawInteraction('Polygon') } },
        { text: '停止绘制', onselect: function () { addDrawInteraction('None') } }
      ])

      ExampleGui.addToolbarButton('清除全部', function () {
        source.clear()
        statusEl.textContent = '已清空，可重新绘制'
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
