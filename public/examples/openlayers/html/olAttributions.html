<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>版权信息</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import TileLayer from 'ol/layer/Tile.js'
      import XYZ from 'ol/source/XYZ.js'
      import Attribution from 'ol/control/Attribution.js'
      import { defaults as defaultControls } from 'ol/control/defaults.js'
      import { fromLonLat } from 'ol/proj.js'
      import { DEFAULT_LON_LAT, DEFAULT_ZOOM } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      const GAODE_IMAGERY_URL =
        'https://webst0{1-4}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}'

      const attribution = new Attribution({
        collapsible: false
      })

      const map = new Map({
        layers: [
          new TileLayer({
            source: new XYZ({
              url: GAODE_IMAGERY_URL,
              maxZoom: 18,
              crossOrigin: 'anonymous',
              attributions: '© 高德地图 | OpenLayers'
            })
          })
        ],
        controls: defaultControls({ attribution: false }).extend([attribution]),
        target: 'map',
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      function checkSize() {
        const small = map.getSize()[0] < 600
        attribution.setCollapsible(small)
        attribution.setCollapsed(small)
      }

      map.on('change:size', checkSize)
      checkSize()

      ExampleGui.addToolbarButton('模拟窄屏', function () {
        map.getTargetElement().style.width = '480px'
        map.updateSize()
      })

      ExampleGui.addToolbarButton('恢复全宽', function () {
        map.getTargetElement().style.width = '100%'
        map.updateSize()
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
