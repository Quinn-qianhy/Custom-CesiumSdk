<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>点聚合</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import Feature from 'ol/Feature.js'
      import Point from 'ol/geom/Point.js'
      import Cluster from 'ol/source/Cluster.js'
      import VectorLayer from 'ol/layer/Vector.js'
      import VectorSource from 'ol/source/Vector.js'
      import { Circle as CircleStyle, Fill, Stroke, Style, Text } from 'ol/style.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      const COUNT = 1000
      const SPREAD = 2500000

      const center = fromLonLat(DEFAULT_LON_LAT)

      function makeFeatures() {
        return Array.from({ length: COUNT }, function () {
          return new Feature(
            new Point([
              center[0] + (Math.random() * 2 - 1) * SPREAD,
              center[1] + (Math.random() * 2 - 1) * SPREAD
            ])
          )
        })
      }

      const source = new VectorSource({ features: makeFeatures() })

      const clusterSource = new Cluster({
        source: source,
        distance: 40,
        minDistance: 10
      })

      const styleCache = {}

      function clusterStyle(feature) {
        const size = feature.get('features').length
        const color =
          size > 100
            ? 'rgba(231, 76, 60, 0.85)'
            : size > 20
              ? 'rgba(243, 156, 18, 0.85)'
              : 'rgba(52, 152, 219, 0.85)'
        const radius = size > 100 ? 20 : size > 20 ? 15 : 11
        const key = color + '-' + radius + '-' + Math.min(size, 2)
        let style = styleCache[key]
        if (!style) {
          style = new Style({
            image: new CircleStyle({
              radius: radius,
              fill: new Fill({ color: color }),
              stroke: new Stroke({ color: '#fff', width: 2 })
            }),
            text: size > 1
              ? new Text({
                  text: String(size),
                  font: 'bold 12px sans-serif',
                  fill: new Fill({ color: '#fff' })
                })
              : undefined
          })
          styleCache[key] = style
        }
        return style
      }

      const clusters = new VectorLayer({
        source: clusterSource,
        style: clusterStyle
      })

      const map = new Map({
        layers: [createGaodeImageryLayer(), clusters],
        target: 'map',
        view: new View({
          center: center,
          zoom: 7
        })
      })

      ExampleGui.addSlider(
        '聚合距离',
        40,
        0,
        100,
        1,
        function (value) {
          clusterSource.setDistance(value)
        }
      )

      ExampleGui.addToolbarButton('重新生成', function () {
        source.clear()
        source.addFeatures(makeFeatures())
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
