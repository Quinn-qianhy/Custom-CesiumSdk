<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>卷帘对比</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      // 底层影像，上层路网按滑块位置裁剪显示
      const baseLayer = createGaodeImageryLayer(6)
      const roadLayer = createGaodeImageryLayer(7)

      let swipeValue = 50

      roadLayer.on('prerender', function (event) {
        const context = event.context
        const mapSize = event.frameState.size
        const width = mapSize[0] * (swipeValue / 100)
        context.save()
        context.beginPath()
        context.rect(0, 0, width, mapSize[1])
        context.clip()
      })

      roadLayer.on('postrender', function (event) {
        event.context.restore()
      })

      const map = new Map({
        layers: [baseLayer, roadLayer],
        target: 'map',
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      ExampleGui.addSlider(
        '路网图占比',
        swipeValue,
        0,
        100,
        1,
        function (value) {
          swipeValue = value
          map.render()
        }
      )

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
