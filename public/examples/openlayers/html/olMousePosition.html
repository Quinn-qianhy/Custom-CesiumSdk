<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>鼠标位置</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .custom-mouse-position {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 1;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(28, 25, 23, 0.88);
        color: #eee;
        font: 12px/1.4 monospace;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>
    <div id="mouse-position"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import MousePosition from 'ol/control/MousePosition.js'
      import { defaults as defaultControls } from 'ol/control/defaults.js'
      import { createStringXY } from 'ol/coordinate.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      const settings = {
        projection: 'EPSG:4326',
        precision: 4
      }

      const mousePositionControl = new MousePosition({
        coordinateFormat: createStringXY(settings.precision),
        projection: settings.projection,
        className: 'custom-mouse-position',
        target: document.getElementById('mouse-position')
      })

      const map = new Map({
        controls: defaultControls().extend([mousePositionControl]),
        layers: [createGaodeImageryLayer()],
        target: 'map',
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      ExampleGui.addMenu([
        {
          text: 'EPSG:4326',
          onselect: function () {
            settings.projection = 'EPSG:4326'
            mousePositionControl.setProjection('EPSG:4326')
          }
        },
        {
          text: 'EPSG:3857',
          onselect: function () {
            settings.projection = 'EPSG:3857'
            mousePositionControl.setProjection('EPSG:3857')
          }
        }
      ])

      ExampleGui.addSlider('小数精度', settings.precision, 0, 12, 1, function (value) {
        settings.precision = value
        mousePositionControl.setCoordinateFormat(createStringXY(value))
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
