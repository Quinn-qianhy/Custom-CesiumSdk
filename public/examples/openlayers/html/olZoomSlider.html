<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>缩放滑块</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #map.style-between-zoom .ol-zoom .ol-zoom-out {
        margin-top: 200px;
      }

      #map.style-between-zoom .ol-zoomslider {
        background-color: transparent;
        top: calc(0.5em + 2px + 1px + 1.14 * 1.375em);
      }

      #map.style-between-zoom .ol-touch .ol-zoom .ol-zoom-out {
        margin-top: 212px;
      }

      #map.style-between-zoom .ol-touch .ol-zoomslider {
        top: 2.75em;
      }

      #map.style-horizontal .ol-zoomslider {
        top: 8px;
        left: auto;
        right: 8px;
        background-color: rgba(255, 69, 0, 0.2);
        width: 200px;
        height: 15px;
        padding: 0;
        box-shadow: 0 0 5px rgb(255, 69, 0);
        border-radius: 7.5px;
      }

      #map.style-horizontal .ol-zoomslider:hover {
        background-color: rgba(255, 69, 0, 0.3);
      }

      #map.style-horizontal .ol-zoomslider-thumb {
        height: 15px;
        width: 15px;
        margin: 0;
        filter: none;
        background-color: rgba(255, 69, 0, 0.6);
        border-radius: 7.5px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import ZoomSlider from 'ol/control/ZoomSlider.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      const mapElement = document.getElementById('map')
      const zoomSlider = new ZoomSlider()

      const map = new Map({
        layers: [createGaodeImageryLayer()],
        target: mapElement,
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      map.addControl(zoomSlider)

      function applyStyle(style) {
        mapElement.classList.remove('style-between-zoom', 'style-horizontal')
        if (style === 'between-zoom') {
          mapElement.classList.add('style-between-zoom')
        } else if (style === 'horizontal') {
          mapElement.classList.add('style-horizontal')
        }
      }

      ExampleGui.addMenu([
        {
          text: '默认样式',
          onselect: function () {
            applyStyle('default')
          }
        },
        {
          text: '置于缩放按钮间',
          onselect: function () {
            applyStyle('between-zoom')
          }
        },
        {
          text: '水平橙色样式',
          onselect: function () {
            applyStyle('horizontal')
          }
        }
      ])

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
