<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>点击弹窗</title>
    <script src="../../../vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="../../../examples/shared/example-gui.js"></script>
    <link href="../../../vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="../../../examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .ol-popup {
        position: absolute;
        background-color: rgba(28, 25, 23, 0.95);
        color: #eee;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        bottom: 12px;
        left: -50px;
        min-width: 280px;
      }

      .ol-popup:after,
      .ol-popup:before {
        top: 100%;
        border: solid transparent;
        content: ' ';
        height: 0;
        width: 0;
        position: absolute;
        pointer-events: none;
      }

      .ol-popup:after {
        border-top-color: rgba(28, 25, 23, 0.95);
        border-width: 10px;
        left: 48px;
        margin-left: -10px;
      }

      .ol-popup:before {
        border-top-color: rgba(255, 255, 255, 0.12);
        border-width: 11px;
        left: 48px;
        margin-left: -11px;
      }

      .ol-popup-closer {
        text-decoration: none;
        position: absolute;
        top: 2px;
        right: 8px;
        color: #eee;
      }

      .ol-popup-closer:after {
        content: '✖';
      }

      #popup-content code {
        display: block;
        margin-top: 8px;
        padding: 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 12px;
        word-break: break-all;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>
    <div id="popup" class="ol-popup">
      <a href="#" id="popup-closer" class="ol-popup-closer"></a>
      <div id="popup-content"></div>
    </div>

    <script type="module">
      import Map from 'ol/Map.js'
      import Overlay from 'ol/Overlay.js'
      import View from 'ol/View.js'
      import { toStringHDMS } from 'ol/coordinate.js'
      import { toLonLat, fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '../../../examples/openlayers/ol/gaodeImageryLayer.js'

      const container = document.getElementById('popup')
      const content = document.getElementById('popup-content')
      const closer = document.getElementById('popup-closer')

      const overlay = new Overlay({
        element: container,
        autoPan: {
          animation: {
            duration: 250
          }
        }
      })

      closer.onclick = function () {
        overlay.setPosition(undefined)
        closer.blur()
        return false
      }

      const map = new Map({
        layers: [createGaodeImageryLayer()],
        overlays: [overlay],
        target: 'map',
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      map.on('singleclick', function (evt) {
        const coordinate = evt.coordinate
        const hdms = toStringHDMS(toLonLat(coordinate))

        content.innerHTML = '<p>您点击的位置：</p><code>' + hdms + '</code>'
        overlay.setPosition(coordinate)
      })

      ExampleGui.addToolbarButton('关闭弹窗', function () {
        overlay.setPosition(undefined)
      })

      ExampleGui.addToolbarButton('重置视图', function () {
        map.getView().animate({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM,
          duration: 600
        })
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
