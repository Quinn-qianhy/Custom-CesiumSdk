<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>喷泉粒子</title>
  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative
    }

    #toolbar {
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      z-index: 8;
    }

    #toolbar input {
      vertical-align: middle;
      padding-top: 2px;
      padding-bottom: 2px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
    <div id="toolbar">
      <table>
        <tbody>
          <tr>
            <td>Rate</td>
            <td>
              <input
                type="range"
                min="0.0"
                max="100.0"
                step="1"
                data-bind="value: emissionRate, valueUpdate: 'input'"
              />
              <input type="text" size="5" data-bind="value: emissionRate" />
            </td>
          </tr>

          <tr>
            <td>Size</td>
            <td>
              <input
                type="range"
                min="2"
                max="60.0"
                step="1"
                data-bind="value: particleSize, valueUpdate: 'input'"
              />
              <input type="text" size="5" data-bind="value: particleSize" />
            </td>
          </tr>

          <tr>
            <td>Min Life</td>
            <td>
              <input
                type="range"
                min="0.1"
                max="30.0"
                step="1"
                data-bind="value: minimumParticleLife, valueUpdate: 'input'"
              />
              <input
                type="text"
                size="5"
                data-bind="value: minimumParticleLife"
              />
            </td>
          </tr>

          <tr>
            <td>Max Life</td>
            <td>
              <input
                type="range"
                min="0.1"
                max="30.0"
                step="1"
                data-bind="value: maximumParticleLife, valueUpdate: 'input'"
              />
              <input
                type="text"
                size="5"
                data-bind="value: maximumParticleLife"
              />
            </td>
          </tr>

          <tr>
            <td>Min Speed</td>
            <td>
              <input
                type="range"
                min="0.0"
                max="30.0"
                step="1"
                data-bind="value: minimumSpeed, valueUpdate: 'input'"
              />
              <input type="text" size="5" data-bind="value: minimumSpeed" />
            </td>
          </tr>

          <tr>
            <td>Max Speed</td>
            <td>
              <input
                type="range"
                min="0.0"
                max="30.0"
                step="1"
                data-bind="value: maximumSpeed, valueUpdate: 'input'"
              />
              <input type="text" size="5" data-bind="value: maximumSpeed" />
            </td>
          </tr>
          <tr>
            <td>重力</td>
            <td>
              <input type="range" min="-20.0" max="20.0" step="1" data-bind="value: gravity, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: gravity">
            </td>
          </tr>
          <tr>
            <td>开始比例</td>
            <td>
              <input type="range" min="0.0" max="20.0" step="1" data-bind="value: startScale, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: startScale">
            </td>
          </tr>

          <tr>
            <td>最终比例</td>
            <td>
              <input type="range" min="0.0" max="20.0" step="1" data-bind="value: endScale, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: endScale">
            </td>
          </tr>

    </div>
    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        navigation: false,
        shouldAnimate: true,
      })

      function computeModelMatrix(entity, time) {
        var position = Cesium.Property.getValueOrUndefined(entity.position, time, new Cesium.Cartesian3());
        if (!Cesium.defined(position)) {
          return undefined;
        }

        const emitterModelMatrix = new Cesium.Matrix4();
        const translation = new Cesium.Cartesian3();
        const rotation = new Cesium.Quaternion();
        let hpr = new Cesium.HeadingPitchRoll();
        const trs = new Cesium.TranslationRotationScale();

        function computeEmitterModelMatrix() {
          hpr = Cesium.HeadingPitchRoll.fromDegrees(0.0, 0.0, 0.0, hpr);
          trs.translation = Cesium.Cartesian3.fromElements(
            0.0,
            0.0,
            5.4,
            translation
          );
          trs.rotation = Cesium.Quaternion.fromHeadingPitchRoll(hpr, rotation);

          return Cesium.Matrix4.fromTranslationRotationScale(
            trs,
            emitterModelMatrix
          );
        }
        return modelMatrix;
      }

      function computeEmitterModelMatrix() {
        var hpr = Cesium.HeadingPitchRoll.fromDegrees(1.0, 1.0, 1.0, new Cesium.HeadingPitchRoll());
        var trs = new Cesium.TranslationRotationScale();
        trs.translation = Cesium.Cartesian3.fromElements(2.5, 4.0, 1.0, new Cesium.Cartesian3());
        trs.rotation = Cesium.Quaternion.fromHeadingPitchRoll(hpr, new Cesium.Quaternion());
        return Cesium.Matrix4.fromTranslationRotationScale(trs, new Cesium.Matrix4());
      }

      const viewModel = {
        emissionRate: 40.0,
        minimumSpeed: 9,
        maximumSpeed: 9.5,
        particleSize: 1.0,
        minimumParticleLife: 6,
        maximumParticleLife: 7,
        gravity: -3.5,
        startScale: 1.0,
        endScale: 20.0,
      };
      Cesium.knockout.track(viewModel);
      const toolbar = document.getElementById("toolbar");
      Cesium.knockout.applyBindings(viewModel, toolbar);

      const entityPosition = new Cesium.Cartesian3();
      const entityOrientation = new Cesium.Quaternion();
      const rotationMatrix = new Cesium.Matrix3();
      const modelMatrix = new Cesium.Matrix4();

      function computeModelMatrix(entity, time) {
        return entity.computeModelMatrix(time, new Cesium.Matrix4());
      }

      const emitterModelMatrix = new Cesium.Matrix4();
      const translation = new Cesium.Cartesian3();
      const rotation = new Cesium.Quaternion();
      let hpr = new Cesium.HeadingPitchRoll();
      const trs = new Cesium.TranslationRotationScale();

      function computeEmitterModelMatrix() {
        hpr = Cesium.HeadingPitchRoll.fromDegrees(0.0, 0.0, 0.0, hpr);
        trs.translation = Cesium.Cartesian3.fromElements(
          0.0,
          0.0,
          5.4,
          translation
        );
        trs.rotation = Cesium.Quaternion.fromHeadingPitchRoll(hpr, rotation);

        return Cesium.Matrix4.fromTranslationRotationScale(
          trs,
          emitterModelMatrix
        );
      }

      const pos2 = Cesium.Cartesian3.fromDegrees(
        121.48960149965716,
        31.2428359062178,
        20
      );
      const entity = viewer.entities.add({
        position: pos2,
      });
      
      viewer.camera.setView({
        destination: {
          x: -2850929.1897931746, y: 4654412.652213738, z: 3288963.1104693376
        },
        orientation: {
            heading : 1.4083154475775492, 
            pitch : -0.4255405501795515,    
            roll : 0.0000059739718007989495                       
          }
      })
      var particleSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
        image: 'static/examples/sampleData/image/fountain.png',
        scale: viewModel.scale,
        startColor: new Cesium.Color(1, 1, 1, 0.6),
        endColor: new Cesium.Color(0.8, 0.86, 1, 0.4),
        minimumParticleLife: viewModel.minimumParticleLife,
        maximumParticleLife: viewModel.maximumParticleLife,
        minimumSpeed: viewModel.minimumSpeed,
        maximumSpeed: viewModel.maximumSpeed,
        imageSize: new Cesium.Cartesian2(
          viewModel.particleSize,
          viewModel.particleSize
        ),
        emissionRate: viewModel.emissionRate,
        sizeInMeters: true,
        lifetime: 16.0,
        emitter: new Cesium.CircleEmitter(2.0),
        emitterModelMatrix: computeEmitterModelMatrix(),
        updateCallback: applyGravity,
      }));

      const gravityScratch = new Cesium.Cartesian3();

      function applyGravity(p, dt) {
        // We need to compute a local up vector for each particle in geocentric space.
        const position = p.position;

        Cesium.Cartesian3.normalize(position, gravityScratch);
        Cesium.Cartesian3.multiplyByScalar(
          gravityScratch,
          viewModel.gravity * dt,
          gravityScratch
        );

        p.velocity = Cesium.Cartesian3.add(
          p.velocity,
          gravityScratch,
          p.velocity
        );
      }

      viewer.scene.preUpdate.addEventListener(function (scene, time) {
        particleSystem.modelMatrix = computeModelMatrix(entity, time);

        // Account for any changes to the emitter model matrix.
        particleSystem.emitterModelMatrix = computeEmitterModelMatrix();
      });

      Cesium.knockout
        .getObservable(viewModel, "emissionRate")
        .subscribe(function (newValue) {
          particleSystem.emissionRate = parseFloat(newValue);
        });
      const scene = viewer.scene;

      Cesium.knockout
        .getObservable(viewModel, "minimumParticleLife")
        .subscribe(function (newValue) {
          particleSystem.minimumParticleLife = parseFloat(newValue);
        });

      Cesium.knockout
        .getObservable(viewModel, "maximumParticleLife")
        .subscribe(function (newValue) {
          particleSystem.maximumParticleLife = parseFloat(newValue);
        });

      Cesium.knockout
        .getObservable(viewModel, "minimumSpeed")
        .subscribe(function (newValue) {
          particleSystem.minimumSpeed = parseFloat(newValue);
        });

      Cesium.knockout
        .getObservable(viewModel, "maximumSpeed")
        .subscribe(function (newValue) {
          particleSystem.maximumSpeed = parseFloat(newValue);
        });
      Cesium.knockout
        .getObservable(viewModel, "startScale")
        .subscribe(function (newValue) {
          particleSystem.startScale = parseFloat(newValue);
        });

        Cesium.knockout
        .getObservable(viewModel, "endScale")
        .subscribe(function (newValue) {
          particleSystem.endScale = parseFloat(newValue);
        });

        Cesium.knockout
          .getObservable(viewModel, "startScale")
          .subscribe(function (newValue) {
            particleSystem.startScale = parseFloat(newValue);
          });

        Cesium.knockout
          .getObservable(viewModel, "endScale")
          .subscribe(function (newValue) {
            particleSystem.endScale = parseFloat(newValue);
          });

    </script>
</body>

</html>
