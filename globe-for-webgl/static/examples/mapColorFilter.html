<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>地图反色滤镜</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer")
    
    //初始定位位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000000.0), //四川省政府
    })
    const baseLayer = viewer.imageryLayers.get(0);
    function openRGB() {
        baseLayer.invertColor = true;
        baseLayer.filterRGB = [70.0, 120.0, 110.0];
        baseLayer.brightness = 3.0
      }
    function closeRGB() {
        baseLayer.invertColor = false;
        baseLayer.filterRGB = [255.0, 255.0, 255.0]
        baseLayer.brightness = 1.0
      }
    Sandcastle.addToolbarButton("打开滤镜", function () {
        openRGB()
      })
    Sandcastle.addToolbarButton("关闭滤镜", function () {
        closeRGB()
      })
  </script>
</body>

</html>
