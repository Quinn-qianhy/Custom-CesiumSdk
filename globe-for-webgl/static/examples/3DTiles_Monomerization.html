<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>倾斜摄影模型单体化(分层)</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      terrainProvider: Cesium.createWorldTerrain()
    })
    //初始定位位置
    viewer.camera.setView({
      destination: new Cesium.Cartesian3(
        1216352.4855131074,
        -4736507.396104574,
        4081206.3279404473
      ),
      orientation: new Cesium.HeadingPitchRoll(
        0.08033365594766728,
        -0.29519015695063455,
        0.00027759141518046704
      ),
      endTransform: Cesium.Matrix4.IDENTITY,
    })

    //单体化楼栋以及层级参数
    var buildingOptions = [{
        center: new Cesium.Cartesian3(1216389.3637977627, -4736323.641980423, 4081321.7428341154), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(2.619728786416368, 0.0, 0.0), //旋转矩阵
        translation: new Cesium.Cartesian3(-8, 15.5, 5.0), //平移矩阵
        rectangle: new Cesium.Cartesian3(70.0, 36.5, 10.0), //矩形长宽高
        name: '楼1层4' //矩形名字
      },
      {
        center: new Cesium.Cartesian3(1216389.3637977627, -4736323.641980423, 4081321.7428341154), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(2.619728786416368, 0.0, 0.0), //旋转矩阵
        translation: new Cesium.Cartesian3(-8, 15.5, -2.0), //平移矩阵
        rectangle: new Cesium.Cartesian3(70.0, 36.5, 5.0), //矩形长宽高
        name: '楼1层3' //矩形名字
      },
      {
        center: new Cesium.Cartesian3(1216389.3637977627, -4736323.641980423, 4081321.7428341154), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(2.619728786416368, 0.0, 0.0), //旋转矩阵
        translation: new Cesium.Cartesian3(-8, 15.5, -6.0), //平移矩阵
        rectangle: new Cesium.Cartesian3(70.0, 36.5, 4.0), //矩形长宽高
        name: '楼1层2' //矩形名字
      },
      {
        center: new Cesium.Cartesian3(1216389.3637977627, -4736323.641980423, 4081321.7428341154), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(2.619728786416368, 0.0, 0.0), //旋转矩阵
        translation: new Cesium.Cartesian3(-8, 15.5, -10.0), //平移矩阵
        rectangle: new Cesium.Cartesian3(70.0, 36.5, 4.0), //矩形长宽高
        name: '楼1层1' //矩形名字
      },

      {
        center: new Cesium.Cartesian3(1216303.4975655659, -4736325.156402523, 4081345.200025963), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(-2.0958728786416368, 0, 0), //旋转矩阵
        translation: new Cesium.Cartesian3(0, -1, 0), //平移矩阵
        rectangle: new Cesium.Cartesian3(77.0, 38, 10.0), //矩形长宽高
        name: '楼2层3' //矩形名字
      },
      {
        center: new Cesium.Cartesian3(1216303.4975655659, -4736325.156402523, 4081345.200025963), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(-2.0958728786416368, 0, 0), //旋转矩阵
        translation: new Cesium.Cartesian3(0, -1, -7), //平移矩阵
        rectangle: new Cesium.Cartesian3(77.0, 38, 4.0), //矩形长宽高
        name: '楼2层2' //矩形名字
      },
      {
        center: new Cesium.Cartesian3(1216303.4975655659, -4736325.156402523, 4081345.200025963), //矩形中心点
        rotation: new Cesium.HeadingPitchRoll(-2.0958728786416368, 0, 0), //旋转矩阵
        translation: new Cesium.Cartesian3(0, -1, -11), //平移矩阵
        rectangle: new Cesium.Cartesian3(77.0, 38, 4.0), //矩形长宽高
        name: '楼2层1' //矩形名字
      },
    ]

    var scene = viewer.scene;
    var camera = scene.camera;
    //矩形以及初始模型矩阵
    for (let i = 0; i < buildingOptions.length; i++) {
      var rectangleCenter = buildingOptions[i].center;
      var centerModelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(rectangleCenter);
      var hprRotation = Cesium.Matrix3.fromHeadingPitchRoll(buildingOptions[i].rotation);
      var hpr = Cesium.Matrix4.fromRotationTranslation(hprRotation, buildingOptions[i].translation);
      Cesium.Matrix4.multiply(centerModelMatrix, hpr, centerModelMatrix);

      var buildingHighlights = scene.primitives.add(new Cesium.ClassificationPrimitive({
        geometryInstances: new Cesium.GeometryInstance({
          geometry: Cesium.BoxGeometry.fromDimensions({
            vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
            dimensions: buildingOptions[i].rectangle
          }),
          modelMatrix: centerModelMatrix,
          attributes: {
            color: Cesium.ColorGeometryInstanceAttribute.fromColor(new Cesium.Color.fromRandom().withAlpha(
              0.5)),
            show: new Cesium.ShowGeometryInstanceAttribute(true)
          },
          id: {
            name: buildingOptions[i].name
          }
        }),
        classificationType: Cesium.ClassificationType.CESIUM_3D_TILE
      }));
    }

    var tileset = new Cesium.Cesium3DTileset({
      url: Cesium.IonResource.fromAssetId(6074)
    });
    scene.primitives.add(tileset);

    var currentObjectId;
    var currentPrimitive;
    var currentColor;
    var currentShow;
    var attributes;

    var handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
    handler.setInputAction(function (movement) {
      var pickedObject = scene.pick(movement.endPosition);
      if (Cesium.defined(pickedObject) && Cesium.defined(pickedObject.id)) {
        if (pickedObject.id === currentObjectId) {
          return;
        }
        if (Cesium.defined(currentObjectId)) {
          attributes = currentPrimitive.getGeometryInstanceAttributes(currentObjectId);
          attributes.color = currentColor;
          attributes.show = currentShow;
          currentObjectId = undefined;
          currentPrimitive = undefined;
          currentColor = undefined;
          currentShow = undefined;
        }
      }

      if (Cesium.defined(pickedObject) && Cesium.defined(pickedObject.primitive) && Cesium.defined(pickedObject
          .id) && Cesium.defined(pickedObject.primitive.getGeometryInstanceAttributes)) {
        currentObjectId = pickedObject.id;
        currentPrimitive = pickedObject.primitive;
        attributes = currentPrimitive.getGeometryInstanceAttributes(currentObjectId);
        currentColor = attributes.color;
        currentShow = attributes.show;
        if (!scene.invertClassification) {
          attributes.color = [255, 0, 0, 128];
        }
        attributes.show = [1];
      } else if (Cesium.defined(currentObjectId)) {
        attributes = currentPrimitive.getGeometryInstanceAttributes(currentObjectId);
        attributes.color = currentColor;
        attributes.show = currentShow;
        currentObjectId = undefined;
        currentPrimitive = undefined;
        currentColor = undefined;
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

  </script>
</body>

</html>
