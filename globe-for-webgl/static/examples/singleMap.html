<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>单张图片加载</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";

    var imageUrl = '/static/examples/singlePicture/singleMap1.jpg'
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.SingleTileImageryProvider({
        rectangle: Cesium.Rectangle.fromDegrees(-180.0, -90.0, 180.0, 90.0),
        url: imageUrl
      })
    })
    viewer.scene.globe.depthTestAgainstTerrain = true

    //切换底图
    function selectImage(num) {
      switch (num) {
        case 1:
          imageUrl = '/static/examples/singlePicture/singleMap1.jpg'
            break
        case 2:
          imageUrl = '/static/examples/singlePicture/singleMap2.jpg'
            break
        case 3:
          imageUrl = '/static/examples/singlePicture/singleMap3.jpg'
            break
        case 4:
          imageUrl = '/static/examples/singlePicture/singleMap4.jpg'
            break
      }
      viewer.imageryLayers.addImageryProvider(
        new Cesium.SingleTileImageryProvider({
          rectangle: Cesium.Rectangle.fromDegrees(-180.0, -90.0, 180.0, 90.0),
          url: imageUrl
        })
      )
    }

    //初始定位位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.126, 30.575, 20000000.0), //四川省成都市
    })

    Sandcastle.addToolbarButton("图片1", function () {
      selectImage(1)
    })
    Sandcastle.addToolbarButton("图片2", function () {
      selectImage(2)
    })
    Sandcastle.addToolbarButton("图片3", function () {
      selectImage(3)
    })
    Sandcastle.addToolbarButton("图片4", function () {
      selectImage(4)
    })

  </script>
</body>

</html>
