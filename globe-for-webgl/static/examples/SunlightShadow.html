<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>日照阴影</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar">
    <table>
      <tbody>
        <td>日照阴影</td>
        <td>
          <input type="checkbox" data-bind="checked: SunlightShadow">
        </td>
      </tbody>
    </table>
  </div>
  <script type="text/javascript">
    "use script";
    const viewer = new Cesium.Viewer("cesiumContainer", {
      shouldAnimate: true,
    });
    atLayer = new Cesium.UrlTemplateImageryProvider({
      url: "http://webrd02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",
      minimumLevel: 3,
      maximumLevel: 18
    })
    viewer.imageryLayers.addImageryProvider(atLayer);
    viewer.scene.sun.glowFactor = 20

    viewer.scene.imageryLayers.get(0).alpha = 0
    viewer.scene.globe.baseColor = Cesium.Color.DARKOLIVEGREEN
    var tileset = viewer.scene.primitives.add(
      new Cesium.Cesium3DTileset({
        url: 'http://172.20.16.213:8888/3dtiles/chengdu_building/tileset.json',
        maximumScreenSpaceError: 4
      })
    );

    viewer.camera.flyTo({
      destination: {
        x: -1338716.6473931035,
        y: 5329508.728315589,
        z: 3231157.5851133587
      },
      orientation: {
        heading: 6.260334858779589,
        pitch: -0.8275971699767104,
        roll: 0.00013416028952839554
      },
      duration: 2
    })

    const viewModel = {
      SunlightShadow: false,
    };
    Cesium.knockout.track(viewModel);
    const toolbar = document.getElementById("toolbar");
    Cesium.knockout.applyBindings(viewModel, toolbar);
    for (const name in viewModel) {
      if (viewModel.hasOwnProperty(name)) {
        Cesium.knockout
          .getObservable(viewModel, name)
          .subscribe(updatePostProcess);
      }
    }
    function updatePostProcess() {
        viewer.scene.globe.enableLighting = Boolean(viewModel.SunlightShadow);;
        viewer.shadows = Boolean(viewModel.SunlightShadow);;
        viewer.clock.multiplier = 500;
    }
    updatePostProcess()

  </script>
</body>

</html>
