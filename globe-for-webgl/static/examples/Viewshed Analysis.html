<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>测试</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <script src="/static/examples/pluginJs/cesium-viewshed.js"></script>
  <!-- <script src="/static/examples/pluginJs/ViewShed3D.js"></script> -->
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      left: 5px;
      top: 5px;
    }

    #toolbar input {
      vertical-align: middle;
      padding-top: 2px;
      padding-bottom: 2px;
    }

    #toolbar .header {
      font-weight: bold;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar">
    <table>
      <tr>
        <td>水平夹角</td>
        <td>
          <input type="range" min="0.0" max="180.0" step="1" data-bind="value: horizontalAngle, valueUpdate: 'input'">
          <input type="text" size="5" data-bind="value: horizontalAngle">
        </td>
      </tr>
      <tr>
        <td>垂直夹角</td>
        <td>
          <input type="range" min="0.0" max="180.0" step="1" data-bind="value: verticalAngle, valueUpdate: 'input'">
          <input type="text" size="5" data-bind="value: verticalAngle">
        </td>
      </tr>
      <tr>
        <td>透明度</td>
        <td>
          <input type="range" min="0.0" max="1" step="0.1" data-bind="value: alpha, valueUpdate: 'input'">
          <input type="text" size="5" data-bind="value: alpha">
        </td>
      </tr>
    </table>
  </div>
  <script type="text/javascript">
    "use script";

    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    });

    viewer.scene.globe.depthTestAgainstTerrain = true;

    var tileset = viewer.scene.primitives.add(
      new Cesium.Cesium3DTileset({
        url: 'http://172.20.16.213:8888/3dtiles/chengdu_building/tileset.json',
        maximumScreenSpaceError: 4,
        appearanceGradientByHeight: true
      })
    );
    const style = {
      color: {
        conditions: [
          ["true", "color('aqua')"]
        ]
      }
    };
    tileset.style = new Cesium.Cesium3DTileStyle(style);

    tileset.readyPromise
      .then(function (tileset) {
        viewer.flyTo(
          tileset,
          new Cesium.HeadingPitchRange(
            0.0,
            -0.5,
            tileset.boundingSphere.radius * 2.0
          )
        );
      })
    var arrViewField = [];
    var viewModel = {
      verticalAngle: 90, //垂直夹角
      horizontalAngle: 120, //水平夹角
      distance: 10, //观测距离
      alpha: 0.5, //透明度
    };
    Cesium.knockout.track(viewModel);
    const toolbar = document.getElementById("toolbar");
    Cesium.knockout.applyBindings(viewModel, toolbar);

    Cesium.knockout
      .getObservable(viewModel, "horizontalAngle")
      .subscribe(function (newValue) {
        if (Number(newValue)) {
          viewModel.horizontalAngle = newValue;
          // clearAllViewField()
        }
      });
    Cesium.knockout
      .getObservable(viewModel, "verticalAngle")
      .subscribe(function (newValue) {
        if (Number(newValue)) {
          viewModel.verticalAngle = newValue;
          // clearAllViewField()
        }
      });
    Cesium.knockout
      .getObservable(viewModel, "alpha")
      .subscribe(function (newValue) {
        if (Number(newValue)) {
          viewModel.alpha = newValue;
          // clearAllViewField()
        }
      });

    function addViewField() {
      var e = new Cesium.ViewShed3D(viewer, {
        horizontalAngle: Number(viewModel.horizontalAngle),
        verticalAngle: Number(viewModel.verticalAngle),
        distance: Number(viewModel.distance),
        alpha: Number(viewModel.alpha),
        calback: function () {
          viewModel.distance = e.distance
        }
      });
      arrViewField.push(e)
    }
    // 清除可视域
    function clearAllViewField() {
      for (var e = 0, i = arrViewField.length; e < i; e++) {
        arrViewField[e].destroy()
      }
      arrViewField = []
    }


    Sandcastle.addToolbarButton("添加可视域", function () {
      addViewField()
    })
    Sandcastle.addToolbarButton("删除可视域", function () {
      clearAllViewField()
    })

  </script>
</body>

</html>
