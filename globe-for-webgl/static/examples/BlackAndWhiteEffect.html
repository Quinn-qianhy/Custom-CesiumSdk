<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>黑白效果</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar">
    <table>
      <tbody>
          <td>黑白效果</td>
          <td>
            <input type="checkbox" data-bind="checked: blackAndWhiteShow">
          </td>
          <td>
            <input type="range" min="1" max="10" step="1"
              data-bind="value: blackAndWhiteGradations, valueUpdate: 'input'">
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false
    })
    viewer.scene.imageryLayers.get(0).alpha = 0
    viewer.scene.globe.baseColor = Cesium.Color.DARKOLIVEGREEN
    //初始定位位置
    viewer.camera.flyTo({
      destination: {
        x: -1469200.109729519,
        y: 5184992.517968472,
        z: 3401307.075514329
      },
      orientation: {
        direction: {
          x: -0.1506058934247801,
          y: -0.8486043414325113,
          z: 0.5071375913572349
        },
        up: {
          x: -0.3126414843742682,
          y: 0.5275447698515602,
          z: 0.7899062083883874
        }
      },
      duration: 3
    })

    var tileset = new Cesium.Cesium3DTileset({
      url: Cesium.IonResource.fromAssetId(75343),
    });
    tileset.readyPromise
      .then(function (tileset) {
        viewer.scene.primitives.add(tileset);
      })

    const viewModel = {
      blackAndWhiteShow: false,
      blackAndWhiteGradations: 5.0,
    };
    Cesium.knockout.track(viewModel);
    const toolbar = document.getElementById("toolbar");
    Cesium.knockout.applyBindings(viewModel, toolbar);
    for (const name in viewModel) {
      if (viewModel.hasOwnProperty(name)) {
        Cesium.knockout
          .getObservable(viewModel, name)
          .subscribe(updatePostProcess);
      }
    }
    const stages = viewer.scene.postProcessStages;
    const blackAndWhite = stages.add(
      Cesium.PostProcessStageLibrary.createBlackAndWhiteStage()
    );
    function updatePostProcess() {
      blackAndWhite.enabled = Boolean(viewModel.blackAndWhiteShow);
      blackAndWhite.uniforms.gradations = Number(
        viewModel.blackAndWhiteGradations
      );
    }
    updatePostProcess()

  </script>
</body>

</html>
