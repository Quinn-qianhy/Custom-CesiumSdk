<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>热力图</title>

    <script src="/static/examples/Sandcastle-header.js"></script>
    <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
    <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/static/examples/bucket.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #toolbar {
        left: 5px;
        top: 5px;
        background: rgba(42, 42, 42, 0.8);
        padding: 4px;
        border-radius: 4px;
      }

      #toolbar input {
        vertical-align: middle;
        padding-top: 2px;
        padding-bottom: 2px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    <div id="toolbar">
      <div>3d 夸张</div>
      <input type="range" style="width: 300px" min="1" max="1000" step="1" data-bind="value: intensityScale, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: intensityScale" step="1">
    </div>

    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer")

      viewer.scene.globe.depthTestAgainstTerrain = false;

      var tileset = viewer.scene.primitives.add(
        new Cesium.Cesium3DTileset({
          url:Cesium.IonResource.fromAssetId(75343),
          maximumScreenSpaceError: 4
        })
      );

      tileset.readyPromise
        .then(function(tileset) {
          viewer.zoomTo(
            tileset,
            new Cesium.HeadingPitchRange(
              0.0,
              -0.5,
              tileset.boundingSphere.radius * 2.0
            )
          );
        })
      let bounds = {
        west: 99999,
        east: -99999,
        south: -99999,
        north: 99999
      };
      var opt = {
        // heatmap.js options go here
        backgroundColor: "rgba (0,0,0,0)",
        radius: 30,
        maxOpacity: 0.5,
        minOpacity: 0,
        blur: 0.75,
        gradient: {
          // enter n keys between 0 and 1 here
          // for gradient color customization
          ".3": "blue",
          ".5": "green",
          ".8": "yellow",
          ".95": "red"
        }
      };
      var data = {};
      data.points = [];
      data.min = 0;
      data.max = 100;

      for (var i = 0; i < 5000; i++) {
        var x = 103.99 + 0.2 * Math.random();
        var y = 30.6 + 0.1 * Math.random();
        data.points.push({ x: x, y: y, value: Math.random() * 100 });
        if (bounds.west > x) bounds.west = x;
        if (bounds.east < x) bounds.east = x;
        if (bounds.south < y) bounds.south = y;
        if (bounds.north > y) bounds.north = y;
      }
      var heatmapGraphic = new Cesium.HeatmapGraphic({
        bounds: bounds,
        heatmapOptions: opt,
        data: data,
        viewer: viewer,
        intensityScale: 100 // 大于0 启用3d,默认0
      });
      
      
      var viewModel = {
        intensityScale: 100,
      };
      Cesium.knockout.track(viewModel);
      var toolbar = document.getElementById("toolbar");
      Cesium.knockout.applyBindings(viewModel, toolbar);
      Cesium.knockout
        .getObservable(viewModel, "intensityScale")
        .subscribe(function (intensityScale) {
          heatmapGraphic._heatmapGraphic._material.uniforms.intensityScale = intensityScale;
        }); 
    </script>
  </body>
</html>
