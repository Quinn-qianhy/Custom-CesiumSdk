<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>地形夸张</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      right: 5px;
      top: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
    }
  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
  <div id="toolbar">
    <td>夸张程度</td>
    <td>
      <input type="range" min="1.0" max="10.0" step="1.0" data-bind="value: exaggeration, valueUpdate: 'input'">
    </td>
  </div>
  <script type="text/javascript">
    "use script";
    
    
    var viewer = new Cesium.Viewer("cesiumContainer", {
      terrainProvider: new Cesium.ArcGISTiledElevationTerrainProvider({
        url: 'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer',
      }),
      terrainExaggeration:3
    })
    viewer.scene.globe.depthTestAgainstTerrain = true
    var globe = viewer.scene.globe
    viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({
        url: "https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}"
      })
    )
    var viewModel = {
      exaggeration: globe.terrainExaggeration
    }
   

    Cesium.knockout.track(viewModel)
    var toolbar = document.getElementById("toolbar")
    Cesium.knockout.applyBindings(viewModel, toolbar)

    Cesium.knockout.getObservable(viewModel, 'exaggeration').subscribe(function (newValue) {
      viewModel.exaggeration  = Number(newValue)
      globe.terrainExaggeration = viewModel.exaggeration
    })




    //初始定位位置
    viewer.camera.setView({
      destination: {
        x: -1135832.2500233247,
        y: 5482646.852955472,
        z: 3124157.6677550175
      },
      orientation: {
        heading: 0.9231787775159015,
        pitch: -0.409062086563442,
        roll: 0.002490493263910487
      },
      duration: 1
    })

  </script>
</body>

</html>
