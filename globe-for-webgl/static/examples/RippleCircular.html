<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>波纹圆示例</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative
    }

    #toolbar {
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      z-index: 9;
    }

    #toolbar input {
      vertical-align: middle;
      padding-top: 2px;
      padding-bottom: 2px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
    <div id="toolbar">
      <div>渐变曲率</div>
      <input type="range" min="0.1" max="1" step="0.1" data-bind="value: gradient, valueUpdate: 'input'">
      <input type="text" size="1" data-bind="value: gradient">
      <div>波浪数量</div>
      <input type="range" min="1" max="10" step="1" data-bind="value: count, valueUpdate: 'input'">
      <input type="text" size="1" data-bind="value: count">
      <div>持续时间</div>
      <input type="range" min="500" max="5000" step="500" data-bind="value: duration, valueUpdate: 'input'">
      <input type="text" size="1" data-bind="value: duration">
    </div>
  </div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    });
    viewer.scene.globe.depthTestAgainstTerrain = false;
    var stages = viewer.scene.postProcessStages;
    viewer.scene.brightness = viewer.scene.brightness || stages.add(Cesium.PostProcessStageLibrary
      .createBrightnessStage());
    viewer.scene.brightness.enabled = true;
    viewer.scene.brightness.uniforms.brightness = 1.5;
    viewer.scene.globe.depthTestAgainstTerrain = true;
    const entity = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(104.063245, 30.6628335),
      ellipse: {
        semiMajorAxis: 1000.0,
        semiMinorAxis: 1000.0,
        material: new Cesium.RippleCircleMaterialProperty({
          color: new Cesium.Color(1, 0.9725, 0.0745, 0.5), // 颜色
          gradient: 0.5,
          duration: 2500
        }),
        height: 10,
      }
    })
    const viewModel = {
      gradient: 0.5,
      duration: 2500,
      count: 2
    }
    Cesium.knockout.track(viewModel);
    const toolbar = document.getElementById("toolbar");
    Cesium.knockout.applyBindings(viewModel, toolbar);

    Cesium.knockout
      .getObservable(viewModel, "gradient")
      .subscribe(function (gradient) {
        entity.ellipse.material.gradient = gradient
        if (isNaN(gradient)) {
          return;
        }
      });
    Cesium.knockout
      .getObservable(viewModel, "count")
      .subscribe(function (count) {
        entity.ellipse.material.count = count
        if (isNaN(count)) {
          return;
        }
      });
    Cesium.knockout
      .getObservable(viewModel, "duration")
      .subscribe(function (duration) {
        entity.ellipse.material.duration = duration
        if (isNaN(duration)) {
          return;
        }
      });
    viewer.zoomTo(entity)
    

  </script>
</body>

</html>
