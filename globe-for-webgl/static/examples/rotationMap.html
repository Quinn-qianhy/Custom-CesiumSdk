<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>地球旋转</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar">
    <div>速度</div>
    <input type="range" min="1" max="20" step="1" data-bind="value: multiplier, valueUpdate: 'input'">
  </div>

  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      }),
      shouldAnimate: true
    });

    let prev = viewer.clock.currentTime;
    var icrf = () => {
      var position = viewer.camera.position
      var {
        height
      } = viewer.scene.globe.ellipsoid.cartesianToCartographic(position)
      const a = (465.2 / (6371 * 1000)) * (height + 6371 * 1000);
      var currentTime = viewer.clock.currentTime
      const interval = Cesium.JulianDate.toDate(currentTime) - Cesium.JulianDate.toDate(prev);
      prev = currentTime;
      viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, (Math.PI / (24 * 60 * 60)) * (interval * a / 100))
    }
    viewer.clock.onTick.addEventListener(icrf);
   function start(){
        viewer.clock.multiplier = Number(viewModel.multiplier)
   }

   var viewModel = {
    multiplier: 1
    }
    Cesium.knockout.track(viewModel)
    var toolbar = document.getElementById("toolbar")
    Cesium.knockout.applyBindings(viewModel, toolbar)

    Cesium.knockout.getObservable(viewModel, "multiplier")
      .subscribe(start)

  </script>
</body>

</html>
