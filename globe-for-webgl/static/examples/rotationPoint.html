<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>绕点旋转</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    })

    viewer.scene.globe.depthTestAgainstTerrain = false
   
    var primitive = new Cesium.PointPrimitiveCollection()
    var points = viewer.scene.primitives.add(primitive)

    // 添加单个点
    function addPoint() {
      points.add({
        position: new Cesium.Cartesian3.fromDegrees(104.08, 30.65, 0),
        color: Cesium.Color.YELLOW,
        pixelSize: 10
      })
      viewer.camera.setView({
        // destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000.0),
        destination: {
          x: -1339648.3917152071,
          y: 5336854.133361579,
          z: 3225066.7272186535
        },
        orientation: {
          direction: {
            x: 0.32291598617590284,
            y: -0.7574487396915219,
            z: 0.5674475064812333
          },
          up: {
            x: -0.08366460016485465,
            y: 0.5743744989038251,
            z: 0.8143059435422506
          }
        },
      })
    }
    addPoint()
    viewer.camera.setView({
        // destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000.0),
        destination: {
          x: -1339648.3917152071,
          y: 5336854.133361579,
          z: 3225066.7272186535
        },
        orientation: {
          direction: {
            x: 0.32291598617590284,
            y: -0.7574487396915219,
            z: 0.5674475064812333
          },
          up: {
            x: -0.08366460016485465,
            y: 0.5743744989038251,
            z: 0.8143059435422506
          }
        },
      })

    const aa = new Cesium.BaseThing(viewer)
    const bb =aa.RotationPoint({pitch: -35, height: 4000})
      function start(){
        bb.addEvent()
      }
      function close(){
        bb.removeEvent()
      }
   
    Sandcastle.addToolbarButton("开始", function () {
        start();
    })
    Sandcastle.addToolbarButton("结束", function () {
        close()
    });

  </script>
</body>

</html>
