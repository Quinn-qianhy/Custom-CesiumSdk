<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>视角记录</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";

    var cameraReview = {
      views: [],
      pointer: -1,
      updateViews: true
    }
    var startView = {
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000000.0), //四川省政府、
    }
    var viewer = new Cesium.Viewer("cesiumContainer", {
      scene3Donly: true,
      imageryProvider: new Cesium.UrlTemplateImageryProvider({
        url: "https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}"
      })
    })
    viewer.scene.globe.depthTestAgainstTerrain = false

    var cameraReview = viewer.camera.handleCameraReview(true)

    function switchCameraView(cameraReview, type) {
      if ((cameraReview.pointer === 0 && type === 'previous') || (cameraReview.pointer === cameraReview.views.length -
          1 && type === 'next')) {
        alert('已经到头啦!')
        return
      }
      if (type === 'previous') {
        cameraReview.pointer--
      } else if (type === 'next') {
        cameraReview.pointer++
      }
      cameraReview.views[cameraReview.pointer].complete = function () {
        cameraReview.updateViews = false
      }
      cameraReview.views[cameraReview.pointer].cancel = function () {
        cameraReview.updateViews = false
      }
      cameraReview.updateViews = false
      viewer.camera.flyTo(cameraReview.views[cameraReview.pointer])
      console.log(cameraReview);
    }


    Sandcastle.addToolbarButton("上一个视图", function () {
      switchCameraView(cameraReview, 'previous')
    })
    Sandcastle.addToolbarButton("下一个视图", function () {
      switchCameraView(cameraReview, 'next')
    })

  </script>
</body>

</html>
