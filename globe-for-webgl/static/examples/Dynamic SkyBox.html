<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>动态天空盒</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      timeline: true,
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url:
          "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",
        enablePickFeatures: false,
      }),
      contextOptions: {
        requestWebgl2: true,
      },
    });
    // viewer.scene.logarithmicDepthBuffer = false
    viewer.scene.globe.depthTestAgainstTerrain = true;
    var scene = viewer.scene;
    scene.skyAtmosphere.dynamic = true;
    scene.camera.setView({
      destination: new Cesium.Cartesian3(
        -2850427.424800401,
        4654587.183552037,
        3289972.194967335
      ),
      orientation: {
        direction: new Cesium.Cartesian3(
          -0.5880229759031641,
          -0.22046178263746055,
          -0.278219494876799
        ),
        up: new Cesium.Cartesian3(
          -0.6535959556934616,
          0.6963045356153443,
          0.3966012818290751
        ),
      },
    });
    Sandcastle.addToolbarButton("动态天空", function () {
      scene.skyAtmosphere.dynamic = !scene.skyAtmosphere.dynamic;
    });

  </script>
</body>

</html>
