<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>路径飞行</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer('cesiumContainer');

    var cameraTrackControls = new Cesium.RouteFlyManager(viewer.scene);

    Sandcastle.addToolbarButton('添加关键点', function() {
        cameraTrackControls.addCameraTrack(viewer.camera);
    });

    Sandcastle.addToolbarButton('开始飞行', function() {
        cameraTrackControls.play();
    });

    Sandcastle.addToolbarButton('暂停飞行', function() {
        cameraTrackControls.pause();
    });

    Sandcastle.addToolbarButton('结束飞行', function() {
        cameraTrackControls.stop();
    });

    Sandcastle.addToolbarButton('获取数据', function() {
        console.log(cameraTrackControls.getRoutes());
    });

  </script>
</body>

</html>
