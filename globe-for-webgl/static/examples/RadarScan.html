<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>圆形雷达扫描线效果</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
  </div>
  <div id="toolbar">
    <div>扫描速度</div>
      <input type="range" min="10" max="50" step="10" data-bind="value: speed, valueUpdate: 'input'">
      <input type="text" size="1" data-bind="value: speed">
  </div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false
    });
    viewer.scene.globe.depthTestAgainstTerrain = true; //开启深度检测

    const rader = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(104.063245, 30.6628335),
      name: '雷达扫描',
      ellipse: {
        semiMajorAxis: 1000.0,
        semiMinorAxis: 1000.0,
        material: new Cesium.RadarScanMaterialProperty({
          color: new Cesium.Color(1.0, 0.0, 0.0, 0.7),
          speed: 10.0,
        }),
        height: 10.0,
        heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
      }
    })
   
    const viewModel = {
      speed: 10
    }
    Cesium.knockout.track(viewModel);
    const toolbar = document.getElementById("toolbar");
    Cesium.knockout.applyBindings(viewModel, toolbar);
    Cesium.knockout
      .getObservable(viewModel, "speed")
      .subscribe(function (speed) {
        rader.ellipse.material.speed = speed
        if (isNaN(speed)) {
          return;
        }
      })
      viewer.zoomTo(rader)
  </script>
</body>

</html>
