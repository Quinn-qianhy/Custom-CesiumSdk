<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>水面倒影</title>

    <script src="/static/examples/Sandcastle-header.js"></script>
    <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
    <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/static/examples/bucket.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #toolbar {
        left: 5px;
        top: 5px;
        background: rgba(42, 42, 42, 0.8);
        padding: 4px;
        border-radius: 4px;
      }

      #toolbar input {
        vertical-align: middle;
        padding-top: 2px;
        padding-bottom: 2px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    <div id="toolbar">
      <div>frequency 频率</div>
      <input type="range" style="width:300px" min="10" max="100000" step="10" data-bind="value: frequency, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: frequency" step="10">
      <div>amplitude 振幅</div>
      <input type="range" style="width:300px" min="5" max="200" step="10" data-bind="value: amplitude, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: amplitude" step="10">
      <div>R</div>
      <input type="range" style="width:300px" min="0" max="1" step="0.01" data-bind="value: x, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: x" step="0.1">
      <div>G</div>
      <input type="range" style="width:300px" min="0" max="1" step="0.01" data-bind="value: y, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: y" step="0.1">
      <div>B</div>
      <input type="range" style="width:300px" min="0" max="1" step="0.01" data-bind="value: z, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: z" step="0.01">
      <div>alpha 透明度</div>
      <input type="range" style="width:300px" min="0" max="1" step="0.1" data-bind="value: alpha, valueUpdate: 'input'">
      <input type="number" size="5" data-bind="value: alpha" step="0.1">
    </div>

    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
          url:
            "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",
          show: true
        }),
        orderIndependentTranslucency: false,
        contextOptions: {
          requestWebgl2: true
        }
      });

      viewer.scene.globe.depthTestAgainstTerrain = true;

      var scene = viewer.scene;
      scene.camera.setView({
        destination: new Cesium.Cartesian3(
          -2850427.424800401,
          4654587.183552037,
          3289972.194967335
        ),
        orientation: {
          direction: new Cesium.Cartesian3(
            -0.5880229759031641,
            -0.22046178263746055,
            -0.778219494876799
          ),
          up: new Cesium.Cartesian3(
            -0.6535959556934616,
            0.6963045356153443,
            0.2966012818290751
          )
        }
      });
      scene.primitives.add(Cesium.createOsmBuildings());
      var tileset_nanpu = scene.primitives.add(
        new Cesium.Cesium3DTileset({
          url: "http://180.167.213.122:18000/model/nanpudaqiao/tileset.json",
          skipLevelOfDetail: true,
          maximumScreenSpaceError: 24
        })
      );
      tileset_nanpu.readyPromise
        .then(function(tileset) {
          viewer.scene.primitives.add(tileset);
          var surface = Cesium.Cartesian3.fromDegrees(121.5009, 31.2075, -5.7); //-5.7
          var mat = Cesium.Transforms.eastNorthUpToFixedFrame(surface);
          var rotationZ = Cesium.Matrix4.fromRotationTranslation(
            Cesium.Matrix3.fromRotationZ(Cesium.Math.toRadians(-22.33))
          );
          Cesium.Matrix4.multiply(mat, rotationZ, mat);
          tileset._root.transform = mat;
        })
      // http://180.167.213.122:18000/model/nanpudaqiao/
      let water;
      Cesium.GeoJsonDataSource.load(
        "http://172.20.16.213:8888/geojson/huangpujiang.json"
      ).then(source => {
        let entities = source.entities.values;
        for (let i = 0; i < entities.length; i++) {
          const entity = entities[i];
          let polygonHierarchy = entity.polygon.hierarchy._value;
          console.log(polygonHierarchy);
          let polygon = new Cesium.PolygonGeometry({
            polygonHierarchy: polygonHierarchy,
            height: 10,
            vertexFormat: Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT
          });

          water = new Cesium.WaterReflect({
            geometry: polygon,
            scene: scene,
            materialsOptions: {
              reflector: true,
              baseWaterColor: new Cesium.Color(0.0, 0.75, 0.77, 1), //水的颜色
              frequency: 1000, // 控制波数的数字
              animationSpeed: 0.005, // 水流速度
              amplitude: 35, //控制水波振幅的数字
              distortionScale: 8
            }
          });
        }
      });

      var height = -10;
      var position = Cesium.Cartesian3.fromDegrees(
        121.48960149965716,
        31.2428359062178,
        height
      );

      var entity = viewer.entities.add({
        position: position,
        orientation: Cesium.Transforms.headingPitchRollQuaternion(
          position,
          new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(120), 0, 0)
        ),
        model: {
          uri: "/static/examples/sampleData/models/a.glb",
          scale: 0.001
        }
      });
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          121.48960149965716,
          31.2378359062178,
          height
        ),
        orientation: Cesium.Transforms.headingPitchRollQuaternion(
          position,
          new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(70), 0, 0)
        ),
        model: {
          uri: "/static/examples/sampleData/models/b.glb",
          scale: 1
        }
      });
      var viewModel = {
        reflector: true,
        x: 0.0,
        y: 0.75,
        z: 0.77,
        alpha: 1,
        frequency: 1000.0,
        animationSpeed: 0.005, // 水流速度
        amplitude: 35,
        distortionScale: 8
      };
      Cesium.knockout.track(viewModel);
      var toolbar = document.getElementById("toolbar");
      Cesium.knockout.applyBindings(viewModel, toolbar);
      Cesium.knockout.getObservable(viewModel, "x").subscribe(function(_z) {
        updatechange();
      });
      Cesium.knockout.getObservable(viewModel, "y").subscribe(function(_z) {
        updatechange();
      });
      Cesium.knockout.getObservable(viewModel, "z").subscribe(function(_z) {
        updatechange();
      });
      Cesium.knockout.getObservable(viewModel, "alpha").subscribe(function(_z) {
        updatechange();
      });

      Cesium.knockout
        .getObservable(viewModel, "frequency")
        .subscribe(function(_z) {
          water._primitive.appearance.material.uniforms.frequency =
            viewModel.frequency;
        });
      Cesium.knockout
        .getObservable(viewModel, "amplitude")
        .subscribe(function(_z) {
          water._primitive.appearance.material.uniforms.amplitude =
            viewModel.amplitude;
        });

      function updatechange() {
        water._primitive.appearance.material.uniforms.baseWaterColor = new Cesium.Color(
          viewModel.x,
          viewModel.y,
          viewModel.z,
          viewModel.alpha
        );
      }
      Sandcastle.addToolbarButton("倒影", function() {
        // viewer.scene._context.msaaEnable = true;
        water._primitive.appearance.material.uniforms.reflector = !water
          ._primitive.appearance.material.uniforms.reflector;
      });
      Sandcastle.addToolbarButton("msaa", function() {
        // viewer.scene._context.msaaEnable = !viewer.scene._context.msaaEnable;
        viewer.scene._useMSAA = !viewer.scene._useMSAA;
      });
    </script>
  </body>
</html>
