<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>火焰粒子</title>
  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative
    }

    #toolbar {
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      z-index: 8;
    }

    #toolbar input {
      vertical-align: middle;
      padding-top: 2px;
      padding-bottom: 2px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
    <div id="toolbar">
      <table>
        <tbody>
          <tr>
            <td>粒子密度</td>
            <td>
              <input type="range" min="0.0" max="100.0" step="1" data-bind="value: emissionRate, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: emissionRate">
            </td>
          </tr>

          <tr>
            <td>粒子大小</td>
            <td>
              <input type="range" min="2" max="60.0" step="1" data-bind="value: particleSize, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: particleSize">
            </td>
          </tr>

          <tr>
            <td>最小生命周期</td>
            <td>
              <input type="range" min="0.1" max="30.0" step="1"
                data-bind="value: minimumParticleLife, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: minimumParticleLife">
            </td>
          </tr>

          <tr>
            <td>最大生命周期</td>
            <td>
              <input type="range" min="0.1" max="30.0" step="1"
                data-bind="value: maximumParticleLife, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: maximumParticleLife">
            </td>
          </tr>

          <tr>
            <td>最小速度</td>
            <td>
              <input type="range" min="0.0" max="30.0" step="1" data-bind="value: minimumSpeed, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: minimumSpeed">
            </td>
          </tr>

          <tr>
            <td>最大速度</td>
            <td>
              <input type="range" min="0.0" max="30.0" step="1" data-bind="value: maximumSpeed, valueUpdate: 'input'">
              <input type="text" size="5" data-bind="value: maximumSpeed">
            </td>
          </tr>
    </div>
    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        navigation: false,
        shouldAnimate: true,
        imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
        })
      })
      // 加载飞机模型
      var entity = viewer.entities.add({
        model: {
          uri: 'static/examples/sampleData/models/Cesium_Air.glb',
          minimumPixelSize: 64
        },
        position: Cesium.Cartesian3.fromDegrees(104.063245, 30.6628335, 200.0)
      });
      
      viewer.camera.setView({
        destination: {
          x: -1334378.4133470405, y: 5326842.898674873, z: 3233859.8677836377
        },
        orientation: {
            heading : 6.241154409820325, 
            pitch : -0.7553926008863594,    
            roll : 0.000015066316128020674                       
          }
      })
      function computeModelMatrix(entity, time) {
        var position = Cesium.Property.getValueOrUndefined(entity.position, time, new Cesium.Cartesian3());
        if (!Cesium.defined(position)) {
          return undefined;
        }
        var orientation = Cesium.Property.getValueOrUndefined(entity.orientation, time, new Cesium.Quaternion());
        if (!Cesium.defined(orientation)) {
          var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(position);
        } else {
          modelMatrix = Cesium.Matrix4.fromRotationTranslation(Cesium.Matrix3.fromQuaternion(orientation, new Cesium
            .Matrix3()), position, new Cesium.Matrix4());
        }
        return modelMatrix;
      }

      function computeEmitterModelMatrix() {
        var hpr = Cesium.HeadingPitchRoll.fromDegrees(1.0, 1.0, 1.0, new Cesium.HeadingPitchRoll());
        var trs = new Cesium.TranslationRotationScale();
        trs.translation = Cesium.Cartesian3.fromElements(2.5, 4.0, 1.0, new Cesium.Cartesian3());
        trs.rotation = Cesium.Quaternion.fromHeadingPitchRoll(hpr, new Cesium.Quaternion());
        return Cesium.Matrix4.fromTranslationRotationScale(trs, new Cesium.Matrix4());
      }

      const viewModel = {
        emissionRate: 10.0,
        minimumSpeed: 1.0,
        maximumSpeed: 4.0,
        particleSize: 25.0,
        minimumParticleLife: 1.2,
        maximumParticleLife: 1.2,
      };
      Cesium.knockout.track(viewModel);
      const toolbar = document.getElementById("toolbar");
      Cesium.knockout.applyBindings(viewModel, toolbar);

      var particleSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
        image: 'static/examples/sampleData/image/fire.png',
        scale: viewModel.scale,
        minimumParticleLife: viewModel.minimumParticleLife,
        maximumParticleLife: viewModel.maximumParticleLife,
        minimumSpeed: viewModel.minimumSpeed,
        maximumSpeed: viewModel.maximumSpeed,
        imageSize: new Cesium.Cartesian2(
          viewModel.particleSize,
          viewModel.particleSize
        ),
        emissionRate: viewModel.emissionRate,
        lifetime: 16.0,
        modelMatrix: computeModelMatrix(entity, Cesium.JulianDate.now()),
        emitterModelMatrix: computeEmitterModelMatrix()
      }));

      Cesium.knockout
        .getObservable(viewModel, "emissionRate")
        .subscribe(function (newValue) {
          particleSystem.emissionRate = parseFloat(newValue);
        });

      Cesium.knockout
        .getObservable(viewModel, "particleSize")
        .subscribe(function (newValue) {
          const particleSize = parseFloat(newValue);
          particleSystem.minimumImageSize.x = particleSize;
          particleSystem.minimumImageSize.y = particleSize;
          particleSystem.maximumImageSize.x = particleSize;
          particleSystem.maximumImageSize.y = particleSize;
        });

        Cesium.knockout
          .getObservable(viewModel, "minimumParticleLife")
          .subscribe(function (newValue) {
            particleSystem.minimumParticleLife = parseFloat(newValue);
          });

        Cesium.knockout
          .getObservable(viewModel, "maximumParticleLife")
          .subscribe(function (newValue) {
            particleSystem.maximumParticleLife = parseFloat(newValue);
          });

        Cesium.knockout
          .getObservable(viewModel, "minimumSpeed")
          .subscribe(function (newValue) {
            particleSystem.minimumSpeed = parseFloat(newValue);
          });

        Cesium.knockout
          .getObservable(viewModel, "maximumSpeed")
          .subscribe(function (newValue) {
            particleSystem.maximumSpeed = parseFloat(newValue);
          });

    </script>
</body>

</html>
