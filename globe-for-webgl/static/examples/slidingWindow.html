<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>卷帘对比</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #slider {
      position: absolute;
      left: 50%;
      top: 0px;
      background-color: #d3d3d3;
      width: 5px;
      height: 100%;
      z-index: 9999;
    }

    #slider:hover {
      cursor: ew-resize;
    }

    #toolbar {
      right: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
    <div id="slider"></div>
  </div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
       //ARCGIS蓝色底图
       url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    })
    //初始定位位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 1000.0), //四川省政府
    })


    var layers = viewer.imageryLayers;
    var earthAtNight = layers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({ url: `https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}`})
    );
    earthAtNight.splitDirection = Cesium.ImagerySplitDirection.LEFT; // Only show to the left of the slider.

    // Sync the position of the slider with the split position
    var slider = document.getElementById("slider");
    viewer.scene.splitPosition =
      slider.offsetLeft / slider.parentElement.offsetWidth;

    var handler = new Cesium.ScreenSpaceEventHandler(slider);

    var moveActive = false;

    function move(movement) {
      if (!moveActive) {
        return;
      }

      var relativeOffset = movement.endPosition.x;
      var splitPosition =
        (slider.offsetLeft + relativeOffset) /
        slider.parentElement.offsetWidth;
      slider.style.left = 100.0 * splitPosition + "%";
      viewer.scene.splitPosition = splitPosition;
    }

    handler.setInputAction(function () {
      moveActive = true;
    }, Cesium.ScreenSpaceEventType.LEFT_DOWN);
    handler.setInputAction(function () {
      moveActive = true;
    }, Cesium.ScreenSpaceEventType.PINCH_START);

    handler.setInputAction(move, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
    handler.setInputAction(move, Cesium.ScreenSpaceEventType.PINCH_MOVE);

    handler.setInputAction(function () {
      moveActive = false;
    }, Cesium.ScreenSpaceEventType.LEFT_UP);
    handler.setInputAction(function () {
      moveActive = false;
    }, Cesium.ScreenSpaceEventType.PINCH_END);


    //开启卷帘对比
    function addSlider(){
        earthAtNight.show = true
        document.getElementById('slider').style.display = 'block'
    }
    //关闭卷帘对比
    function removeSlider(){
        earthAtNight.show = false
        document.getElementById('slider').style.display = 'none'
    }

    Sandcastle.addToolbarButton("开启对比", function () {
        addSlider()
    })
    Sandcastle.addToolbarButton("关闭对比", function () {
      removeSlider()
    })
  </script>
</body>

</html>
