<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>二三维视图切换</title>

  <script src="/static/examples/Sandcastle-header.js"></script>
  <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
  <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/static/examples/bucket.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar"></div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      })
    })

    //初始地球色调
    var layer = viewer.imageryLayers.get(0)
    layer.saturation = 0
    layer.hue = 0.56
    layer.contrast = 1.74
    layer.brightness = 1.1

    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000000.0), //四川省政府
    })

    function viewSwitch() {
        if(viewer.scene.mode === 3){
            viewer.scene.mode = 2
        }
        else if(viewer.scene.mode === 2){
            viewer.scene.mode = 3
        }
    }
    Sandcastle.addToolbarButton("视图切换", function () {
      viewSwitch()
    })
  </script>
</body>

</html>
