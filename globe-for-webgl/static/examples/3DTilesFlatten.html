<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>倾斜摄影开挖</title>

    <script src="/static/examples/Sandcastle-header.js"></script>
    <script src="/static/Build/Cesium/Cesium.js"></script>
<script src="/static/defaultAccessToken.js"> </script>
    <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/static/examples/bucket.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #toolbar {
        left: 5px;
        top: 5px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    <div id="toolbar">
      <div>Flatten Height</div>
      <input type="range" style="width: 300px" min="1" max="1000" step="0.1" data-bind="value: height, valueUpdate: 'input'">
    </div>
    <script type="text/javascript">
      "use script";

      const viewer = new Cesium.Viewer("cesiumContainer", {
        terrainProvider: Cesium.createWorldTerrain(),
        contextOptions: {
            requestWebgl2: true
        }
      });

      const tileset = new Cesium.Cesium3DTileset({
        url: Cesium.IonResource.fromAssetId(75343),
      });

       tileset.readyPromise
        .then(function (tileset) {
          viewer.scene.primitives.add(tileset);
          viewer.zoomTo(
            tileset,
            new Cesium.HeadingPitchRange(
              0.0,
              -0.5,
              tileset.boundingSphere.radius * 2.0
            )
          );
        })

      viewer.scene.globe.depthTestAgainstTerrain = true;

      var drawPolygon = new Cesium.DrawHandler(
        viewer,
        Cesium.DrawMode.POLYGON
      );

      function deActivateAll() {
        drawPolygon.deactivate();
      }

      function clearAll() {
        drawPolygon.clear();
      }

      Sandcastle.addToolbarButton(
        "绘制开挖范围，左键开始，右键结束绘制",
        function () {
          deActivateAll();
          drawPolygon.activate();
          drawPolygon &&
            drawPolygon.addDrawCompleteEventListener((result) => {
      drawPolygon.clear();
      result.shift();
      var points = result;
      console.log(result);
      tileset.flatten = true;//是否进行压平。值为true时执行压平
      tileset.flattenHeight = 0;//将高度压到0
      tileset.flattenPositions = result;
      //场景渲染（渲染最新的压平效果）
      viewer.scene.requestRender();
            })
        }
      ); 


      var viewModel = {
        height: 0,
      };
      Cesium.knockout.track(viewModel);
      var toolbar = document.getElementById("toolbar");
      Cesium.knockout.applyBindings(viewModel, toolbar);
      Cesium.knockout
        .getObservable(viewModel, "height")
        .subscribe(function (height) {
          tileset.flattenHeight = height;//将高度压到0
        }); 
    </script>
  </body>
</html>
