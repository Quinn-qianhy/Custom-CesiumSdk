<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>水面倒影</title>

    <script src="/static/examples/Sandcastle-header.js"></script>
    <script src="/static/Build/Cesium/Cesium.js"></script>
    <script src="/static/defaultAccessToken.js"></script>
    <link href="/static/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/static/examples/bucket.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #toolbar {
        left: 5px;
        top: 5px;
        background: rgba(42, 42, 42, 0.8);
        padding: 4px;
        border-radius: 4px;
      }

      #toolbar input {
        vertical-align: middle;
        padding-top: 2px;
        padding-bottom: 2px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    <div id="toolbar">
      <div>frequency 频率</div>
      <input
        type="range"
        style="width:300px"
        min="10"
        max="100000"
        step="10"
        data-bind="value: frequency, valueUpdate: 'input'"
      />
      <input type="number" size="5" data-bind="value: frequency" step="10" />
      <div>amplitude 振幅</div>
      <input
        type="range"
        style="width:300px"
        min="5"
        max="200"
        step="10"
        data-bind="value: amplitude, valueUpdate: 'input'"
      />
      <input type="number" size="5" data-bind="value: amplitude" step="10" />
      <div>animationSpeed 水流速度</div>
      <input
        type="range"
        style="width:300px"
        min="-10"
        max="10"
        step="0.00001"
        data-bind="value: animationSpeed, valueUpdate: 'input'"
      />
      <input
        type="number"
        size="8"
        data-bind="value: animationSpeed"
        step="00001"
      />
      <div>R</div>
      <input
        type="range"
        style="width:300px"
        min="0"
        max="1"
        step="0.01"
        data-bind="value: x, valueUpdate: 'input'"
      />
      <input type="number" size="5" data-bind="value: x" step="0.1" />
      <div>G</div>
      <input
        type="range"
        style="width:300px"
        min="0"
        max="1"
        step="0.01"
        data-bind="value: y, valueUpdate: 'input'"
      />
      <input type="number" size="5" data-bind="value: y" step="0.1" />
      <div>B</div>
      <input
        type="range"
        style="width:300px"
        min="0"
        max="1"
        step="0.01"
        data-bind="value: z, valueUpdate: 'input'"
      />
      <input type="number" size="5" data-bind="value: z" step="0.01" />
      <div>alpha 透明度</div>
      <input
        type="range"
        style="width:300px"
        min="0"
        max="1"
        step="0.1"
        data-bind="value: alpha, valueUpdate: 'input'"
      />
      <input type="number" size="5" data-bind="value: alpha" step="0.1" />
    </div>

            cartographic.latitude,

            new Cesium.Cartesian3()
          );

              tileset.boundingSphere.radius * 2.0
