<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>天气粒子特效</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      shouldAnimate: true
    });

    var tileset = new Cesium.Cesium3DTileset({
      url: Cesium.IonResource.fromAssetId(40866),
    });

    viewer.scene.primitives.add(tileset);
    //初始定位位置
    viewer.camera.setView({
      destination: new Cesium.Cartesian3(
        1216356.033078094,
        -4736402.278325668,
        4081270.375520902
      ),
      orientation: new Cesium.HeadingPitchRoll(
        0.08033365594766728,
        -0.29519015695063455,
        0.00027759141518046704
      ),
      endTransform: Cesium.Matrix4.IDENTITY,
    })
    var snowSystem;
    var rainSystem;
    //Rain
    function rain() {
      var rainParticleSize = 15.0;
      var rainRadius = 100000.0;
      var rainImageSize = new Cesium.Cartesian2(
        rainParticleSize,
        rainParticleSize * 2.0
      );
      var rainGravityScratch = new Cesium.Cartesian3();
      var rainUpdate = function(particle, dt) {
        rainGravityScratch = Cesium.Cartesian3.normalize(
          particle.position,
          rainGravityScratch
        );
        rainGravityScratch = Cesium.Cartesian3.multiplyByScalar(
          rainGravityScratch,
          -1050.0,
          rainGravityScratch
        );

        particle.position = Cesium.Cartesian3.add(
          particle.position,
          rainGravityScratch,
          particle.position
        );

        var distance = Cesium.Cartesian3.distance(
          viewer.scene.camera.position,
          particle.position
        );
        if (distance > rainRadius) {
          particle.endColor.alpha = 0.0;
        } else {
          particle.endColor.alpha =
            rainSystem.endColor.alpha / (distance / rainRadius + 0.1);
        }
      };

      rainSystem = new Cesium.ParticleSystem({
        modelMatrix: new Cesium.Matrix4.fromTranslation(
          viewer.scene.camera.position
        ),
        speed: -1.0,
        lifetime: 15.0,
        emitter: new Cesium.SphereEmitter(rainRadius),
        startScale: 1.0,
        endScale: 0.0,
        image: "/examples/cesium/assets/sampleData/image/circular_particle.png",
        emissionRate: 9000.0,
        startColor: new Cesium.Color(0.27, 0.5, 0.7, 0.0),
        endColor: new Cesium.Color(0.27, 0.5, 0.7, 0.98),
        imageSize: rainImageSize,
        updateCallback: rainUpdate,
      });
    }
    //Snow
    function snow() {
      var snowParticleSize = 12.0;
      var snowRadius = 100000.0;
      var minimumSnowImageSize = new Cesium.Cartesian2(
        snowParticleSize,
        snowParticleSize
      );
      var maximumSnowImageSize = new Cesium.Cartesian2(
        snowParticleSize * 2.0,
        snowParticleSize * 2.0
      );
      var snowGravityScratch = new Cesium.Cartesian3();
      var snowUpdate = function(particle, dt) {
        snowGravityScratch = Cesium.Cartesian3.normalize(
          particle.position,
          snowGravityScratch
        );
        Cesium.Cartesian3.multiplyByScalar(
          snowGravityScratch,
          Cesium.Math.randomBetween(-30.0, -300.0),
          snowGravityScratch
        );
        particle.velocity = Cesium.Cartesian3.add(
          particle.velocity,
          snowGravityScratch,
          particle.velocity
        );

        var distance = Cesium.Cartesian3.distance(
          viewer.scene.camera.position,
          particle.position
        );
        if (distance > snowRadius) {
          particle.endColor.alpha = 0.0;
        } else {
          particle.endColor.alpha =
            snowSystem.endColor.alpha / (distance / snowRadius + 0.1);
        }
      };
      snowSystem = new Cesium.ParticleSystem({
        modelMatrix: new Cesium.Matrix4.fromTranslation(
          viewer.scene.camera.position
        ),
        minimumSpeed: -1.0,
        maximumSpeed: 0.0,
        lifetime: 15.0,
        emitter: new Cesium.SphereEmitter(snowRadius),
        startScale: 0.5,
        endScale: 1.0,
        image:'/examples/cesium/assets/sampleData/image/snowflake_particle.png' ,
        emissionRate: 7000.0,
        startColor: Cesium.Color.WHITE.withAlpha(0.0),
        endColor: Cesium.Color.WHITE.withAlpha(1.0),
        minimumImageSize: minimumSnowImageSize,
        maximumImageSize: maximumSnowImageSize,
        updateCallback: snowUpdate,
      });
    }
    function removeStages() {
      var collection = viewer.scene.postProcessStages;
      var primitives = viewer.scene.primitives
      primitives.remove(snowSystem)
      primitives.remove(rainSystem)
      collection.removeAll()
    }
    var options = [{
        text: "场景-雾1",
        onselect: function() {
          var collection = viewer.scene.postProcessStages;
          var fog = Cesium.PostProcessStageLibrary.createFogStage()
          collection.add(fog)
        }},{
        text: "场景-雾2",
        onselect: function() {
          var fragmentShaderSource =
            "float getDistance(sampler2D depthTexture, vec2 texCoords) \n" +
            "{ \n" +
            "    float depth = czm_unpackDepth(texture2D(depthTexture, texCoords)); \n" +
            "    if (depth == 0.0) { \n" +
            "        return czm_infinity; \n" +
            "    } \n" +
            "    vec4 eyeCoordinate = czm_windowToEyeCoordinates(gl_FragCoord.xy, depth); \n" +
            "    return -eyeCoordinate.z / eyeCoordinate.w; \n" +
            "} \n" +
            "float interpolateByDistance(vec4 nearFarScalar, float distance) \n" +
            "{ \n" +
            "    float startDistance = nearFarScalar.x; \n" +
            "    float startValue = nearFarScalar.y; \n" +
            "    float endDistance = nearFarScalar.z; \n" +
            "    float endValue = nearFarScalar.w; \n" +
            "    float t = clamp((distance - startDistance) / (endDistance - startDistance), 0.0, 1.0); \n" +
            "    return mix(startValue, endValue, t); \n" +
            "} \n" +
            "vec4 alphaBlend(vec4 sourceColor, vec4 destinationColor) \n" +
            "{ \n" +
            "    return sourceColor * vec4(sourceColor.aaa, 1.0) + destinationColor * (1.0 - sourceColor.a); \n" +
            "} \n" +
            "uniform sampler2D colorTexture; \n" +
            "uniform sampler2D depthTexture; \n" +
            "uniform vec4 fogByDistance; \n" +
            "uniform vec4 fogColor; \n" +
            "varying vec2 v_textureCoordinates; \n" +
            "void main(void) \n" +
            "{ \n" +
            "    float distance = getDistance(depthTexture, v_textureCoordinates); \n" +
            "    vec4 sceneColor = texture2D(colorTexture, v_textureCoordinates); \n" +
            "    float blendAmount = interpolateByDistance(fogByDistance, distance); \n" +
            "    vec4 finalFogColor = vec4(fogColor.rgb, fogColor.a * blendAmount); \n" +
            "    gl_FragColor = alphaBlend(finalFogColor, sceneColor); \n" +
            "} \n";

          var ellipsoid = viewer.scene.globe.ellipsoid;
          var postProcessStage = viewer.scene.postProcessStages.add(
            new Cesium.PostProcessStage({
              fragmentShader: fragmentShaderSource,
              uniforms: {
                fogByDistance: new Cesium.Cartesian4(10, 0.0, 200, 1.0),
                fogColor: Cesium.Color.WHITE,
              },
            })
          );
        },
      },];
    var options_rain = [{
        text: "场景-雨1",
        onselect: function() {
          rain()
          viewer.scene.primitives.add(rainSystem);
        }},{
        text: "场景-雨2",
        onselect: function() {
          var collection = viewer.scene.postProcessStages;
          var rain = Cesium.PostProcessStageLibrary.createRainStage()
          collection.add(rain)
        }}]
    var options_snow = [{
        text: "场景-雪1",
        onselect: function() {
          snow()
          viewer.scene.primitives.add(snowSystem);
        }},{
        text: "场景-雪2",
        onselect: function() {
          var collection = viewer.scene.postProcessStages;
          var snow = Cesium.PostProcessStageLibrary.createSnowStage()
          collection.add(snow)
        }}]
      ExampleGui.addToolbarMenu(options_snow);
      ExampleGui.addToolbarMenu(options_rain);
      ExampleGui.addToolbarMenu(options);
      ExampleGui.addToolbarButton("清除", function() {
        removeStages()
    })

  </script>
</body>

</html>
