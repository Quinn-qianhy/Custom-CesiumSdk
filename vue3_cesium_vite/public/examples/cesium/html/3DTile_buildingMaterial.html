<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>建筑白模材质特效</title>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    <div id="toolbar"></div>

    <script type="text/javascript">
      'use script'
      var viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
            Cesium.ArcGisBaseMapType.SATELLITE,
            {
              enablePickFeatures: false
            }
          )
        )
      })
      // viewer.scene.globe.show = false
      viewer.scene.globe.depthTestAgainstTerrain = false

      Cesium.Cesium3DTileset.fromIonAssetId(75343, {
        maximumScreenSpaceError: 4
      })
        .then(function (tileset) {
          viewer.scene.primitives.add(tileset)

          // 旧版 appearanceGradientByHeight 已移除，改用 3D Tiles 样式按建筑高度渐变着色
          tileset.style = new Cesium.Cesium3DTileStyle({
            color: {
              conditions: [
                ['${Height} >= 80', 'color("purple", 0.85)'],
                ['${Height} >= 60', 'color("blue", 0.85)'],
                ['${Height} >= 40', 'color("cyan", 0.85)'],
                ['${Height} >= 20', 'color("aqua", 0.85)'],
                ['true', 'color("lightcyan", 0.8)']
              ]
            }
          })

          return viewer.zoomTo(
            tileset,
            new Cesium.HeadingPitchRange(0.0, -0.5, tileset.boundingSphere.radius * 2.0)
          )
        })
        .catch(function (error) {
          console.error('Failed to load building tileset:', error)
        })
    </script>
  </body>
</html>
