<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>倾斜摄影模型单体化(分栋)</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/shared/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: new Cesium.Terrain(Cesium.CesiumTerrainProvider.fromIonAssetId(1))
    })




    //初始定位位置
    viewer.camera.setView({
      destination: new Cesium.Cartesian3(
        1216356.033078094,
        -4736402.278325668,
        4081270.375520902
      ),
      orientation: new Cesium.HeadingPitchRoll(
        0.08033365594766728,
        -0.29519015695063455,
        0.00027759141518046704
      ),
      endTransform: Cesium.Matrix4.IDENTITY,
    })



    var scene = viewer.scene;
    var camera = scene.camera;

    var center = new Cesium.Cartesian3(1216389.3637977627, -4736323.641980423, 4081321.7428341154);
    var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(center);
    var hprRotation = Cesium.Matrix3.fromHeadingPitchRoll(new Cesium.HeadingPitchRoll(2.619728786416368, 0.0, 0.0));
    var hpr = Cesium.Matrix4.fromRotationTranslation(hprRotation, new Cesium.Cartesian3(-8, 15.5, 5.0));
    Cesium.Matrix4.multiply(modelMatrix, hpr, modelMatrix);

    var buildingHighlight = scene.primitives.add(new Cesium.ClassificationPrimitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: Cesium.BoxGeometry.fromDimensions({
          vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
          dimensions: new Cesium.Cartesian3(70.0, 36.5, 40.0)
        }),
        modelMatrix: modelMatrix,
        attributes: {
          color: Cesium.ColorGeometryInstanceAttribute.fromColor(new Cesium.Color(0.0, 0.0, 0.0, 0.5)),
          show: new Cesium.ShowGeometryInstanceAttribute(true)
        },
        id: 'volume'
      }),
      classificationType: Cesium.ClassificationType.CESIUM_3D_TILE
    }));


    var center = new Cesium.Cartesian3(1216303.4975655659, -4736325.156402523, 4081345.200025963);
    var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(center);
    var hprRotation = Cesium.Matrix3.fromHeadingPitchRoll(new Cesium.HeadingPitchRoll(-2.0958728786416368, 0, 0.0));
    var hpr = Cesium.Matrix4.fromRotationTranslation(hprRotation, new Cesium.Cartesian3(0, -1, 0));
    Cesium.Matrix4.multiply(modelMatrix, hpr, modelMatrix);
    
    var buildingHighlight2 = scene.primitives.add(new Cesium.ClassificationPrimitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: Cesium.BoxGeometry.fromDimensions({
          vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
          dimensions: new Cesium.Cartesian3(77.0, 38, 40.0)
        }),
        modelMatrix: modelMatrix,
        attributes: {
          color: Cesium.ColorGeometryInstanceAttribute.fromColor(new Cesium.Color(0.0, 0.0, 0.0, 0.5)),
          show: new Cesium.ShowGeometryInstanceAttribute(true)
        },
        id: 'volume1'
      }),
      classificationType: Cesium.ClassificationType.CESIUM_3D_TILE
    }));

    var center = new Cesium.Cartesian3(1216319.2769502294, -4736277.134218418, 4081402.2076128772);
    var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(center);
    var hprRotation = Cesium.Matrix3.fromHeadingPitchRoll(new Cesium.HeadingPitchRoll(2.619728786416368, 0.0, 0.0)); 
    var hpr = Cesium.Matrix4.fromRotationTranslation(hprRotation, new Cesium.Cartesian3(0, -1, -2));
    Cesium.Matrix4.multiply(modelMatrix, hpr, modelMatrix);
    
    var buildingHighlight3 = scene.primitives.add(new Cesium.ClassificationPrimitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: Cesium.BoxGeometry.fromDimensions({
          vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
          dimensions: new Cesium.Cartesian3(70.0, 36.5, 40.0)
        }),
        modelMatrix: modelMatrix,
        attributes: {
          color: Cesium.ColorGeometryInstanceAttribute.fromColor(new Cesium.Color(0.0, 0.0, 0.0, 0.5)),
          show: new Cesium.ShowGeometryInstanceAttribute(true)
        },
        id: 'volume2'
      }),
      classificationType: Cesium.ClassificationType.CESIUM_3D_TILE
    }));
    
    var tileset = new Cesium.Cesium3DTileset({
      url: Cesium.IonResource.fromAssetId(6074)
    });
    scene.primitives.add(tileset);

    var currentObjectId;
    var currentPrimitive;
    var currentColor;
    var currentShow;
    var attributes;

    var handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
    handler.setInputAction(function (movement) {
      var pickedObject = scene.pick(movement.endPosition);
      if (Cesium.defined(pickedObject) && Cesium.defined(pickedObject.id)) {
        if (pickedObject.id === currentObjectId) {
          return;
        }
        if (Cesium.defined(currentObjectId)) {
          attributes = currentPrimitive.getGeometryInstanceAttributes(currentObjectId);
          attributes.color = currentColor;
          attributes.show = currentShow;
          currentObjectId = undefined;
          currentPrimitive = undefined;
          currentColor = undefined;
          currentShow = undefined;
        }
      }

      if (Cesium.defined(pickedObject) && Cesium.defined(pickedObject.primitive) && Cesium.defined(pickedObject
          .id) && Cesium.defined(pickedObject.primitive.getGeometryInstanceAttributes)) {
        currentObjectId = pickedObject.id;
        currentPrimitive = pickedObject.primitive;
        attributes = currentPrimitive.getGeometryInstanceAttributes(currentObjectId);
        currentColor = attributes.color;
        currentShow = attributes.show;
        if (!scene.invertClassification) {
          attributes.color = [255, 0, 0, 128];
        }
        attributes.show = [1];
      } else if (Cesium.defined(currentObjectId)) {
        attributes = currentPrimitive.getGeometryInstanceAttributes(currentObjectId);
        attributes.color = currentColor;
        attributes.show = currentShow;
        currentObjectId = undefined;
        currentPrimitive = undefined;
        currentColor = undefined;
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

  </script>
</body>

</html>
