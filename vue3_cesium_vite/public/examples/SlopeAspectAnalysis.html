<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>坡度坡向分析</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/examples/pluginJs/SlopeArraw.js"></script>
  <script src="/examples/pluginJs/turf.min.js"></script>
  <script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
.demo-container {
      background-color: #303336;
      border-radius: 5px;
      padding: 5px;
      margin: 5px 3px;
      display: flex;
    }

    .demo-container input,p {
      vertical-align: middle;
      margin-top: 0;
      margin-bottom: 0;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
</div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      terrainProvider: new Cesium.CesiumTerrainProvider({
        url: "http://172.20.16.213:8888/cesiumLocal_dem",
        requestMetadata: true,
        requestWaterMask: true,
        requestVertexNormals: true
      })
    });
    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.depthTestAgainstTerrain = true

    viewer.scene.globe.imageryLayers.get(0).alpha = 0.0;
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#006400')

    function getSlopeContourMaterial() {
      return new Cesium.Material({
        fabric: {
          type: "SlopeColorContour",
          materials: {
            contourMaterial: {
              type: "ElevationContour",
            },
            slopeRampMaterial: {
              type: "SlopeRamp",
            },
          },
          components: {
            diffuse: "contourMaterial.alpha == 0.0 ? slopeRampMaterial.diffuse : contourMaterial.diffuse",
            alpha: "max(contourMaterial.alpha, slopeRampMaterial.alpha)",
          },
        },
        translucent: false,
      });
    }

    function getAspectContourMaterial() {
      // Creates a composite material with both aspect shading and contour lines
      return new Cesium.Material({
        fabric: {
          type: "AspectColorContour",
          materials: {
            contourMaterial: {
              type: "ElevationContour",
            },
            aspectRampMaterial: {
              type: "AspectRamp",
            },
          },
          components: {
            diffuse: "contourMaterial.alpha == 0.0 ? aspectRampMaterial.diffuse : contourMaterial.diffuse",
            alpha: "max(contourMaterial.alpha, aspectRampMaterial.alpha)",
          },
        },
        translucent: false,
      });
    }

    var slopeRamp = [0.0, 0.29, 0.5, Math.sqrt(2) / 2, 0.87, 0.91, 1.0];
    var aspectRamp = [0.0, 0.2, 0.4, 0.6, 0.8, 0.9, 1.0];

    function getColorRamp(selectedShading) {
      var ramp = document.createElement("canvas");
      ramp.width = 100;
      ramp.height = 1;
      var ctx = ramp.getContext("2d");
      var values;
      if (selectedShading === "slope") {
        values = slopeRamp;
      } else if (selectedShading === "aspect") {
        values = aspectRamp;
      }
      var grd = ctx.createLinearGradient(0, 0, 100, 0);
      grd.addColorStop(values[0], "#000000"); //black
      grd.addColorStop(values[1], "#2747E0"); //blue
      grd.addColorStop(values[2], "#D33B7D"); //pink
      grd.addColorStop(values[3], "#D33038"); //red
      grd.addColorStop(values[4], "#FF9742"); //orange
      grd.addColorStop(values[5], "#ffd700"); //yellow
      grd.addColorStop(values[6], "#ffffff"); //white
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 100, 1);
      return ramp;
    }

    var shadingUniforms = {}
    var viewModel = {
      selectedShading: "slope",
    };
    Cesium.knockout.track(viewModel);
    // ExampleGui 参数面板
    ExampleGui.addMenu([
      { text: '坡度', onselect: function() { viewModel.selectedShading = 'slope'; updateMaterial(); } },
      { text: '坡向', onselect: function() { viewModel.selectedShading = 'aspect'; updateMaterial(); } },
    ]);
    ExampleGui.finishedLoading();
function updateMaterial() {
      var selectedShading = viewModel.selectedShading;
      var globe = viewer.scene.globe;
      var material;
      if (selectedShading === "slope") {
        material = Cesium.Material.fromType("SlopeRamp");
        shadingUniforms = material.uniforms;
      } else if (selectedShading === "aspect") {
        material = Cesium.Material.fromType("AspectRamp");
        shadingUniforms = material.uniforms;
      }
      if (selectedShading !== "none") {
        shadingUniforms.image = getColorRamp(selectedShading);
      }
      globe.material = material;
    }
    updateMaterial()
    Cesium.knockout
      .getObservable(viewModel, "selectedShading")
      .subscribe(function (value) {
        updateMaterial();
      });

    viewer.camera.setView({
      destination: new Cesium.Cartesian3(
        -893394.8307748075,
        5385012.275141644,
        3308602.2824783525
      ),
      orientation: {
        heading: 5.144604009615115,
        pitch: -0.3472863360774794,
        roll: 6.28030428824255,
      },
    });

    //开启绘制多边形
    var drawPolygon = new Cesium.DrawHandler(viewer, Cesium.DrawMode.POLYGON);

    function deActivateAll() {
      drawPolygon.deactivate();
    }

    function clear() {
      drawPolygon.clear()
      viewer.entities.removeAll()
      deActivateAll()
    }

    function drawpolygon() {
      deActivateAll();
      drawPolygon.activate();
      drawPolygon.addDrawCompleteEventListener(result => {
        const points = []
        drawPolygon.clear();
        result.shift();
        //在最后的位置添加第一个坐标，形成闭环
        result.push(result[0])
        result.forEach(item => {
          const point = []
          const cartograhphic = viewer.scene.globe.ellipsoid.cartesianToCartographic(item)
          const lon = Cesium.Math.toDegrees(cartograhphic.longitude)
          const lat = Cesium.Math.toDegrees(cartograhphic.latitude)
          point.push(lon, lat)
          points.push(point)
        });
        slopeArraw(points)
      })
    }

    ExampleGui.addToolbarButton("绘制多边形", function () {
      drawpolygon()
    })
    ExampleGui.addToolbarButton("清除", function () {
      clear()
    })

  </script>
</body>

</html>
