<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>双屏对比</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #leftMap {
      width: 100%;
      height: 100%;
      margin: 0;
      float: left;
    }

    #rightMap {
      width: 100%;
      height: 100%;
      margin: 0;
      float: right;
    }
</style>
</head>

<body class="dark">
  <div id="leftMap"></div>
  <div id="rightMap"></div>
<script type="text/javascript">
    "use script";
    var frames = window.parent.window.document.getElementById('page')
    frames.contentWindow.document.getElementById('leftMap').style.width = '50%'
    frames.contentWindow.document.getElementById('rightMap').style.width = '50%'


    var viewerL = new Cesium.Viewer("leftMap", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      }),
      navigation: false
    })

    var viewerR = new Cesium.Viewer("rightMap", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      }),
      navigation: false
    })


    var sceneL = viewerL.scene;
    var sceneR = viewerR.scene;
    var handlerL = new Cesium.ScreenSpaceEventHandler(sceneL.canvas);
    var ellipsoidL = sceneL.globe.ellipsoid;
    var handlerR = new Cesium.ScreenSpaceEventHandler(sceneR.canvas);
    var ellipsoidR = sceneR.globe.ellipsoid;
    handlerL.setInputAction(function (movement) {
      isLeftTrigger = true;
      isRightTrigger = false;
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE)
    handlerR.setInputAction(function (movement) {
      isLeftTrigger = false;
      isRightTrigger = true;
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    var isLeftTrigger = false;
    var isRightTrigger = false;

    var syncViewerL = function () {
      if (isLeftTrigger) {
        viewerR.camera.flyTo({
          destination: viewerL.camera.position,
          orientation: {
            heading: viewerL.camera.heading,
            pitch: viewerL.camera.pitch,
            roll: viewerL.camera.roll
          },
          duration: 0.0
        });
      }
    }
    var syncViewerR = function () {
      if (isRightTrigger) {
        viewerL.camera.flyTo({
          destination: viewerR.camera.position,
          orientation: {
            heading: viewerR.camera.heading,
            pitch: viewerR.camera.pitch,
            roll: viewerR.camera.roll
          },
          duration: 0.0
        });
      }
    }
    //开启联动
    function linkOpen() {
      viewerR.camera.changed.addEventListener(syncViewerL);
      viewerR.scene.preRender.addEventListener(syncViewerL);
      viewerL.camera.changed.addEventListener(syncViewerR);
      viewerL.scene.preRender.addEventListener(syncViewerR);
    }

    //关闭联动
    function closeOpen() {
      viewerL.camera.changed.removeEventListener(syncViewerR);
      viewerL.scene.preRender.removeEventListener(syncViewerR);
      viewerR.camera.changed.removeEventListener(syncViewerL);
      viewerR.scene.preRender.removeEventListener(syncViewerL);
    }


    //初始地球色调
    var layer = viewerL.imageryLayers.get(0)
    layer.saturation = 0
    layer.hue = 0.56
    layer.contrast = 1.74
    layer.brightness = 1.1


    ExampleGui.addToolbarButton("开启联动", function () {
      linkOpen()
    })
    ExampleGui.addToolbarButton("关闭联动", function () {
      closeOpen()
    })

  </script>
</body>

</html>
