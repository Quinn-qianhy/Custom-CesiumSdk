<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>夜视效果</title>
<script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer")
    viewer.scene.globe.baseColor = Cesium.Color.DARKOLIVEGREEN
    if (viewer.scene.imageryLayers.length > 0) {
      viewer.scene.imageryLayers.get(0).alpha = 0.35
    }
    //初始定位位置
    viewer.camera.flyTo({
      destination: {
        x: -1469200.109729519,
        y: 5184992.517968472,
        z: 3401307.075514329
      },
      orientation: {
        direction: {
          x: -0.1506058934247801,
          y: -0.8486043414325113,
          z: 0.5071375913572349
        },
        up: {
          x: -0.3126414843742682,
          y: 0.5275447698515602,
          z: 0.7899062083883874
        }
      },
      duration: 3
    })

    var tileset = viewer.scene.primitives.add(new Cesium.Cesium3DTileset({
      url: Cesium.IonResource.fromAssetId(75343),
    }));

    const viewModel = {
      nightVisionShow: false,
    };
    // ExampleGui 参数面板
    ExampleGui.addToggleButton('夜视效果', false, function(checked) {
      viewModel.nightVisionShow = checked;
      updatePostProcess();
    });
    ExampleGui.finishedLoading();
    const stages = viewer.scene.postProcessStages;
    const nightVision = stages.add(
      Cesium.PostProcessStageLibrary.createNightVisionStage()
    );

    function updatePostProcess() {
      nightVision.enabled = Boolean(viewModel.nightVisionShow);
    }
    updatePostProcess()

  </script>
</body>

</html>
