<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>绘制点线面</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
        html,body,#cesiumContainer{
            width: 100%;
            height: 100%;
            margin: 0;
        }
</style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
      "use script";

        var viewer = new Cesium.Viewer("cesiumContainer");
        viewer.scene.globe.depthTestAgainstTerrain = true

        var drawCircle = new Cesium.DrawHandler(viewer, Cesium.DrawMode.CIRCLE);
        var drawRectangle = new Cesium.DrawHandler(viewer, Cesium.DrawMode.RECTANGLE);
        var drawLine = new Cesium.DrawHandler(viewer, Cesium.DrawMode.LINE);
        var drawPolygon = new Cesium.DrawHandler(viewer, Cesium.DrawMode.POLYGON);
        var drawPolyline = new Cesium.DrawHandler(viewer, Cesium.DrawMode.POLYLINE);
        var drawPoint = new Cesium.DrawHandler(viewer, Cesium.DrawMode.POINT);

        function deActivateAll() {
        drawCircle.deactivate();
        drawRectangle.deactivate();
        drawPolygon.deactivate();
        drawPolyline.deactivate();
        drawPoint.deactivate();
        drawLine.deactivate();
        }

        function clearAll() {
        drawCircle.clear();
        drawRectangle.clear();
        drawPolygon.clear();
        drawPolyline.clear();
        drawPoint.clear();
        drawLine.clear();
        }

        ExampleGui.addToolbarButton("开始circle", function () {
            deActivateAll();
            drawCircle.activate();
        });
        ExampleGui.addToolbarButton("开始point", function () {
            deActivateAll();
            drawPoint.activate();
        });
        ExampleGui.addToolbarButton("开始rectangle", function () {
            deActivateAll();
            drawRectangle.activate();
        });

        ExampleGui.addToolbarButton("开始line", function () {
            deActivateAll();
            drawLine.activate();
        });
        ExampleGui.addToolbarButton("开始polygon", function () {
            deActivateAll();
            drawPolygon.activate();

        });
        ExampleGui.addToolbarButton("开始polyline", function () {
            deActivateAll();
            drawPolyline.activate();
        });
        ExampleGui.addToolbarButton("停止", function () {
            deActivateAll();
        });
        ExampleGui.addToolbarButton("清除", function () {
            clearAll();
        });
    </script>
  </body>
</html>
