<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>场景出图</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <script src="/examples/pluginJs/html2canvas.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        geocoder: false,
        sceneModeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
            Cesium.ArcGisBaseMapType.SATELLITE,
            {
              enablePickFeatures: false,
            },
          ),
        ), // 初始化使用 ArcGIS 卫星图
        contextOptions: {
          webgl: {
            alpha: true,
            depth: false,
            preserveDrawingBuffer: true,
            premultipliedAlpha: true,
            failIfMajorPerformanceCaveat: true,
          },
          allowTextureFilterAnisotropic: true,
        },
      });

      //初始地球色调
      var layer = viewer.imageryLayers.get(0);
      layer.saturation = 0;
      layer.hue = 0.56;
      layer.contrast = 1.74;
      layer.brightness = 1.1;

      //下载图片
      function download() {
        var image = new Image();
        const el = document.getElementById("cesiumContainer");
        html2canvas(el, {
          useCORS: true,
          allowTaint: true,
        }).then((canvas) => {
          image.src = canvas.toDataURL("image/png", 0.1); // base64
        });
        image.onload = function () {
          var a = document.createElement("a");
          var event = new MouseEvent("click");
          a.download = new Date().getTime() + ".png"; // 指定下载图片的名称
          a.href = image.src;
          a.dispatchEvent(event); // 触发超链接的点击事件
        };
      }

      ExampleGui.addToolbarButton("场景出图", function () {
        download();
      });
    </script>
  </body>
</html>
