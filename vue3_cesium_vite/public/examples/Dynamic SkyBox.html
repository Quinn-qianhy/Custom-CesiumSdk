<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>动态天空盒</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      timeline: true,
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url:
          "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",
        enablePickFeatures: false,
      }),
      contextOptions: {
        requestWebgl2: true,
      },
    });
    // viewer.scene.logarithmicDepthBuffer = false
    viewer.scene.globe.depthTestAgainstTerrain = true;
    var scene = viewer.scene;
    scene.skyAtmosphere.dynamic = true;
    scene.camera.setView({
      destination: new Cesium.Cartesian3(
        -2850427.424800401,
        4654587.183552037,
        3289972.194967335
      ),
      orientation: {
        direction: new Cesium.Cartesian3(
          -0.5880229759031641,
          -0.22046178263746055,
          -0.278219494876799
        ),
        up: new Cesium.Cartesian3(
          -0.6535959556934616,
          0.6963045356153443,
          0.3966012818290751
        ),
      },
    });
    ExampleGui.addToolbarButton("动态天空", function () {
      scene.skyAtmosphere.dynamic = !scene.skyAtmosphere.dynamic;
    });

  </script>
</body>

</html>
