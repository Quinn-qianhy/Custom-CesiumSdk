<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>Primitive大量点</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        scene3Donly: true,
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.UrlTemplateImageryProvider({
            url: "https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}",
          }),
        )
      });
      //定义 点 的属性
      var primitive = new Cesium.PointPrimitiveCollection();
      var points = viewer.scene.primitives.add(primitive);

      // 添加单个点
      function addPoint() {
        points.add({
          position: new Cesium.Cartesian3.fromDegrees(104.08, 30.65, 0),
          color: Cesium.Color.YELLOW,
          pixelSize: 10,
        });
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 10000.0),
        });
      }

      // 添加大量点
      function addPoints() {
        for (var longitude = 0; longitude < 90; longitude++) {
          var color = Cesium.Color.PINK;
          if (longitude % 2 === 0) {
            color = Cesium.Color.CYAN;
          }
          for (var latitude = 0; latitude < 90; latitude++) {
            points.add({
              position: Cesium.Cartesian3.fromDegrees(longitude, latitude, 20),
              color: color,
            });
          }
        }
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(54.08, 30.65, 20000000.0), //四川省政府
        });
      }

      ExampleGui.addToolbarButton("绘制单个点", function () {
        addPoint();
      });
      ExampleGui.addToolbarButton("绘制大量点", function () {
        addPoints();
      });
      ExampleGui.addToolbarButton("清除", function () {
        points.removeAll();
      });
    </script>
  </body>
</html>
