<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>geojson图层(POI数据)加载</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">

  </div>
  <script type="text/javascript">
    "use script";

    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
          //ARCGIS蓝色底图
          url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
        })
    });
    var stages = viewer.scene.postProcessStages;
    viewer.scene.brightness = viewer.scene.brightness || stages.add(Cesium.PostProcessStageLibrary
      .createBrightnessStage());
    viewer.scene.brightness.enabled = true;
    viewer.scene.brightness.uniforms.brightness = 1;

    const promise = Cesium.GeoJsonDataSource.load('http://172.20.16.213:8888/geojson/config/chengdu-POI.json')
    promise.then(function (dataSource) {
      viewer.dataSources.add(dataSource);
      const entities = dataSource.entities.values

      for (var o = 0; o < entities.length; o++) {
        var entity = entities[o];
        entity._billboard.color = Cesium.Color.ORANGERED.withAlpha(.9), //添加默认样式
        entity._billboard.scale = 0.5
      }
    })
    viewer.zoomTo(promise);

  </script>
</body>

</html>
