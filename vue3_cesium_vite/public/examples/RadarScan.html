<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>圆形雷达扫描线效果</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>

    <script type="text/javascript">
      'use script'
      var viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE
          })
        )
      })
      viewer.scene.globe.depthTestAgainstTerrain = true

      const radarMaterial = new Cesium.RadarScanMaterialProperty({
        color: new Cesium.Color(1.0, 0.0, 0.0, 0.7),
        speed: 10.0
      })

      const rader = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(104.063245, 30.6628335),
        name: '雷达扫描',
        ellipse: {
          semiMajorAxis: 1000.0,
          semiMinorAxis: 1000.0,
          material: radarMaterial,
          height: 10.0,
          heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND
        }
      })

      ExampleGui.addSlider('扫描速度', 10, 10, 50, 10, function (value) {
        radarMaterial.speed = value
      })
      ExampleGui.finishedLoading()

      viewer.zoomTo(rader)
    </script>
  </body>
</html>
