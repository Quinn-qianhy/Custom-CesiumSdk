<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>动态大气（SkyAtmosphere.dynamic）</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #info-overlay {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 6px 16px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 13px;
        pointer-events: none;
        z-index: 100;
        white-space: nowrap;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <div id="info-overlay"></div>
    <script type="text/javascript">
      'use script'

      var viewer = new Cesium.Viewer('cesiumContainer', {
        animation: true,
        timeline: true,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        contextOptions: {
          requestWebgl2: true,
        },
      })

      var scene = viewer.scene
      scene.globe.depthTestAgainstTerrain = true

      viewer.camera.setView({
        destination: new Cesium.Cartesian3(
          -2850427.424800401,
          4654587.183552037,
          3289972.194967335,
        ),
        orientation: {
          direction: new Cesium.Cartesian3(
            -0.5880229759031641,
            -0.22046178263746055,
            -0.278219494876799,
          ),
          up: new Cesium.Cartesian3(-0.6535959556934616, 0.6963045356153443, 0.3966012818290751),
        },
      })

      var infoEl = document.getElementById('info-overlay')

      function updateInfo() {
        var height = viewer.camera.positionCartographic.height
        var dynamic = scene.skyAtmosphere.dynamic
        infoEl.textContent =
          '高度 ' + height.toFixed(0) + 'm | dynamic=' + dynamic + ' | 拖动时间轴切换昼夜'
      }

      scene.postUpdate.addEventListener(updateInfo)
      updateInfo()

      ExampleGui.addToggleButton('动态天空 (dynamic)', false, function (checked) {
        scene.skyAtmosphere.dynamic = checked
        updateInfo()
      })

      ExampleGui.addButton('切换 dynamic', function () {
        scene.skyAtmosphere.dynamic = !scene.skyAtmosphere.dynamic
        updateInfo()
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
