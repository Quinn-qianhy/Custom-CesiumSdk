<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>面渐变填充</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #toolbar {
        left: 5px;
        top: 5px;
        background: rgba(42, 42, 42, 0.8);
        padding: 4px;
        border-radius: 4px;
      }

      #toolbar input {
        vertical-align: middle;
        padding-top: 2px;
        padding-bottom: 2px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
          url:
            "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",
          show: true
        })
      });

      viewer.scene.globe.depthTestAgainstTerrain = false;

      var promise = Cesium.GeoJsonDataSource.load(
        "http://172.20.16.213:8888/geojson/bazhong_region.geojson"
      );
      promise
        .then(function(dataSource) {
          viewer.dataSources.add(dataSource);

          //Get the array of entities
          var entities = dataSource.entities.values;

          var colorHash = {};
          for (var i = 0; i < entities.length; i++) {
            //For each entity, create a random color based on the state name.
            //Some states have multiple entities, so we store the color in a
            //hash so that we use the same color for the entire state.
            var entity = entities[i];
            var name = entity.name;

            //Set the polygon material to our random color.
            entity.polygon.material = new Cesium.PolyGradientMaterialProperty({
              color: Cesium.Color.fromRandom(),
              alphaPower: 1.3
            });

            entity.polygon.extrudedHeight = 1000;
          }
          viewer.zoomTo(dataSource.entities)
        })
        .otherwise(function(error) {
          //Display any errrors encountered while loading.
          window.alert(error);
        });
    </script>
  </body>
</html>
