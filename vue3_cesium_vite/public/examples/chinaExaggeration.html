<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>cesium自带地形加载</title>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";
      const viewer = new Cesium.Viewer("cesiumContainer",{
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.UrlTemplateImageryProvider({
            url: "https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}",
          }),
        )
      });
      viewer.scene.setTerrain(
        new Cesium.Terrain(Cesium.CesiumTerrainProvider.fromIonAssetId(1)),
      );

      viewer.camera.setView({
        destination: {
          x: -1202859.5630011102,
          y: 5429580.372395073,
          z: 3132316.163330201,
        },
        orientation: {
          direction: {
            x: 0.4643618237372416,
            y: -0.5559812938547164,
            z: 0.689385884348569,
          },
          up: {
            x: -0.08748276900150279,
            y: 0.7457973283495786,
            z: 0.6604037478349595,
          },
        },
        duration: 1,
      });
    </script>
  </body>
</html>
