<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>加载实体面</title>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #toolbar {
        left: 5px;
        top: 5px;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      'use script'
      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          }),
        )
      });
      viewer.scene.globe.depthTestAgainstTerrain = true

      //红色材质的面
      var redPolygon = viewer.entities.add({
        name: 'Red polygon on surface',
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray([
            -115.0, 37.0, -115.0, 32.0, -107.0, 33.0, -102.0, 31.0, -102.0, 35.0
          ]),
          material: Cesium.Color.RED
        }
      })

      //三角形挤压高度、去掉上下面
      var greenPolygon = viewer.entities.add({
        name: 'Green extruded polygon',
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray([-108.0, 42.0, -100.0, 42.0, -104.0, 40.0]),
          extrudedHeight: 500000.0, //挤压高度
          material: Cesium.Color.GREEN,
          closeTop: false, //打开顶部
          closeBottom: false //打开底部
        }
      })

      //开启挤压高度形成的多变形
      var orangePolygon = viewer.entities.add({
        name: 'Orange polygon with per-position heights and outline',
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArrayHeights([
            -108.0, 25.0, 100000, -100.0, 25.0, 100000, -100.0, 30.0, 100000, -108.0, 30.0, 300000
          ]),
          extrudedHeight: 0,
          perPositionHeight: true, //是否开启每个位置的高度
          material: Cesium.Color.ORANGE.withAlpha(0.5),
          outline: true,
          outlineColor: Cesium.Color.BLACK
        }
      })

      //一个面中间开了三次孔洞结构
      var bluePolygon = viewer.entities.add({
        name: 'Blue polygon with holes',
        polygon: {
          hierarchy: {
            positions: Cesium.Cartesian3.fromDegreesArray([
              -99.0, 30.0, -85.0, 30.0, -85.0, 40.0, -99.0, 40.0
            ]),
            holes: [
              {
                positions: Cesium.Cartesian3.fromDegreesArray([
                  -97.0, 31.0, -97.0, 39.0, -87.0, 39.0, -87.0, 31.0
                ]),
                holes: [
                  {
                    positions: Cesium.Cartesian3.fromDegreesArray([
                      -95.0, 33.0, -89.0, 33.0, -89.0, 37.0, -95.0, 37.0
                    ]),
                    holes: [
                      {
                        positions: Cesium.Cartesian3.fromDegreesArray([
                          -93.0, 34.0, -91.0, 34.0, -91.0, 36.0, -93.0, 36.0
                        ])
                      }
                    ]
                  }
                ]
              }
            ]
          },
          material: Cesium.Color.BLUE.withAlpha(0.5)
        }
      })
      //取消挤压高度
      var cyanPolygon = viewer.entities.add({
        name: 'Cyan vertical polygon with per-position heights and outline',
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArrayHeights([
            -90.0, 41.0, 0.0, -85.0, 41.0, 500000.0, -80.0, 41.0, 0.0
          ]),
          perPositionHeight: true,
          // extrudedHeight:0,
          material: Cesium.Color.CYAN.withAlpha(0.5),
          outline: true,
          outlineColor: Cesium.Color.BLACK
        }
      })

      //开启挤压高度，关闭每个点位的高度设置
      var purplePolygonUsingRhumbLines = viewer.entities.add({
        name: 'Purple polygon using rhumb lines with outline',
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray([
            -120.0, 45.0, -80.0, 45.0, -80.0, 55.0, -120.0, 55.0
          ]),
          extrudedHeight: 50000,
          material: Cesium.Color.PURPLE,
          outline: true,
          outlineColor: Cesium.Color.MAGENTA,
          arcType: Cesium.ArcType.RHUMB // 边线必须遵循的路径规则
        }
      })

      viewer.zoomTo(viewer.entities)
    </script>
  </body>
</html>
