<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>反选遮罩</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
    }

  </style>

</head>

<body>
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer")
    viewer.scene.globe.depthTestAgainstTerrain = false
    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 1; // 相机的高度的最小值
    viewer.scene.screenSpaceCameraController.maximumZoomDistance = 5000000; // 相机高度的最大值

    viewer.imageryLayers.addImageryProvider(
      new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      })
    )
    //获取四川省边界线GEOJSON
    fetch('/examples/siChuanPolygon.json')
      .then(response => response.json())
      .then(res => {
        var features = res.features;
        var geo = []
        for (var k = 0; k < features.length; k++) {
          const geometries = this.getGoordGeometry(features[k].geometry)
          for (var i = 0; i < geometries.length; i++) {
            geo.push(geometries[i])
          }
        }
        var maskLayer = viewer.entities.add({
          polygon: {
            hierarchy: {
              positions: Cesium.Cartesian3.fromDegreesArray([
                180.0,90.0,
                180.0, 0.0,
                10.0,0.0,
                0.0,90.0
              ]),
              holes: [{
                positions: Cesium.Cartesian3.fromDegreesArray(
                  geo
                )
              }]
            },
            outline: false,
            height:0,
            material: Cesium.Color.fromCssColorString('#000e3bcc'),
          },
        })
        var positions = maskLayer.polygon.hierarchy._value.holes[0].positions
        viewer.entities.add({
            name: 'boderLine',
            polyline: {
                positions:positions,
                width: 10,
                material:Cesium.Color.fromCssColorString('#39E09Bcc'),
                clampToGround: true
            }
        })
      })

    //获取GEOJSON数据坐标数组
    function getGoordGeometry(geometry) {
      const res = [];
      const coordinates = geometry.coordinates;
      for (let i = 0; i < coordinates.length; i++) {
        const coord = coordinates[i];
        for (let j = 0; j < coord.length; j++) {
          const item = coord[j];
          for (let k = 0; k < item.length; k++) {
            res.push(item[k]);
          }
        }
      }
      return res;
    }
    //初始定位位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 3000000.0), //四川省政府
    })

  </script>
</body>

</html>
