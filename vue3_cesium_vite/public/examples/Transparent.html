<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>地表透明</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
            Cesium.ArcGisBaseMapType.SATELLITE,
            {
              enablePickFeatures: false,
            },
          ),
        ),
      });

      var scene = viewer.scene;
      var globe = scene.globe;
      scene.screenSpaceCameraController.enableCollisionDetection = false;
      globe.translucency.frontFaceAlphaByDistance = new Cesium.NearFarScalar(
        400.0,
        0.0,
        800.0,
        1.0,
      );

      var longitude = -3.82518;
      var latitude = 53.11728;
      var height = 50;
      var position = Cesium.Cartesian3.fromDegrees(longitude, latitude, height);

      var url = "http://172.20.16.213:8888/ParcLeadMine/ParcLeadMine.glb";

      var entity = viewer.entities.add({
        name: url,
        position: position,
        model: {
          uri: url,
        },
      });

      var viewModel = {
        translucencyEnabled: true,
        fadeByDistance: true,
        showVectorData: false,
        alpha: 0.5,
      };

      Cesium.knockout.track(viewModel);
      // ExampleGui 参数面板
      ExampleGui.addToggleButton(
        "translucencyEnabled",
        true,
        function (checked) {
          viewModel.translucencyEnabled = checked;
        },
      );
      ExampleGui.addToggleButton("fadeByDistance", true, function (checked) {
        viewModel.fadeByDistance = checked;
      });
      ExampleGui.addToggleButton("showVectorData", false, function (checked) {
        viewModel.showVectorData = checked;
      });
      ExampleGui.addSlider("透明度", 0.5, 0, 1, 0.01, function (value) {
        viewModel.alpha = value;
      });
      ExampleGui.finishedLoading();
      for (var name in viewModel) {
        if (viewModel.hasOwnProperty(name)) {
          Cesium.knockout.getObservable(viewModel, name).subscribe(update);
        }
      }

      function update() {
        globe.translucency.enabled = viewModel.translucencyEnabled;
        var alpha = Number(viewModel.alpha);
        alpha = !isNaN(alpha) ? alpha : 1.0;
        alpha = Cesium.Math.clamp(alpha, 0.0, 1.0);
        globe.translucency.frontFaceAlphaByDistance.nearValue = alpha;
        globe.translucency.frontFaceAlphaByDistance.farValue =
          viewModel.fadeByDistance ? 1.0 : alpha;
      }
      update();
      viewer.scene.camera.flyTo({
        destination: {
          x: 3828801.301868665,
          y: -255614.49939053337,
          z: 5078030.751106716,
        },
        orientation: {
          direction: {
            x: -0.833374107761545,
            y: -0.013689476527142991,
            z: 0.5525397675688708,
          },
          up: {
            x: 0.5525940305036037,
            y: -0.04105463179882453,
            z: 0.8324387993478232,
          },
        },
        duration: 2.0,
      });
    </script>
  </body>
</html>
