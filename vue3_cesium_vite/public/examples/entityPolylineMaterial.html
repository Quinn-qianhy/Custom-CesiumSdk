<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>实体线材质加载</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      'use script'

      var viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.AmapImageryProvider({
            layerType: Cesium.AmapLayerType.SATELLITE,
          })
        )
      })

      viewer.scene.globe.depthTestAgainstTerrain = false

      var materialLines = []
      var selectedMaterialIndex = 0

      var materialCatalog = [
        {
          name: '红色贴地线',
          createMaterial: function () {
            return Cesium.Color.RED
          },
          arcType: Cesium.ArcType.GEODESIC,
          clampToGround: true
        },
        {
          name: '蓝色发光线',
          createMaterial: function () {
            return new Cesium.PolylineGlowMaterialProperty({
              glowPower: 0.2,
              color: Cesium.Color.CORNFLOWERBLUE
            })
          }
        },
        {
          name: '绿色箭头流动',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: Cesium.Color.fromCssColorString('#a6d96a'),
              repeat: 4.0,
              image: '/examples/material/arrow_1.png',
              speed: 20
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '青色箭头流动',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: Cesium.Color.AQUA,
              image: '/examples/material/arrow2.png',
              repeat: 20,
              speed: 30
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '绿色线条流动',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: Cesium.Color.fromCssColorString('#66bd63'),
              image: '/examples/material/line.png',
              repeat: 2.0,
              speed: 25
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '绿色箭头线流动',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: Cesium.Color.fromCssColorString('#1a9850'),
              image: '/examples/material/lineAarrow.png',
              speed: 20,
              repeat: 5
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '黄绿纹理流动',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: Cesium.Color.CHARTREUSE,
              image: '/examples/material/lineClr.png',
              speed: 25
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '纯纹理流动',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              image: '/examples/material/lineClr2.png',
              speed: 10
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '半透明数据流',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: new Cesium.Color(89 / 255, 249 / 255, 255 / 255, 0.8),
              image: '/examples/material/LineDataTrans.png',
              speed: 8
            })
          },
          arcType: Cesium.ArcType.NONE
        },
        {
          name: '链路脉冲',
          createMaterial: function () {
            return new Cesium.PolylineFlowMaterialProperty({
              color: Cesium.Color.fromCssColorString('#00ff00'),
              image: '/examples/material/LinkPulse.png',
              speed: 3
            })
          },
          arcType: Cesium.ArcType.NONE
        }
      ]

      var DEFAULT_LINE_WIDTH = 22
      var GROUND_LINE_WIDTH = 14

      function getLinePositions(index) {
        var lat = 30.702 - index * 0.015
        return Cesium.Cartesian3.fromDegreesArray([
          104.033, lat,
          104.109, lat - 0.002
        ])
      }

      function addMaterialLine(catalogItem, index) {
        var polylineOptions = {
          positions: getLinePositions(index),
          // width: catalogItem.clampToGround ? GROUND_LINE_WIDTH : DEFAULT_LINE_WIDTH,
          width: 10,
          material: catalogItem.createMaterial()
        }

        if (catalogItem.arcType !== undefined) {
          polylineOptions.arcType = catalogItem.arcType
        }
        if (catalogItem.clampToGround) {
          polylineOptions.clampToGround = true
        }

        var entity = viewer.entities.add({
          name: catalogItem.name,
          polyline: polylineOptions
        })
        materialLines.push(entity)
        return entity
      }

      function loadAllMaterialLines() {
        for (var i = 0; i < materialCatalog.length; i++) {
          addMaterialLine(materialCatalog[i], i)
        }
      }

      function removeLastMaterialLine() {
        var last = materialLines.pop()
        if (last) {
          viewer.entities.remove(last)
        }
      }

      function clearMaterialLines() {
        while (materialLines.length > 0) {
          removeLastMaterialLine()
        }
      }

      loadAllMaterialLines()

      ExampleGui.addToolbarMenu(
        materialCatalog.map(function (item, index) {
          return {
            text: item.name,
            onselect: function () {
              selectedMaterialIndex = index
            }
          }
        })
      )

      ExampleGui.addToolbarButton('添加线材质', function () {
        addMaterialLine(
          materialCatalog[selectedMaterialIndex],
          materialLines.length
        )
      })

      ExampleGui.addToolbarButton('删除最后一条', function () {
        removeLastMaterialLine()
      })

      ExampleGui.addToolbarButton('清除全部', function () {
        clearMaterialLines()
      })

      ExampleGui.finishedLoading()

      viewer.zoomTo(viewer.entities)
    </script>
  </body>
</html>
