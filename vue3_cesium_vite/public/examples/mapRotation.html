<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>自定义天空盒</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      scene3Donly: true
    })
    viewer.scene.globe.depthTestAgainstTerrain = true

    viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({
        url: "https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}"
      })
    )
    //初始定位位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(104.08, 30.65, 30000000.0), //四川省政府
    })

    selectImage(1)
    function selectImage(num) {
      switch (num) {
        case 1:
          viewer.scene.skyBox = new Cesium.SkyBox({
            sources: {
              negativeX: "/examples/SkyBox/img1/mx.jpg",
              negativeY: "/examples/SkyBox/img1/my.jpg",
              negativeZ: "/examples/SkyBox/img1/mz.jpg",
              positiveX: "/examples/SkyBox/img1/px.jpg",
              positiveY: "/examples/SkyBox/img1/py.jpg",
              positiveZ: "/examples/SkyBox/img1/pz.jpg",
            }
          })
          break
        case 2:
        viewer.scene.skyBox = new Cesium.SkyBox({
            sources: {
              negativeX: "/examples/SkyBox/img2/mx.jpg",
              negativeY: "/examples/SkyBox/img2/my.jpg",
              negativeZ: "/examples/SkyBox/img2/mz.jpg",
              positiveX: "/examples/SkyBox/img2/px.jpg",
              positiveY: "/examples/SkyBox/img2/py.jpg",
              positiveZ: "/examples/SkyBox/img2/pz.jpg",
            }
          })
          break
        case 3:
        viewer.scene.skyBox = new Cesium.SkyBox({
            sources: {
              negativeX: "/examples/SkyBox/img3/mx.jpg",
              negativeY: "/examples/SkyBox/img3/my.jpg",
              negativeZ: "/examples/SkyBox/img3/mz.jpg",
              positiveX: "/examples/SkyBox/img3/px.jpg",
              positiveY: "/examples/SkyBox/img3/py.jpg",
              positiveZ: "/examples/SkyBox/img3/pz.jpg",
            }
          })
          break
      }
    }
    ExampleGui.addToolbarButton("背景1", function () {
      selectImage(1)
    });
    ExampleGui.addToolbarButton("背景2", function () {
      selectImage(2)
    });
    ExampleGui.addToolbarButton("背景3", function () {
      selectImage(3)
    });

  </script>
</body>

</html>
