<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>缓冲区分析</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <script src="/examples/pluginJs/turf.min.js"></script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer">
  </div>
  

  </div>
  <script type="text/javascript">
    "use script";

    var viewer = new Cesium.Viewer("cesiumContainer", {
        navigation: false,
        imageryProvider:  new Cesium.ArcGisMapServerImageryProvider({
        url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
        })
    });
    // viewer.scene.globe.depthTestAgainstTerrain = true; //开启深度检测
    const viewModel = {
        distance: 30 //缓冲距离
    }
    Cesium.knockout.track(viewModel);
    // ExampleGui 参数面板
    ExampleGui.addSlider('缓冲距离(米)', 30 //缓冲距离, 10, 100, 10, function(value) {
      viewModel.distance = value;
    });
    ExampleGui.finishedLoading();
Cesium.knockout
      .getObservable(viewModel, "distance")
      .subscribe(function (newValue) {
        viewModel.distance = newValue
        if (isNaN(distance)) {
          return;
        }
      });
      //实体坐标串
      var point = [104.022638966289, 30.5698367125623]
      var linePoints = [
            [104.025203158107, 30.5694914480581],
            [104.028808047023, 30.569230166027],
            [104.031661917416, 30.5692674920729],
            [104.034708906857, 30.5693048181049]
        ]
      var polygonPoints = [
            [104.038549830166, 30.5701073244566],
            [104.040695597377, 30.5701073244566],
            [104.040738512722, 30.5688755679036],
            [104.038700033871, 30.5687262630581],
            [104.038034846035, 30.5690248725284],
            [104.038549830166, 30.5701073244566]
        ]

    function initPointBuffer(viewModel) {
        let distance = viewModel.distance
        let pointF = turf.point(point);
        let buffered = turf.buffer(pointF, distance, { units: 'meters' });//生成缓冲面数据
        let coordinates = buffered.geometry.coordinates;//缓冲面坐标串
        let points = coordinates[0];
        let degreesArray = pointsToDegreesArray(points);
        addBufferPolyogn(Cesium.Cartesian3.fromDegreesArray(degreesArray));//缓冲面实体添加
    }
    //添加点
    function addPoint(point) {
        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(point[0], point[1], 0),
            point: {
                pixelSize: 10,
                color: Cesium.Color.YELLOW,
            }
        });
    }
   
    //初始化线缓冲
    function initPolylineBuffer(viewModel) {
        let distance = viewModel.distance
        let polylineF = turf.lineString(linePoints);
        let buffered = turf.buffer(polylineF, distance, { units: 'meters' });
        let coordinates = buffered.geometry.coordinates;
        let points = coordinates[0];
        let degreesArray = pointsToDegreesArray(points);
        addBufferPolyogn(Cesium.Cartesian3.fromDegreesArray(degreesArray));
    }
    //添加线
    function addPolyline(positions) {
        viewer.entities.add({
            polyline: {
                positions: positions,
                width: 2,
                material: Cesium.Color.YELLOW,
            }
        })
    }

    //初始化面缓冲
    function initPolygonBuffer(viewModel) {
        let distance = viewModel.distance
        let polygonF = turf.polygon([polygonPoints]);
        let buffered = turf.buffer(polygonF, distance, { units: 'meters' });
        let coordinates = buffered.geometry.coordinates;
        let points = coordinates[0];
        let degreesArray = pointsToDegreesArray(points);
        addBufferPolyogn(Cesium.Cartesian3.fromDegreesArray(degreesArray));
    }
    function addPolygon(positions) {
        viewer.entities.add({
            polygon: {
                hierarchy: new Cesium.PolygonHierarchy(positions),
                material: Cesium.Color.YELLOW.withAlpha(0.6),
                classificationType: Cesium.ClassificationType.BOTH
            },
            // polyline: {
            //     positions: positions,
            //     width: 2,
            //     material: Cesium.Color.YELLOW.withAlpha(0.4),
            // }
        });
    }

     //添加缓冲面
    function addBufferPolyogn(positions) {
        viewer.entities.add({
            id: 'buffer',
            polygon: {
                hierarchy: new Cesium.PolygonHierarchy(positions),
                material: Cesium.Color.RED.withAlpha(0.6),
                classificationType: Cesium.ClassificationType.BOTH
            },
        });
    }
     //格式转换
    function pointsToDegreesArray(points) {
        let degreesArray = [];
        points.map(item => {
            degreesArray.push(item[0]);
            degreesArray.push(item[1]);
        });
        return degreesArray;
    }
  
    addPoint(point)
    addPolyline(Cesium.Cartesian3.fromDegreesArray(pointsToDegreesArray(linePoints)));
    addPolygon(Cesium.Cartesian3.fromDegreesArray(pointsToDegreesArray(polygonPoints)));
    viewer.zoomTo(viewer.entities)

    function removeBuffer() {
        viewer.entities.removeById('buffer')
    }
    ExampleGui.addToolbarButton("缓冲点", function () {  
        removeBuffer()
        initPointBuffer(viewModel)
    })
    ExampleGui.addToolbarButton("缓冲线", function () {
        removeBuffer()
        initPolylineBuffer(viewModel)
    })
    ExampleGui.addToolbarButton("缓冲面", function () {
        removeBuffer()
        initPolygonBuffer(viewModel)
    })
   
  </script>
</body>

</html>
