<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>ARCGIS地图</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use strict";

      var ARCGIS_BASEMAP_OPTIONS = {
        enablePickFeatures: false,
      };

      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
            Cesium.ArcGisBaseMapType.SATELLITE,
            ARCGIS_BASEMAP_OPTIONS,
          ),
        ),
      });

      function switchBasemap(basemapType) {
        var layers = viewer.imageryLayers;
        var oldLayer = layers.get(0);
        layers.remove(oldLayer, false);
        layers.add(
          Cesium.ImageryLayer.fromProviderAsync(
            Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
              basemapType,
              ARCGIS_BASEMAP_OPTIONS,
            ),
          ),
          0,
        );
      }

      ExampleGui.addToolbarButton("卫星图 SATELLITE", function () {
        switchBasemap(Cesium.ArcGisBaseMapType.SATELLITE);
      });
      ExampleGui.addToolbarButton("海洋图 OCEANS", function () {
        switchBasemap(Cesium.ArcGisBaseMapType.OCEANS);
      });
      ExampleGui.addToolbarButton("山体阴影 HILLSHADE", function () {
        switchBasemap(Cesium.ArcGisBaseMapType.HILLSHADE);
      });
    </script>
  </body>
</html>
