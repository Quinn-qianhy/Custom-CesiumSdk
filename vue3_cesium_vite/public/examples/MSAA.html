<!DOCTYPE html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>水面倒影</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
      }
</style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
<script type="text/javascript">
      "use script";
      var viewer = new Cesium.Viewer("cesiumContainer", {
        imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
          url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",
          show: true
        }),
        orderIndependentTranslucency: false,
        contextOptions: {
          requestWebgl2: true
        }
      });

      viewer.scene.globe.depthTestAgainstTerrain = true;

      var scene = viewer.scene;
      scene.camera.setView({
        destination: new Cesium.Cartesian3(
          -2850427.424800401,
          4654587.183552037,
          3289972.194967335
        ),
        orientation: {
          direction: new Cesium.Cartesian3(
            -0.5880229759031641,
            -0.22046178263746055,
            -0.778219494876799
          ),
          up: new Cesium.Cartesian3(
            -0.6535959556934616,
            0.6963045356153443,
            0.2966012818290751
          )
        }
      });
      scene.primitives.add(Cesium.createOsmBuildings());
      var tileset_nanpu = scene.primitives.add(
        new Cesium.Cesium3DTileset({
          url: "http://180.167.213.122:18000/model/nanpudaqiao/tileset.json",
          skipLevelOfDetail: true,
          maximumScreenSpaceError: 24
        })
      );
      tileset_nanpu.readyPromise
        .then(function(tileset) {
          viewer.scene.primitives.add(tileset);
          var surface = Cesium.Cartesian3.fromDegrees(121.5009, 31.2075, -5.7); //-5.7
          var mat = Cesium.Transforms.eastNorthUpToFixedFrame(surface);
          var rotationZ = Cesium.Matrix4.fromRotationTranslation(
            Cesium.Matrix3.fromRotationZ(Cesium.Math.toRadians(-22.33))
          );
          Cesium.Matrix4.multiply(mat, rotationZ, mat);
          tileset._root.transform = mat;
        })
        .otherwise(function(error) {
          console.log(error);
        });
      // http://180.167.213.122:18000/model/nanpudaqiao/
      let water;
      Cesium.GeoJsonDataSource.load(
        "http://172.20.16.213:8888/geojson/huangpujiang.json"
      ).then(source => {
        let entities = source.entities.values;
        for (let i = 0; i < entities.length; i++) {
          const entity = entities[i];
          let polygonHierarchy = entity.polygon.hierarchy._value;
          console.log(polygonHierarchy);
          let polygon = new Cesium.PolygonGeometry({
            polygonHierarchy: polygonHierarchy,
            height: 10,
            vertexFormat: Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT
          });

          water = new Cesium.WaterReflect({
            geometry: polygon,
            scene: scene,
            materialsOptions: {
              reflector: true,
              baseWaterColor: new Cesium.Color(0.0, 0.75, 0.77, 1), //水的颜色
              frequency: 1000, // 控制波数的数字
              animationSpeed: 0.005, // 水流速度
              amplitude: 35, //控制水波振幅的数字
              distortionScale: 8
            }
          });
        }
      });

      var height = -10;
      var position = Cesium.Cartesian3.fromDegrees(
        121.48960149965716,
        31.2428359062178,
        height
      );

      var entity = viewer.entities.add({
        position: position,
        orientation: Cesium.Transforms.headingPitchRollQuaternion(
          position,
          new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(120), 0, 0)
        ),
        model: {
          uri: "/examples/sampleData/models/a.glb",
          scale: 0.001
        }
      });
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(
          121.48960149965716,
          31.2378359062178,
          height
        ),
        orientation: Cesium.Transforms.headingPitchRollQuaternion(
          position,
          new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(70), 0, 0)
        ),
        model: {
          uri: "/examples/sampleData/models/b.glb",
          scale: 1
        }
      });
      
      viewer.scene._useMSAA = true;
      ExampleGui.addToolbarButton("msaa", function() {
        // viewer.scene._context.msaaEnable = !viewer.scene._context.msaaEnable;
        viewer.scene._useMSAA = !viewer.scene._useMSAA;
      });
    </script>
  </body>
</html>
