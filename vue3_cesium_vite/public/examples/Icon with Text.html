<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>图标点加文字</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      position: relative
    }

    #toolbar {
      margin: 5px;
      padding: 2px 5px;
      position: absolute;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer">
  </div>
  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      navigation: false,
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    });
    var stages = viewer.scene.postProcessStages;
    viewer.scene.brightness = viewer.scene.brightness || stages.add(Cesium.PostProcessStageLibrary
      .createBrightnessStage());
    viewer.scene.brightness.enabled = true;
    viewer.scene.brightness.uniforms.brightness = 1.5;

    const promise = Cesium.GeoJsonDataSource.load('http://172.20.16.213:8888/geojson/chengduPOI.json')
    promise.then(function (dataSource) {
      viewer.dataSources.add(dataSource);
      const entities = dataSource.entities.values
      for (var o = 0; o < entities.length; o++) {
        var entity = entities[o];
        var name = entity.name
        entity.billboard = {
          image: '/examples/clusterPicture/billBoardIcon.png',
          scale:0.5
        }
        entity.label = {
          text: name,
          font: '12px 微软雅黑',
          pixelOffset: new Cesium.Cartesian2(0, -20),
          fillColor: Cesium.Color.YELLOW
        }
      }
    })
    viewer.camera.flyTo({
      destination: {
        x: -1335233.4745715284,
        y: 5328007.520636902,
        z: 3233223.8219196964
      },
      orientation: {
        heading: 0.371096235916637,
        pitch: -0.7895996875553664,
        roll: 0.0015189332289136104
      }
    })

  </script>
</body>

</html>
