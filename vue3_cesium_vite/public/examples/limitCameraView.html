<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>限制视角范围</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    })

    //初始定位位置
    function flyDefault() {
      viewer.camera.flyTo({
        destination: {
          x: -1311421.4831991948,
          y: 5360755.838538747,
          z: 3216959.482533206
        },
        orientation:{
          direction: {
          x: -0.524616065702551,
          y: -0.7128174136213665,
          z: 0.46547751658369324
        },
        up: {
          x: -0.3512629733107011,
          y: 0.6792868309254148,
          z: 0.6443475187445302
        },
        },
        duration: 1
      })
    }
    flyDefault()

    var centerPosition = Cesium.Cartesian3.fromDegrees(104.08, 30.65)

    //创建视角范围
    var entity = viewer.entities.add({
      name: "Dome",
      position: centerPosition,
      ellipsoid: {
        radii: new Cesium.Cartesian3(200000.0, 200000.0, 200000.0),
        maximumCone: Cesium.Math.PI_OVER_TWO,
        material: Cesium.Color.RED.withAlpha(0.1),
        outline: true,
        outlineColor: Cesium.Color.AQUA,
        slicePartitions: 32,
        stackPartitions: 32
      },
    });

    /* 计算两点之间的距离 */
    function getDistance() {
      var cameraPosition = viewer.camera.position
      var distance = Cesium.Cartesian3.distance(centerPosition, cameraPosition)
      return distance
    }

    //相机移动事件
    function cameraMove() {
      if (viewer && centerPosition) {
        var distance = getDistance()
        if (distance > 200000) {
          setTimeout(flyDefault, 1000);
        }
      }
    }

    //注册 监听相机移动事件
    viewer.camera.changed.addEventListener(cameraMove)

   

  </script>
</body>

</html>
