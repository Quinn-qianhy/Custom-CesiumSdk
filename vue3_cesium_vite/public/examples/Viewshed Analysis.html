<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>测试</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/example-gui.js"></script>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <script src="/examples/pluginJs/cesium-viewshed.js"></script>
  <!-- <script src="/examples/pluginJs/ViewShed3D.js"></script> -->
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }
</style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";

    var viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
        )
    });

    viewer.scene.globe.depthTestAgainstTerrain = true;

    var tileset = viewer.scene.primitives.add(
      new Cesium.Cesium3DTileset({
        url: Cesium.IonResource.fromAssetId(75343),
        maximumScreenSpaceError: 4,
        appearanceGradientByHeight: true
      })
    );
    const style = {
      color: {
        conditions: [
          ["true", "color('aqua')"]
        ]
      }
    };
    tileset.style = new Cesium.Cesium3DTileStyle(style);

    tileset.readyPromise
      .then(function (tileset) {
        viewer.flyTo(
          tileset,
          new Cesium.HeadingPitchRange(
            0.0,
            -0.5,
            tileset.boundingSphere.radius * 2.0
          )
        );
      })
    var arrViewField = [];
    var viewModel = {
      verticalAngle: 90, //垂直夹角
      horizontalAngle: 120, //水平夹角
      distance: 10, //观测距离
      alpha: 0.5, //透明度
    };
    Cesium.knockout.track(viewModel);
    // ExampleGui 参数面板
    ExampleGui.addSlider('水平夹角', 120, 1, 180, 1, function(value) {
      viewModel.horizontalAngle = value;
    });
    ExampleGui.addSlider('垂直夹角', 90, 1, 180, 1, function(value) {
      viewModel.verticalAngle = value;
    });
    ExampleGui.addSlider('透明度', 0.5, 0, 1, 0.01, function(value) {
      viewModel.alpha = value;
    });
    ExampleGui.finishedLoading();
Cesium.knockout
      .getObservable(viewModel, "horizontalAngle")
      .subscribe(function (newValue) {
        if (Number(newValue)) {
          viewModel.horizontalAngle = newValue;
          // clearAllViewField()
        }
      });
    Cesium.knockout
      .getObservable(viewModel, "verticalAngle")
      .subscribe(function (newValue) {
        if (Number(newValue)) {
          viewModel.verticalAngle = newValue;
          // clearAllViewField()
        }
      });
    Cesium.knockout
      .getObservable(viewModel, "alpha")
      .subscribe(function (newValue) {
        if (Number(newValue)) {
          viewModel.alpha = newValue;
          // clearAllViewField()
        }
      });

    function addViewField() {
      var e = new Cesium.ViewShed3D(viewer, {
        horizontalAngle: Number(viewModel.horizontalAngle),
        verticalAngle: Number(viewModel.verticalAngle),
        distance: Number(viewModel.distance),
        alpha: Number(viewModel.alpha),
        calback: function () {
          viewModel.distance = e.distance
        }
      });
      arrViewField.push(e)
    }
    // 清除可视域
    function clearAllViewField() {
      for (var e = 0, i = arrViewField.length; e < i; e++) {
        arrViewField[e].destroy()
      }
      arrViewField = []
    }


    ExampleGui.addToolbarButton("添加可视域", function () {
      addViewField()
    })
    ExampleGui.addToolbarButton("删除可视域", function () {
      clearAllViewField()
    })

  </script>
</body>

</html>
