<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>开场动画</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar">
  </div>

  <script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      }),
      shouldAnimate: true
    });

    let prev = viewer.clock.currentTime;
    var icrf = () => {
      var position = viewer.camera.position
      var {
        height
      } = viewer.scene.globe.ellipsoid.cartesianToCartographic(position)
      const a = (465.2 / (6371 * 1000)) * (height + 6371 * 1000);
      var currentTime = viewer.clock.currentTime
      const interval = Cesium.JulianDate.toDate(currentTime) - Cesium.JulianDate.toDate(prev);
      prev = currentTime;
      viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, (Math.PI / (24 * 60 * 60)) * (interval * a / 100))
    }

    function start(cesiumViewer, option = {
      multiplier: 1
    }) {
      var viewer = cesiumViewer
      viewer.clock.onTick.addEventListener(icrf);
      if (viewer.clock) {
        const keys = Object.keys(option)
        for (let k of keys) {
          viewer.clock[k] = option[k]
        }
      }
    }
    start(viewer,1)
    function stop() {
        viewer.clock.onTick.removeEventListener(icrf)
      viewer.camera.flyTo({
        destination: {
          x: -1344315.1751457257,
          y: 5631144.077121848,
          z: 3101106.5376860467
        },
        orientation: {
          direction: {
            x: 0.11618959514610938,
            y: -0.9287361394237142,
            z: 0.3520641437410497
          },
          up: {
            x: -0.16955518719924556,
            y: 0.33071475486284985,
            z: 0.9283742722683745
          }
        },
        duration: 1
      })
    }

    setTimeout(function () {
      stop();
    }, 2000)

  </script>
</body>

</html>
