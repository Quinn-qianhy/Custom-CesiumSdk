<!doctype html>
<html>
  <head>
    <link rel="shortcut icon" type="image/x-icon" />
    <title>Polyline Volume管线</title>
    <script src="/cesium/Cesium.js"></script>
    <script src="/defaultAccessToken.js"></script>
    <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
    <link href="/examples/example-gui.css" rel="stylesheet" />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>

  <body class="dark">
    <div id="cesiumContainer"></div>
    <script type="text/javascript">
      "use script";

      var viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          new Cesium.UrlTemplateImageryProvider({
            url: "https://webst02.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}",
          }),
        ),
      });

      function computeCircle(radius) {
        var positions = [];
        for (var i = 0; i < 360; i++) {
          var radians = Cesium.Math.toRadians(i);
          positions.push(
            new Cesium.Cartesian2(
              radius * Math.cos(radians),
              radius * Math.sin(radians),
            ),
          );
        }
        return positions;
      }

      function computeStar(arms, rOuter, rInner) {
        var angle = Math.PI / arms;
        var length = 2 * arms;
        var positions = new Array(length);
        for (var i = 0; i < length; i++) {
          var r = i % 2 === 0 ? rOuter : rInner;
          positions[i] = new Cesium.Cartesian2(
            Math.cos(i * angle) * r,
            Math.sin(i * angle) * r,
          );
        }
        return positions;
      }

      var redTube = viewer.entities.add({
        name: "Red tube with rounded corners",
        polylineVolume: {
          positions: Cesium.Cartesian3.fromDegreesArray([
            -85.0, 32.0, -85.0, 36.0, -89.0, 36.0,
          ]),
          shape: computeCircle(60000.0),
          material: Cesium.Color.RED,
        },
      });

      var greenBox = viewer.entities.add({
        name: "Green box with beveled corners and outline",
        polylineVolume: {
          positions: Cesium.Cartesian3.fromDegreesArrayHeights([
            -90.0, 32.0, 0.0, -90.0, 36.0, 100000.0, -94.0, 36.0, 0.0,
          ]),
          shape: [
            new Cesium.Cartesian2(-50000, -50000),
            new Cesium.Cartesian2(50000, -50000),
            new Cesium.Cartesian2(50000, 50000),
            new Cesium.Cartesian2(-50000, 50000),
          ],
          cornerType: Cesium.CornerType.BEVELED,
          material: Cesium.Color.GREEN.withAlpha(0.5),
          outline: true,
          outlineColor: Cesium.Color.BLACK,
        },
      });

      var blueStar = viewer.entities.add({
        name: "Blue star with mitered corners and outline",
        polylineVolume: {
          positions: Cesium.Cartesian3.fromDegreesArrayHeights([
            -95.0, 32.0, 0.0, -95.0, 36.0, 100000.0, -99.0, 36.0, 200000.0,
          ]),
          shape: computeStar(7, 70000, 50000),
          cornerType: Cesium.CornerType.MITERED,
          material: Cesium.Color.BLUE,
        },
      });

      viewer.zoomTo(viewer.entities);
    </script>
  </body>
</html>
