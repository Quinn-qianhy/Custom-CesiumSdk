<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>迁徙线效果</title>
<script src="/cesium/Cesium.js"></script>
  <script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
      top: 5px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>
<script type="text/javascript">
    "use script";
    var viewer = new Cesium.Viewer("cesiumContainer", {
      imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
        //ARCGIS蓝色底图
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      })
    })
    var cities = [{
        name: '资阳市',
        lon: 104.63,
        lat: 30.14,
      },
      {
        name: '简阳市',
        lon: 104.55,
        lat: 30.41,
      },
      {
        name: '崇州市',
        lon: 103.68,
        lat: 30.64,
      },
      {
        name: '绵阳市',
        lon: 104.68,
        lat: 31.47,
      },
      {
        name: '广汉市',
        lon: 104.28,
        lat: 30.98,
      },
      {
        name: '彭州市',
        lon: 103.96,
        lat: 31.00,
      },
      {
        name: '都江堰市',
        lon: 103.64,
        lat: 30.99,
      },
      {
        name: '邛崃市',
        lon: 103.46,
        lat: 30.42,
      },
      {
        name: '眉山市',
        lon: 103.85,
        lat: 30.08,
      },
      {
        name: '什邡市',
        lon: 104.17,
        lat: 31.13,
      },
      {
        name: '乐山市',
        lon: 103.76,
        lat: 29.55,
      },
      {
        name: '遂宁市',
        lon: 105.59,
        lat: 30.54,
      },
      {
        name: '峨眉山市',
        lon: 103.49,
        lat: 29.60,
      },
      {
        name: '绵竹市',
        lon: 104.21,
        lat: 31.35,
      },
      {
        name: '内江市',
        lon: 105.05,
        lat: 29.58,
      },
    ]

    var endLon, endLat, startPosition, endPosition
    let endPositions = []

    for (let i = 0; i < cities.length; i++) {
      endLon = cities[i].lon
      endLat = cities[i].lat
      startPosition = Cesium.Cartesian3.fromDegrees(104.043733, 30.675891, 1)
      endPosition = Cesium.Cartesian3.fromDegrees(endLon, endLat, 1)
      endPositions.push(endPosition)
      viewer.entities.add({
          position: endPosition,
          billboard: {
            image: '/examples/clusterPicture/icon-addr.png',
            show: true,
            scale: 1.0
          }
      })
    }
  
    const thing = new Cesium.BaseThing(viewer)
    const newPoline = thing.ParabolicEntity({
        startPosition: startPosition, 
        endPositions: endPositions, 
        material: new Cesium.PolylineFlowMaterialProperty({
            color: Cesium.Color.CHARTREUSE,
            image: "/examples/material/lineClr.png",
            speed: 10
          })
      })

    thing.addThing(newPoline)

    viewer.camera.flyTo({
      destination: {
        x: -1394708.9041266106,
        y: 5635510.043497931,
        z: 3105153.260860206
      },
      orientation: {
        direction: {
          x: 0.25095584692849926,
          y: -0.8830109329362771,
          z: 0.39662684630191797
        },
        up: {
          x: -0.23710377320139212,
          y: 0.47820539692630487,
          z: 0.8456366826741956
        }
      },
      duration: 0
    })

  </script>
</body>

</html>
