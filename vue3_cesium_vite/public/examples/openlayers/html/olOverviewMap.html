<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>鹰眼控件</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import OverviewMap from 'ol/control/OverviewMap.js'
      import { defaults as defaultControls } from 'ol/control/defaults.js'
      import { fromLonLat } from 'ol/proj.js'
      import {
        createGaodeImageryLayer,
        DEFAULT_LON_LAT,
        DEFAULT_ZOOM
      } from '/examples/openlayers/ol/gaodeImageryLayer.js'

      const overviewMapControl = new OverviewMap({
        layers: [createGaodeImageryLayer()],
        collapsed: false
      })

      const map = new Map({
        controls: defaultControls().extend([overviewMapControl]),
        layers: [createGaodeImageryLayer()],
        target: 'map',
        view: new View({
          center: fromLonLat(DEFAULT_LON_LAT),
          zoom: DEFAULT_ZOOM
        })
      })

      ExampleGui.addToggleButton('折叠鹰眼', false, function (checked) {
        overviewMapControl.setCollapsed(checked)
      })

      ExampleGui.addToolbarButton('飞往上海', function () {
        map.getView().animate({
          center: fromLonLat([121.4737, 31.2304]),
          zoom: 12,
          duration: 800
        })
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
