<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Mapbox Vector Tiles</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #map {
        background: #f8f4f0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
    <script src="/examples/openlayers/ol/mapboxStreetsV6Style.js"></script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import MVT from 'ol/format/MVT.js'
      import VectorTileLayer from 'ol/layer/VectorTile.js'
      import VectorTileSource from 'ol/source/VectorTile.js'
      import Fill from 'ol/style/Fill.js'
      import Icon from 'ol/style/Icon.js'
      import Stroke from 'ol/style/Stroke.js'
      import Style from 'ol/style/Style.js'
      import Text from 'ol/style/Text.js'

      const settings = {
        accessToken: ''
      }

      let map = null

      function disposeMap() {
        if (map) {
          map.setTarget(null)
          map = null
        }
      }

      function loadMap() {
        const token = settings.accessToken.trim()
        if (!token) {
          return
        }

        disposeMap()

        map = new Map({
          layers: [
            new VectorTileLayer({
              declutter: true,
              source: new VectorTileSource({
                attributions:
                  '© <a href="https://www.mapbox.com/map-feedback/">Mapbox</a> ' +
                  '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
                format: new MVT(),
                url:
                  'https://{a-d}.tiles.mapbox.com/v4/mapbox.mapbox-streets-v6/' +
                  '{z}/{x}/{y}.vector.pbf?access_token=' +
                  token
              }),
              style: createMapboxStreetsV6Style(Style, Fill, Stroke, Icon, Text)
            })
          ],
          target: 'map',
          view: new View({
            center: [0, 0],
            zoom: 2
          })
        })
      }

      ExampleGui.addTextInput('Access Token', settings, 'accessToken')
      ExampleGui.addToolbarButton('加载地图', loadMap)

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
