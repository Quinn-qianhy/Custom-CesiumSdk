<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>矢量图层</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #info {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 5;
        min-width: 220px;
        max-width: 360px;
        padding: 8px 12px;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>
    <div id="info" class="infoPanel">移动鼠标或点击地图查看区域信息</div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import GeoJSON from 'ol/format/GeoJSON.js'
      import VectorLayer from 'ol/layer/Vector.js'
      import VectorSource from 'ol/source/Vector.js'

      const vectorLayer = new VectorLayer({
        background: '#1a2b39',
        source: new VectorSource({
          url: 'https://openlayers.org/data/vector/ecoregions.json',
          format: new GeoJSON()
        }),
        style: {
          'fill-color': ['string', ['get', 'COLOR'], '#eee']
        }
      })

      const map = new Map({
        layers: [vectorLayer],
        target: 'map',
        view: new View({
          center: [0, 0],
          zoom: 1
        })
      })

      const featureOverlay = new VectorLayer({
        source: new VectorSource(),
        map: map,
        style: {
          'stroke-color': 'rgba(255, 255, 255, 0.7)',
          'stroke-width': 2
        }
      })

      const info = document.getElementById('info')
      let highlight = null

      function displayFeatureInfo(pixel) {
        const feature = map.forEachFeatureAtPixel(pixel, function (item) {
          return item
        })

        if (feature) {
          info.textContent = feature.get('ECO_NAME') || '未知区域'
        } else {
          info.textContent = '移动鼠标或点击地图查看区域信息'
        }

        if (feature !== highlight) {
          if (highlight) {
            featureOverlay.getSource().removeFeature(highlight)
          }
          if (feature) {
            featureOverlay.getSource().addFeature(feature)
          }
          highlight = feature
        }
      }

      map.on('pointermove', function (evt) {
        if (evt.dragging) {
          return
        }
        displayFeatureInfo(evt.pixel)
      })

      map.on('click', function (evt) {
        displayFeatureInfo(evt.pixel)
      })

      ExampleGui.addToggleButton('显示矢量图层', true, function (checked) {
        vectorLayer.setVisible(checked)
      })

      ExampleGui.addToolbarButton('重置视图', function () {
        map.getView().animate({
          center: [0, 0],
          zoom: 1,
          duration: 600
        })
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
