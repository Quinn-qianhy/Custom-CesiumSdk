<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>航线飞行动画</title>
    <script src="/vendor/lil-gui/lil-gui.umd.min.js"></script>
    <script src="/examples/shared/example-gui.js"></script>
    <link href="/vendor/lil-gui/lil-gui.min.css" rel="stylesheet" />
    <link href="/examples/shared/example-gui.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
    <script src="https://api.mapbox.com/mapbox.js/plugins/arc.js/v0.1.0/arc.js"></script>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://esm.sh/ol@10.9.0/"
        }
      }
    </script>
  </head>

  <body class="dark">
    <div id="map"></div>

    <script type="module">
      import Map from 'ol/Map.js'
      import View from 'ol/View.js'
      import Feature from 'ol/Feature.js'
      import LineString from 'ol/geom/LineString.js'
      import TileLayer from 'ol/layer/Tile.js'
      import VectorLayer from 'ol/layer/Vector.js'
      import { getVectorContext } from 'ol/render.js'
      import Stroke from 'ol/style/Stroke.js'
      import Style from 'ol/style/Style.js'
      import VectorSource from 'ol/source/Vector.js'
      import { getWidth } from 'ol/extent.js'
      import { createGaodeImageryLayer } from '/examples/openlayers/ol/gaodeImageryLayer.js'

      const FLIGHTS_URL =
        'https://openlayers.org/en/latest/examples/data/openflights/flights.json'

      const tileLayer = createGaodeImageryLayer()

      const map = new Map({
        layers: [tileLayer],
        target: 'map',
        view: new View({
          center: [-11000000, 4600000],
          zoom: 2
        })
      })

      const style = new Style({
        stroke: new Stroke({
          color: '#EAE911',
          width: 2
        })
      })

      const flightsSource = new VectorSource({
        attributions: 'Flight data by <a href="https://openflights.org/data.html">OpenFlights</a>',
        loader: loadFlights
      })

      map.addLayer(
        new VectorLayer({
          source: flightsSource,
          style: function (feature) {
            return feature.get('finished') ? style : null
          }
        })
      )

      // 每帧绘制飞行进度线（只注册一次，重新播放时复用）
      tileLayer.on('postrender', animateFlights)

      // 每毫秒绘制的弧线点数，控制飞行动画速度
      let pointsPerMs = 0.02

      function loadFlights() {
        fetch(FLIGHTS_URL)
          .then(function (response) {
            return response.json()
          })
          .then(function (json) {
            const flights = json.flights
            for (let i = 0; i < flights.length; i++) {
              const from = flights[i][0]
              const to = flights[i][1]
              const arcLine = new arc.GreatCircle({ x: from[1], y: from[0] }, { x: to[1], y: from[0] }).Arc(
                100,
                { offset: 10 }
              )
              const features = []
              arcLine.geometries.forEach(function (geometry) {
                const line = new LineString(geometry.coords)
                line.transform('EPSG:4326', 'EPSG:3857')
                features.push(
                  new Feature({
                    geometry: line,
                    finished: false
                  })
                )
              })
              addLater(features, i * 50)
            }
          })
      }

      function animateFlights(event) {
        const vectorContext = getVectorContext(event)
        const frameState = event.frameState
        vectorContext.setStyle(style)
        const features = flightsSource.getFeatures()
        for (let i = 0; i < features.length; i++) {
          const feature = features[i]
          if (feature.get('finished')) {
            continue
          }
          const coords = feature.getGeometry().getCoordinates()
          const elapsedTime = frameState.time - feature.get('start')
          if (elapsedTime >= 0) {
            const elapsedPoints = elapsedTime * pointsPerMs
            if (elapsedPoints >= coords.length) {
              feature.set('finished', true)
            }
            const maxIndex = Math.min(elapsedPoints, coords.length)
            const currentLine = new LineString(coords.slice(0, maxIndex))
            const worldWidth = getWidth(map.getView().getProjection().getExtent())
            const offset = Math.floor(map.getView().getCenter()[0] / worldWidth)
            currentLine.translate(offset * worldWidth, 0)
            vectorContext.drawGeometry(currentLine)
            currentLine.translate(worldWidth, 0)
            vectorContext.drawGeometry(currentLine)
          }
        }
        map.render()
      }

      function addLater(features, timeout) {
        window.setTimeout(function () {
          let start = Date.now()
          features.forEach(function (feature) {
            feature.set('start', start)
            flightsSource.addFeature(feature)
            const duration = (feature.getGeometry().getCoordinates().length - 1) / pointsPerMs
            start += duration
          })
        }, timeout)
      }

      ExampleGui.addSlider(
        '飞行速度',
        pointsPerMs,
        0.005,
        0.05,
        0.005,
        function (value) {
          pointsPerMs = value
        }
      )

      ExampleGui.addToolbarButton('重新播放', function () {
        flightsSource.clear()
        loadFlights()
      })

      ExampleGui.finishedLoading()
    </script>
  </body>
</html>
