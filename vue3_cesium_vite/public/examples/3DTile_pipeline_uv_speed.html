<!DOCTYPE html>
<html>

<head>
  <link rel="shortcut icon" type="image/x-icon" />
  <title>管道流向动态展示</title>
<script src="/cesium/Cesium.js"></script>
<script src="/defaultAccessToken.js"> </script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <link href="/examples/example-gui.css" rel="stylesheet" />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #toolbar {
      left: 5px;
      top: 5px;
      background: rgba(42, 42, 42, 0.8);
      padding: 4px;
      border-radius: 4px;
    }

    #toolbar input {
      vertical-align: middle;
      padding-top: 2px;
      padding-bottom: 2px;
    }

  </style>
</head>

<body class="dark">
  <div id="cesiumContainer"></div>

  <div id="toolbar">
    
  </div>


  <script type="text/javascript">
    "use script";
    // Power Plant design model provided by Bentley Systems
    Cesium.ExperimentalFeatures.enableModelExperimental = true;
    const viewer = new Cesium.Viewer("cesiumContainer",{timeline:true});
    const scene = viewer.scene;

    const tileset = scene.primitives.add(
      new Cesium.Cesium3DTileset({
        url: "http://172.20.16.213:8888/3dtiles/pipeline_arrow/tileset.json",debugShowBoundingVolume:true,
        customShader: new Cesium.CustomShader({
          lightingModel: Cesium.LightingModel.UNLIT,
          uniforms: {
            u_mapmap: {
              type: Cesium.UniformType.SAMPLER_2D,
              value: new Cesium.TextureUniform({
                url: "http://172.20.16.213:8888/3dtiles/pipeline_arrow/arrow1.png"
              })
            }
          },
          fragmentShaderText: `
            // Color tiles by distance to the camera
            void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material)
            {
                float alpha = texture2D(u_mapmap, vec2(fract(fsInput.attributes.texCoord_0.s - czm_frameNumber/100.0),fsInput.attributes.texCoord_0.t)).a;
                if (alpha == 0.0) {
                    material.diffuse = vec3(0.0, 0.5, 0.0);
                } else {
                    material.diffuse = vec3(1.0, 1.0, 1.0);
                }
            }
            `,
        }),
      })
    );
    tileset.readyPromise
      .then(function (tileset) {
        viewer.zoomTo(
          tileset,
          new Cesium.HeadingPitchRange(
            0.5,
            -0.2,
            tileset.boundingSphere.radius * 4.0
          )
        );
      })


  </script>
</body>

</html>
